<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Categories</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="active">
                    <a href="#" data-category="all">All Categories</a>
                </li>
                <li><a href="#" data-category="SSOE">SSOE</a></li>
                <li><a href="#" data-category="Projector">Projector</a></li>
                <li><a href="#" data-category="ProjectorScreen">Projector Screen</a></li>
                <li><a href="#" data-category="Visualiser">Visualiser</a></li>
                <li><a href="#" data-category="AppleTV">Apple TV</a></li>
                <li><a href="#" data-category="SMAX">SMAX</a></li>
                <li><a href="#" data-category="PortableHDD">Portable HDD</a></li>
                <li><a href="#" data-category="Macbook">Macbook</a></li>
                <li><a href="#" data-category="TV">TV</a></li>
                <li><a href="#" data-category="OMR">OMR</a></li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <div class="container-fluid">
                <h1>Inventory Management System</h1>
                
                <!-- Hidden Category Filter (for compatibility) -->
                <select id="categoryFilter" class="form-select d-none">
                    <option value="all">All Categories</option>
                    <option value="SSOE">SSOE</option>
                    <option value="Projector">Projector</option>
                    <option value="ProjectorScreen">Projector Screen</option>
                    <option value="Visualiser">Visualiser</option>
                    <option value="AppleTV">Apple TV</option>
                    <option value="SMAX">SMAX</option>
                    <option value="PortableHDD">Portable HDD</option>
                    <option value="Macbook">Macbook</option>
                    <option value="TV">TV</option>
                    <option value="OMR">OMR</option>
                </select>

                <div class="action-buttons">
                    <button id="addNewBtn" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add New Item
                    </button>
                    
                    <div class="mass-upload">
                        <div class="upload-container">
                            <input type="file" id="csvFile" accept=".csv" class="form-control">
                            <button id="uploadBtn" class="btn btn-success">
                                <i class="bi bi-upload"></i> Upload CSV
                            </button>
                        </div>
                        <div class="upload-preview" id="uploadPreview">
                            <h4>Upload Preview</h4>
                            <div class="preview-content"></div>
                        </div>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="table-responsive">
                    <table id="inventoryTable" class="table">
                        <thead>
                            <!-- Headers will be dynamically populated -->
                        </thead>
                        <tbody>
                            <!-- Data will be dynamically populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <form id="itemForm">
                <!-- Form fields will be dynamically populated -->
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>
</html>
