<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory System</title>
<link rel="stylesheet" href="styles.css" />
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<style>
  /* Minimal styles for demo */
  body {
    margin: 0; font-family: Arial, sans-serif; display: flex; min-height: 100vh;
  }
  .menu-wrapper {
    display: flex; width: 100%;
  }
  nav.menu-sidebar {
    width: 220px; background: #2c3e50; color: #ecf0f1; padding: 1rem;
  }
  nav.menu-sidebar h3 {
    margin-top: 0;
  }
  nav.menu-sidebar ul.menu-list {
    list-style: none; padding-left: 0;
  }
  nav.menu-sidebar ul.menu-list li {
    margin: 0.8rem 0;
  }
  nav.menu-sidebar ul.menu-list li a {
    color: #bdc3c7; text-decoration: none; font-weight: 600; display: flex; align-items: center;
  }
  nav.menu-sidebar ul.menu-list li.active a,
  nav.menu-sidebar ul.menu-list li a:hover {
    color: #1abc9c;
  }
  nav.menu-sidebar ul.menu-list li a i {
    margin-right: 0.6rem;
  }
  main.main-content {
    flex-grow: 1; padding: 1.5rem; background: #ecf0f1;
  }
  section {
    display: none;
  }
  section.active {
    display: block;
  }
  /* Table styles */
  table {
    border-collapse: collapse; width: 100%; background: white;
  }
  th, td {
    padding: 8px 12px; border: 1px solid #ccc; text-align: left;
  }
  th {
    background: #34495e; color: white;
  }
  /* Buttons */
  .button {
    background-color: #1abc9c; border: none; color: white; padding: 8px 14px;
    margin-right: 0.5rem; cursor: pointer; border-radius: 4px; font-weight: 600;
  }
  .button.secondary {
    background-color: #95a5a6;
  }
  .button:hover {
    opacity: 0.85;
  }
  /* File input hidden */
  .d-none {
    display: none;
  }
</style>
</head>
<body>
<div class="menu-wrapper">
  <nav class="menu-sidebar" aria-label="Main Menu">
    <h3>Inventory Menu</h3>
    <ul class="menu-list">
      <li class="active"><a href="#" id="viewInventoryLink"><i class="fas fa-boxes"></i> View Inventory</a></li>
      <li><a href="#" id="faultReportLink"><i class="fas fa-tools"></i> Fault Report</a></li>
      <li><a href="#" id="patchingReportLink"><i class="fas fa-calendar-check"></i> Patching Report</a></li>
    </ul>
  </nav>

  <main class="main-content" role="main" aria-live="polite">
    <!-- View Inventory Section -->
    <section id="viewInventorySection" class="active" aria-label="View Inventory Section">
      <section class="action-buttons" aria-label="Inventory Actions">
        <div class="mass-upload">
          <label for="csvFile" class="button secondary" style="cursor:pointer;">
            <i class="fas fa-upload"></i> Upload CSV
          </label>
          <input type="file" id="csvFile" accept=".csv" class="d-none" onchange="previewCsv()" aria-describedby="uploadHelp" />
          <button class="button" onclick="handleCsvUpload()">Import CSV</button>
          <button class="button secondary" onclick="closePreview()">Cancel Preview</button>
          <div id="uploadHelp" class="sr-only">Select a CSV file to preview and import inventory data</div>
        </div>

        <div class="export-container" style="margin-top:1rem;">
          <button class="button" onclick="exportToCsv()">Export</button>
          <select id="exportFormat" title="Choose export format" aria-label="Export format">
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
          </select>
        </div>
      </section>

      <section id="uploadPreview" class="upload-preview" aria-live="polite" aria-atomic="true" style="display:none; margin-top: 1rem;">
        <div class="preview-content"></div>
      </section>

      <table id="inventoryTable" class="table" aria-label="Inventory Table" style="margin-top: 1rem;">
        <thead>
          <tr id="tableHeaders">
            <!-- Dynamic headers inserted here -->
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamic inventory rows inserted here -->
        </tbody>
      </table>
    </section>

    <!-- Fault Report Section -->
    <section id="faultReportSection" aria-label="Fault Report Section">
      <h2>Fault Report</h2>
      <p>This is where the Fault Report content will go.</p>
    </section>

    <!-- Patching Report Section -->
    <section id="patchingReportSection" aria-label="Patching Report Section">
      <h2>Patching Report</h2>
      <p>This is where the Patching Report content will go.</p>
    </section>
  </main>
</div>

<script>
  // Tab switching code
  const sections = {
    viewInventorySection: document.getElementById('viewInventorySection'),
    faultReportSection: document.getElementById('faultReportSection'),
    patchingReportSection: document.getElementById('patchingReportSection')
  };

  function setActiveSection(sectionId) {
    Object.entries(sections).forEach(([id, section]) => {
      if(id === sectionId) {
        section.classList.add('active');
      } else {
        section.classList.remove('active');
      }
    });
  }

  function setActiveMenu(linkElement) {
    document.querySelectorAll('.menu-list li').forEach(li => li.classList.remove('active'));
    linkElement.parentElement.classList.add('active');
  }

  document.getElementById('viewInventoryLink').addEventListener('click', function(e){
    e.preventDefault();
    setActiveSection('viewInventorySection');
    setActiveMenu(this);
  });

  document.getElementById('faultReportLink').addEventListener('click', function(e){
    e.preventDefault();
    setActiveSection('faultReportSection');
    setActiveMenu(this);
  });

  document.getElementById('patchingReportLink').addEventListener('click', function(e){
    e.preventDefault();
    setActiveSection('patchingReportSection');
    setActiveMenu(this);
  });

  // Stubbed functions for CSV and inventory actions for demo
  function previewCsv() {
    alert('CSV preview would show here (implement in csv.js)');
  }
  function handleCsvUpload() {
    alert('CSV import logic goes here (implement in csv.js)');
  }
  function closePreview() {
    document.getElementById('uploadPreview').style.display = 'none';
  }
  function exportToCsv() {
    alert('Export functionality here (implement in csv.js)');
  }
</script>
</body>
</html>
