<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory System</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
 <nav class="menu-sidebar">
  <h3>Inventory Menu</h3>
  <ul class="menu-list">
    <li><a href="view-inventory/index.html">View Inventory</a></li>
    <li><a href="fault-report.html">Fault Report</a></li>
    
    <li class="active">
      <a href="patching-report.html">Patching Report</a>
      <ul class="submenu-list">
        <li><a href="patching-summary.html">Summary</a></li>
      </ul>
    </li>

  </ul>
</nav>


    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h1>Inventory Management</h1>
        <button class="button" onclick="openModal()">+ Add Inventory Item</button>
      </header>

      <!-- CSV Controls -->
      <section class="action-buttons">
        <div class="mass-upload">
          <label for="csvFile" class="button secondary" style="cursor:pointer;">
            <i class="fas fa-upload"></i> Upload CSV
          </label>
          <input type="file" id="csvFile" accept=".csv" class="d-none" onchange="previewCsv()" />
          <button class="button" onclick="handleCsvUpload()">Import CSV</button>
          <button class="button secondary" onclick="closePreview()">Cancel Preview</button>
        </div>

        <div class="export-container">
          <button class="button" onclick="exportToCsv()">Export</button>
          <select id="exportFormat">
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
          </select>
        </div>
      </section>

      <!-- Upload Preview -->
      <div id="uploadPreview" class="upload-preview">
        <div class="preview-content"></div>
      </div>

      <!-- Inventory Table -->
      <table id="inventoryTable" class="table" aria-label="Inventory Table">
        <thead>
          <tr id="tableHeaders"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </main>
  </div>

  <!-- Modal Dialog -->
  <div id="itemModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Inventory Item</h2>
      <form id="itemForm">
        <div class="form-group">
          <label for="equipmentType">Equipment Type</label>
          <input type="text" id="equipmentType" name="equipmentType" required />
        </div>
        <div class="form-group">
          <label for="vendor">Vendor</label>
          <input type="text" id="vendor" name="vendor" />
        </div>
        <div class="form-group">
          <label for="brandModel">Brand & Model</label>
          <input type="text" id="brandModel" name="brandModel" />
        </div>
        <div class="form-group">
          <label for="serialNo">Serial No</label>
          <input type="text" id="serialNo" name="serialNo" />
        </div>
        <div class="form-group">
          <label for="assetNo">Asset No</label>
          <input type="text" id="assetNo" name="assetNo" />
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" />
        </div>

        <div class="button-group">
          <button type="button" class="button secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="button">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="inventory.js"></script>
  <script src="csv.js"></script>
  <script src="modal.js"></script>
</body>
</html>
