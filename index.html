<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Inventory Management System</h1>
        
        <!-- Category Filter -->
        <div class="filter-section">
            <select id="categoryFilter" class="form-select">
                <option value="all">All Categories</option>
                <option value="SSOE">SSOE</option>
                <option value="Projector">Projector</option>
                <option value="ProjectorScreen">Projector Screen</option>
                <option value="Visualiser">Visualiser</option>
                <option value="AppleTV">Apple TV</option>
                <option value="SMAX">SMAX</option>
                <option value="PortableHDD">Portable HDD</option>
                <option value="Macbook">Macbook</option>
                <option value="TV">TV</option>
                <option value="OMR">OMR</option>
            </select>
        </div>

        <!-- Add New Item Button -->
        <button id="addNewBtn" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add New Item
        </button>
        
        <!-- Mass Upload -->
        <div class="mass-upload">
            <input type="file" id="csvFile" accept=".csv" class="form-control">
            <button id="uploadBtn" class="btn btn-success">
                <i class="bi bi-upload"></i> Upload CSV
            </button>
        </div>

        <!-- Inventory Table -->
        <table id="inventoryTable" class="table">
            <thead>
                <!-- Headers will be dynamically populated -->
            </thead>
            <tbody>
                <!-- Data will be dynamically populated -->
            </tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <form id="itemForm">
                <!-- Form fields will be dynamically populated -->
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>
</html>
