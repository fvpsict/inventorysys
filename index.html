<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory System</title>
  <link rel="stylesheet" href="styles.css" /> <!-- Your CSS file -->
</head>
<body>

  <!-- Your HTML content goes here -->

  <!-- Modal -->
  <div id="itemModal" style="display:none;">
    <!-- Modal content here -->
  </div>

  <!-- CSV Upload -->
  <input type="file" id="csvFile" accept=".csv" />
  <button onclick="previewCsv()">Preview CSV</button>
  <button onclick="handleCsvUpload()">Import CSV</button>
  <button onclick="closePreview()">Close Preview</button>

  <div id="uploadPreview" style="display:none;">
    <div class="preview-content"></div>
  </div>

  <!-- Inventory Table placeholder -->
  <table id="inventoryTable">
    <!-- Table will be dynamically created -->
  </table>

  <!-- Your other HTML UI elements -->

  <!-- JavaScript files -->
  <script src="modal.js"></script>
  <script src="inventory.js"></script>
  <script src="formatting.js"></script>
  <script src="filter.js"></script>
  <script src="csvParse.js"></script>
  <script src="csvUpload.js"></script>

  <!-- Initialize inventory and table -->
  <script>
    // Make sure to declare the inventory array and functions like saveInventory, createTable globally
    let inventory = [];

    function saveInventory() {
      localStorage.setItem('inventory', JSON.stringify(inventory));
    }

    function loadInventory() {
      const data = localStorage.getItem('inventory');
      if (data) inventory = JSON.parse(data);
    }

    function createTable() {
      // Implement table creation based on inventory array here
      const table = document.getElementById('inventoryTable');
      table.innerHTML = '';

      if(inventory.length === 0) {
        table.innerHTML = '<tr><td>No items</td></tr>';
        return;
      }

      // Create header row dynamically from keys of first item
      const headers = Object.keys(inventory[0]).filter(k => k !== 'id');
      const thead = document.createElement('thead');
      const trHead = document.createElement('tr');
      headers.forEach(h => {
        const th = document.createElement('th');
        th.textContent = formatColumnHeader(h);
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);

      // Create body rows
      const tbody = document.createElement('tbody');
      inventory.forEach(item => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          td.textContent = item[h] || '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    // Load inventory and display table on page load
    window.onload = () => {
      loadInventory();
      createTable();
    };
  </script>

</body>
</html>
