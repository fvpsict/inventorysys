<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 70px;
    }
    .navbar-brand {
      font-weight: bold;
    }
    th, td {
      white-space: nowrap;
    }
    .table-responsive {
      overflow-x: auto;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Inventory System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="SSOE">SSOE</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Projector">Projector</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Projector Screen">Projector Screen</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Visualiser">Visualiser</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Apple TV">Apple TV</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="SMax">SMax</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Portable HDD">Portable HDD</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Macbook">Macbook</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="TV">TV</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="OMR">OMR</a></li>
        <li class="nav-item"><a class="nav-link category-link" href="#" data-category="Hansvision">Hansvision</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <h2 id="categoryTitle">Select a Category</h2>
  <button class="btn btn-primary my-2" onclick="addRow()">Add Item</button>
  <div class="table-responsive">
    <table class="table table-bordered table-hover" id="inventoryTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const commonHeaders = ["EquipmentType", "Vendor", "BrandModel", "AssetNo", "SerialNo", "StartDate", "EndDate", "Room", "RoomNo", "Lamphour", "Duration in use"];
  const ssoeHeaders = ["EquipmentType", "Vendor", "BrandModel", "Profile", "Custodian", "AssetNo", "SerialNumber", "Location", "EndDate", "StartDate", "Hostname", "SSOE PO Number", "Cart No", "SanitiseDate", "Fault"];
  let currentCategory = "";
  let currentHeaders = [];

  document.querySelectorAll(".category-link").forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      currentCategory = e.target.dataset.category;
      currentHeaders = (currentCategory === "SSOE") ? ssoeHeaders : commonHeaders;
      document.getElementById("categoryTitle").innerText = currentCategory + " Inventory";
      loadTable();
    });
  });

  function loadTable() {
    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");
    tableHeader.innerHTML = "";
    tableBody.innerHTML = "";

    currentHeaders.forEach(header => {
      const th = document.createElement("th");
      th.textContent = header;
      tableHeader.appendChild(th);
    });
    const th = document.createElement("th");
    th.textContent = "Actions";
    tableHeader.appendChild(th);

    const data = JSON.parse(localStorage.getItem(currentCategory) || "[]");
    data.forEach((row, index) => {
      const tr = document.createElement("tr");
      currentHeaders.forEach(header => {
        const td = document.createElement("td");
        td.contentEditable = true;
        td.innerText = row[header] || "";
        tr.appendChild(td);
      });
      const td = document.createElement("td");
      td.innerHTML = `<button class="btn btn-danger btn-sm" onclick="deleteRow(${index})">Delete</button>`;
      tr.appendChild(td);
      tableBody.appendChild(tr);
    });

    saveEditsOnChange();
  }

  function addRow() {
    const tableBody = document.getElementById("tableBody");
    const tr = document.createElement("tr");

    currentHeaders.forEach(() => {
      const td = document.createElement("td");
      td.contentEditable = true;
      tr.appendChild(td);
    });

    const td = document.createElement("td");
    td.innerHTML = `<button class="btn btn-danger btn-sm" onclick="deleteRow()">Delete</button>`;
    tr.appendChild(td);
    tableBody.appendChild(tr);

    saveTable();
  }

  function deleteRow(index) {
    const data = JSON.parse(localStorage.getItem(currentCategory) || "[]");
    data.splice(index, 1);
    localStorage.setItem(currentCategory, JSON.stringify(data));
    loadTable();
  }

  function saveEditsOnChange() {
    document.querySelectorAll("#tableBody td[contenteditable]").forEach(cell => {
      cell.addEventListener("input", saveTable);
    });
  }

  function saveTable() {
    const rows = document.querySelectorAll("#tableBody tr");
    const data = [];

    rows.forEach(row => {
      const cells = row.querySelectorAll("td");
      const rowData = {};
      currentHeaders.forEach((header, index) => {
        rowData[header] = cells[index]?.innerText.trim() || "";
      });
      data.push(rowData);
    });

    localStorage.setItem(currentCategory, JSON.stringify(data));
  }
</script>

</body>
</html>
