<!DOCTYPE html>
<html>
<head>
    <title>Equipment Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="menu-wrapper">
        <!-- Left Menu -->
        <nav class="menu-sidebar">
            <h3>Equipment Types</h3>
            <ul class="menu-list">
                <li class="active">
                    <a href="#" data-category="all">
                        <i class="bi bi-grid-fill"></i>
                        <span>All Equipment</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="SSOE">
                        <i class="bi bi-pc-display"></i>
                        <span>SSOE</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="Projector">
                        <i class="bi bi-projector"></i>
                        <span>Projector</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="ProjectorScreen">
                        <i class="bi bi-display"></i>
                        <span>Projector Screen</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="Visualiser">
                        <i class="bi bi-camera"></i>
                        <span>Visualiser</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="AppleTV">
                        <i class="bi bi-apple"></i>
                        <span>Apple TV</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="SMAX">
                        <i class="bi bi-box"></i>
                        <span>SMAX</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="PortableHDD">
                        <i class="bi bi-device-hdd"></i>
                        <span>Portable HDD</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="Macbook">
                        <i class="bi bi-laptop"></i>
                        <span>Macbook</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="TV">
                        <i class="bi bi-tv"></i>
                        <span>TV</span>
                    </a>
                </li>
                <li>
                    <a href="#" data-category="OMR">
                        <i class="bi bi-scanner"></i>
                        <span>OMR</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <h1>Equipment Management System</h1>
            
            <!-- Hidden Category Filter -->
            <select id="categoryFilter" class="form-select d-none">
                <option value="all">All Equipment Types</option>
                <option value="SSOE">SSOE</option>
                <option value="Projector">Projector</option>
                <option value="ProjectorScreen">Projector Screen</option>
                <option value="Visualiser">Visualiser</option>
                <option value="AppleTV">Apple TV</option>
                <option value="SMAX">SMAX</option>
                <option value="PortableHDD">Portable HDD</option>
                <option value="Macbook">Macbook</option>
                <option value="TV">TV</option>
                <option value="OMR">OMR</option>
            </select>

            <div class="action-buttons">
                <button id="addNewBtn" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add New Equipment
                </button>
                
                <div class="mass-upload">
                    <div class="upload-container">
                        <input type="file" id="csvFile" accept=".csv" class="form-control">
                        <button id="uploadBtn" class="btn btn-success">
                            <i class="bi bi-upload"></i> Upload CSV
                        </button>
                    </div>
                    <div class="upload-preview" id="uploadPreview">
                        <h4>Upload Preview</h4>
                        <div class="preview-content"></div>
                    </div>
                </div>
            </div>

            <!-- Equipment Table -->
            <div class="table-responsive">
                <table id="inventoryTable" class="table">
                    <thead>
                        <!-- Headers will be dynamically populated -->
                    </thead>
                    <tbody>
                        <!-- Data will be dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <form id="itemForm">
                <!-- Form fields will be dynamically populated -->
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>
</html>
