<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link href="styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li class="active"><a href="fault-report.html">Fault Report</a></li>
        <li>
          <a href="patching/patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching/patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Submit Fault Report</h2>
      <form id="faultForm">
        <input type="text" id="equipmentType" placeholder="Equipment Type" required />
        <textarea id="faultDescription" placeholder="Fault Description" required></textarea>
        <input type="text" id="reportedBy" placeholder="Reported By" />
        <button type="submit" class="btn btn-primary">Add Fault</button>
      </form>

      <h2>Fault Reports</h2>
      <table>
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Fault Description</th>
            <th>Reported By</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="faultTableBody"></tbody>
      </table>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'faultReports';

    function getFaults() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveFaults(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderFaultTable() {
      const faults = getFaults();
      const tbody = document.getElementById('faultTableBody');
      tbody.innerHTML = '';

      faults.forEach((fault, idx) => {
        const tr = document.createElement('tr');

        ['equipmentType', 'faultDescription', 'reportedBy'].forEach(key => {
          const td = document.createElement('td');
          td.contentEditable = true;
          td.textContent = fault[key];
          td.addEventListener('input', () => {
            fault[key] = td.textContent.trim();
            saveFaults(faults);
          });
          tr.appendChild(td);
        });

        const delTd = document.createElement('td');
        const delBtn = document.createElement('button');
        delBtn.textContent = 'Delete';
        delBtn.className = 'btn btn-danger btn-sm';
        delBtn.onclick = () => {
          if (confirm('Delete this fault report?')) {
            faults.splice(idx, 1);
            saveFaults(faults);
            renderFaultTable();
          }
        };
        delTd.appendChild(delBtn);
        tr.appendChild(delTd);

        tbody.appendChild(tr);
      });
    }

    window.onload = () => {
      renderFaultTable();
      document.getElementById('faultForm').addEventListener('submit', e => {
        e.preventDefault();
        const equipmentType = document.getElementById('equipmentType').value.trim();
        const faultDescription = document.getElementById('faultDescription').value.trim();
        const reportedBy = document.getElementById('reportedBy').value.trim();

        if (!equipmentType || !faultDescription) {
          alert('Fill in Equipment Type and Fault Description');
          return;
        }

        const faults = getFaults();
        faults.push({ equipmentType, faultDescription, reportedBy });
        saveFaults(faults);
        renderFaultTable();
        e.target.reset();
      });

      // Highlight active menu item
      document.querySelectorAll('.menu-list li a').forEach(link => {
        if (link.href === window.location.href) {
          link.parentElement.classList.add('active');
        }
      });
    };
  </script>
</body>
</html>
