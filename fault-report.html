<!-- Fault Report Modal -->
<div
  class="modal fade"
  id="faultModal"
  tabindex="-1"
  aria-labelledby="faultModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="faultForm">
        <div class="modal-header">
          <h5 class="modal-title" id="faultModalLabel">Add / Edit Fault</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <!-- EquipmentType dropdown -->
            <div class="col-md-6">
              <label for="EquipmentType" class="form-label">Equipment Type</label>
              <select id="EquipmentType" name="EquipmentType" class="form-select" required>
                <option value="" disabled selected>Select Equipment Type</option>
                <option value="Projector">Projector</option>
                <option value="Projector Screen">Projector Screen</option>
                <option value="Visualiser">Visualiser</option>
              </select>
            </div>

            <!-- Vendor -->
            <div class="col-md-6">
              <label for="Vendor" class="form-label">Vendor</label>
              <input type="text" id="Vendor" name="Vendor" class="form-control" />
            </div>

            <!-- BrandModel -->
            <div class="col-md-6">
              <label for="BrandModel" class="form-label">BrandModel</label>
              <input type="text" id="BrandModel" name="BrandModel" class="form-control" />
            </div>

            <!-- AssetNo -->
            <div class="col-md-6">
              <label for="AssetNo" class="form-label">Asset No</label>
              <input type="text" id="AssetNo" name="AssetNo" class="form-control" required />
            </div>

            <!-- SerialNumber -->
            <div class="col-md-6">
              <label for="SerialNumber" class="form-label">Serial Number</label>
              <input type="text" id="SerialNumber" name="SerialNumber" class="form-control" />
            </div>

            <!-- EndDate -->
            <div class="col-md-6">
              <label for="EndDate" class="form-label">End Date</label>
              <input type="date" id="EndDate" name="EndDate" class="form-control" />
            </div>

            <!-- StartDate -->
            <div class="col-md-6">
              <label for="StartDate" class="form-label">Start Date</label>
              <input type="date" id="StartDate" name="StartDate" class="form-control" />
            </div>

            <!-- Room -->
            <div class="col-md-6">
              <label for="Room" class="form-label">Room</label>
              <input type="text" id="Room" name="Room" class="form-control" />
            </div>

            <!-- Room Number -->
            <div class="col-md-6">
              <label for="RoomNumber" class="form-label">Room Number</label>
              <input type="text" id="RoomNumber" name="RoomNumber" class="form-control" />
            </div>

            <!-- Level -->
            <div class="col-md-6">
              <label for="Level" class="form-label">Level</label>
              <input type="text" id="Level" name="Level" class="form-control" />
            </div>

            <!-- Lamphour -->
            <div class="col-md-6">
              <label for="Lamphour" class="form-label">Lamphour</label>
              <input type="number" id="Lamphour" name="Lamphour" class="form-control" min="0" />
            </div>

            <!-- Fault -->
            <div class="col-12">
              <label for="Fault" class="form-label">Fault Description</label>
              <textarea id="Fault" name="Fault" class="form-control" rows="2"></textarea>
            </div>

            <!-- Status dropdown -->
            <div class="col-md-6">
              <label for="Status" class="form-label">Status</label>
              <select id="Status" name="Status" class="form-select" required>
                <option value="" disabled selected>Select Status</option>
                <option value="Pending Vendor">Pending Vendor</option>
                <option value="Resolved">Resolved</option>
                <option value="InProgress">InProgress</option>
              </select>
            </div>

            <!-- Date resolved -->
            <div class="col-md-6">
              <label for="DateResolved" class="form-label">Date Resolved</label>
              <input type="date" id="DateResolved" name="DateResolved" class="form-control" />
            </div>

            <!-- Action Taken -->
            <div class="col-12">
              <label for="ActionTaken" class="form-label">Action Taken</label>
              <textarea id="ActionTaken" name="ActionTaken" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="deleteFaultBtn">Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Fault Report Table -->
<div class="table-responsive">
  <table class="table table-bordered table-striped table-sm" id="faultTable">
    <thead>
      <tr>
        <th>EquipmentType</th>
        <th>Vendor</th>
        <th>BrandModel</th>
        <th>AssetNo</th>
        <th>SerialNumber</th>
        <th>EndDate</th>
        <th>StartDate</th>
        <th>Room</th>
        <th>Room Number</th>
        <th>Level</th>
        <th>Lamphour</th>
        <th>Fault</th>
        <th>Status</th>
        <th>Date Resolved</th>
        <th>Action Taken</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows dynamically generated by JS -->
    </tbody>
  </table>
</div>
