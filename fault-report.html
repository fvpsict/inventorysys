<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>

  <!-- Bootstrap CSS (5.3) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom Styles -->
  <style>
    body {
      padding-top: 56px; /* for fixed navbar */
    }
    .container {
      max-width: 1200px;
    }
    #fault-table th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">FVPS Inventory System</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">View Inventory</a></li>
        <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
        <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
      </ul>
    </div>
  </div>
</nav>

  <!-- Main Container -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <label for="filter-equipmenttype" class="form-label mb-0">Filter by Equipment Type:</label>
        <select id="filter-equipmenttype" class="form-select">
          <option value="all" selected>All</option>
          <option value="projector">Projector</option>
          <option value="visualiser">Visualiser</option>
          <option value="projector screen">Projector Screen</option>
          <option value="desktop">Desktop</option>
          <option value="laptop">Laptop</option>
          <option value="ipad">iPad</option>
          <option value="mobile cart">Mobile Cart</option>
          <!-- Add other equipment types as needed -->
        </select>
      </div>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <input
          id="search-fault"
          type="search"
          class="form-control"
          placeholder="Search faults..."
          style="min-width: 220px;"
          aria-label="Search faults"
        />
        <button id="add-fault-btn" class="btn btn-success">Add Fault</button>
      </div>
    </div>

    <!-- Fault Table -->
    <div class="table-responsive">
      <table id="fault-table" class="table table-bordered table-striped align-middle">
        <thead>
          <tr>
            <th>Date Reported</th>
            <th>Equipment Type</th>
            <th>Equipment</th>
            <th>Asset No</th>
            <th>Brand / Model</th>
            <th>Serial Number</th>
            <th>Location</th>
            <th>Room Number</th>
            <th>Fault Description</th>
            <th>Status</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be dynamically generated here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Fault Modal -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="fault-modal-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add / Edit Fault Report</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="DateReported" class="form-label">Date Reported *</label>
                <input type="date" id="DateReported" name="DateReported" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label for="EquipmentType" class="form-label">Equipment Type *</label>
                <select id="EquipmentType" name="EquipmentType" class="form-select" required>
                  <option value="" disabled selected>Select equipment type</option>
                  <option value="Projector">Projector</option>
                  <option value="Visualiser">Visualiser</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Desktop">Desktop</option>
                  <option value="Laptop">Laptop</option>
                  <option value="iPad">iPad</option>
                  <option value="Mobile Cart">Mobile Cart</option>
                  <!-- Add other equipment types as needed -->
                </select>
              </div>

              <div class="col-md-6">
                <label for="Equipment" class="form-label">Equipment</label>
                <input type="text" id="Equipment" name="Equipment" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input type="text" id="AssetNo" name="AssetNo" class="form-control" />
              </div>

              <div class="col-md-6">
                <label for="BrandModel" class="form-label">Brand / Model</label>
                <input type="text" id="BrandModel" name="BrandModel" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="SerialNumber" class="form-label">Serial Number</label>
                <input type="text" id="SerialNumber" name="SerialNumber" class="form-control" />
              </div>

              <div class="col-md-6">
                <label for="Location" class="form-label">Location</label>
                <input type="text" id="Location" name="Location" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="RoomNumber" class="form-label">Room Number</label>
                <input type="text" id="RoomNumber" name="RoomNumber" class="form-control" />
              </div>

              <div class="col-12">
                <label for="FaultDescription" class="form-label">Fault Description *</label>
                <textarea id="FaultDescription" name="FaultDescription" class="form-control" rows="3" required></textarea>
              </div>

              <div class="col-md-6">
                <label for="Status" class="form-label">Status *</label>
                <select id="Status" name="Status" class="form-select" required>
                  <option value="" disabled selected>Select status</option>
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input type="date" id="DateUpdated" name="DateUpdated" class="form-control" disabled />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (with Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Your fault-report.js script -->
  <script src="fault-report.js"></script>
</body>
</html>
