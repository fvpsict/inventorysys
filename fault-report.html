<!DOCTYPE html>
<html lang="en" data-category="FaultReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <input
        type="search"
        id="search-fault"
        class="form-control w-auto"
        placeholder="Search faults..."
      />
      <button id="add-fault-btn" class="btn btn-warning">Add Fault</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="fault-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>AssetNo</th>
            <th>Fault</th>
            <th>Status</th>
            <th>DateReported</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Fault Modal -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="fault-form">
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add Fault</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="fault-EquipmentType" class="form-label">Equipment Type *</label>
                <select
                  id="fault-EquipmentType"
                  name="EquipmentType"
                  class="form-select"
                  required
                >
                  <option value="" selected disabled>Select type</option>
                  <option value="SSOE">SSOE</option>
                  <option value="Projector">Projector</option>
                  <option value="Visualiser">Visualiser</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Desktop">Desktop</option>
                  <option value="Laptop">Laptop</option>
                  <option value="iPad">iPad</option>
                  <option value="Mobile Cart">Mobile Cart</option>
                  <!-- Add other equipment types as needed -->
                </select>
              </div>
              <div class="col-md-6">
                <label for="fault-Equipment" class="form-label">Equipment *</label>
                <input
                  type="text"
                  id="fault-Equipment"
                  name="Equipment"
                  class="form-control"
                  placeholder="Equipment name"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="fault-AssetNo" class="form-label">Asset No</label>
                <input
                  type="text"
                  id="fault-AssetNo"
                  name="AssetNo"
                  class="form-control"
                  placeholder="Asset number"
                />
              </div>
              <div class="col-md-6">
                <label for="fault-Fault" class="form-label">Fault Description *</label>
                <input
                  type="text"
                  id="fault-Fault"
                  name="Fault"
                  class="form-control"
                  placeholder="Describe the fault"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="fault-Status" class="form-label">Status *</label>
                <select
                  id="fault-Status"
                  name="Status"
                  class="form-select"
                  required
                >
                  <option value="" selected disabled>Select status</option>
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="fault-DateReported" class="form-label">Date Reported *</label>
                <input
                  type="date"
                  id="fault-DateReported"
                  name="DateReported"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../fault-report.js"></script>
</body>
</html>
