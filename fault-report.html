<!-- fault-report.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fault Report</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li class="active"><a href="fault-report.html">Fault Report</a></li>
        <li><a href="patching-weekly.html">Patching Report</a></li>
        <li><a href="patching-summary.html">Summary</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Fault Report</h2>

      <textarea id="faultInput" rows="8" placeholder="Paste or enter fault data (comma or tab separated)"></textarea>
      <div class="button-group">
        <button onclick="loadFaultData()">Submit</button>
        <button onclick="clearFaultData()">Clear</button>
      </div>
      <div id="faultTableContainer"></div>
    </main>
  </div>

  <script>
    function loadFaultData() {
      const input = document.getElementById('faultInput').value.trim();
      const lines = input.split('\n');
      const parsed = lines.map(line => line.split(/\t|,/));
      localStorage.setItem('faultData', JSON.stringify(parsed));
      renderFaultTable(parsed);
    }

    function renderFaultTable(data) {
      if (!data.length) return;
      const headers = data[0];
      let html = `<table class="table"><thead><tr>`;
      headers.forEach(h => html += `<th>${h}</th>`);
      html += `</tr></thead><tbody>`;
      for (let i = 1; i < data.length; i++) {
        html += '<tr>' + data[i].map(cell => `<td contenteditable="true">${cell}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('faultTableContainer').innerHTML = html;
    }

    function clearFaultData() {
      localStorage.removeItem('faultData');
      document.getElementById('faultTableContainer').innerHTML = '';
    }

    window.onload = () => {
      const stored = localStorage.getItem('faultData');
      if (stored) renderFaultTable(JSON.parse(stored));
    }
  </script>
</body>
</html>
