<!DOCTYPE html>
<html lang="en" data-category="FaultReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - FVPS Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>
    body {
      padding-top: 70px;
    }
    .table-responsive {
      max-height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link active" href="fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container mt-4">
    <h2 class="mb-4">Fault Report</h2>

    <!-- Controls -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filter-equipmenttype" class="fw-bold mb-0">Filter by Equipment Type:</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all" selected>All</option>
          <option>Projector</option>
          <option>Visualiser</option>
          <option>Projector Screen</option>
          <option>Desktop</option>
          <option>Laptop</option>
          <option>iPad</option>
          <option>Mobile Cart</option>
          <option>SSOE</option>
        </select>
      </div>

      <input type="search" id="search-fault" placeholder="Search faults..." class="form-control w-auto" />
      <button class="btn btn-success" id="add-fault-btn">Add Fault</button>
    </div>

    <!-- Fault Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="fault-table">
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Equipment</th>
            <th>Venue</th>
            <th>Asset No</th>
            <th>Serial No</th>
            <th>Fault</th>
            <th>Status</th>
            <th>Date Reported</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="faultModal" tabindex="-1" aria-labelledby="faultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="fault-form">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="faultModalLabel">Add Fault</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="fault-EquipmentType" class="form-label fw-bold">Equipment Type</label>
                <select id="fault-EquipmentType" name="EquipmentType" class="form-select" required>
                  <option value="">Select</option>
                  <option>Projector</option>
                  <option>Visualiser</option>
                  <option>Projector Screen</option>
                  <option>Desktop</option>
                  <option>Laptop</option>
                  <option>iPad</option>
                  <option>Mobile Cart</option>
                  <option>SSOE</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="fault-Equipment" class="form-label fw-bold">Equipment</label>
                <input type="text" id="fault-Equipment" name="Equipment" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label for="fault-Venue" class="form-label fw-bold">Venue</label>
                <input type="text" id="fault-Venue" name="Venue" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="fault-AssetNo" class="form-label fw-bold">Asset No</label>
                <input type="text" id="fault-AssetNo" name="AssetNo" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="fault-SerialNo" class="form-label fw-bold">Serial Number</label>
                <input type="text" id="fault-SerialNo" name="SerialNo" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="fault-Fault" class="form-label fw-bold">Fault Description</label>
                <textarea id="fault-Fault" name="Fault" class="form-control" rows="2" required></textarea>
              </div>
              <div class="col-md-6">
                <label for="fault-Status" class="form-label fw-bold">Status</label>
                <select id="fault-Status" name="Status" class="form-select" required>
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                  <option value="Pending action by vendor">Pending action by vendor</option>
                  <option value="Faulty">Faulty</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="fault-DateReported" class="form-label fw-bold">Date Reported</label>
                <input type="date" id="fault-DateReported" name="DateReported" class="form-control" required />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
