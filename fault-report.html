<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - Inventory System</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="menu-wrapper">
    <!-- Sidebar Menu -->
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../view-inventory/index.html">View Inventory</a></li>
        <li class="active"><a href="fault-report.html">Fault Report</a></li>
        <li>
          <a href="../patching/patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="../patching/patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <h1>Fault Report</h1>
      
      <div class="btn-group mb-3" role="group" aria-label="Actions">
        <button id="addFaultBtn" class="btn btn-primary">Add Fault</button>
      </div>

      <!-- Fault Table -->
      <table id="faultTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Room</th>
            <th>Room Number</th>
            <th>Level</th>
            <th>Lamphour</th>
            <th>Fault</th>
            <th>Status</th>
            <th>Date resolved</th>
            <th>Action Taken</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="faultTableBody"></tbody>
      </table>

      <!-- Modal Popup for Add/Edit Fault -->
      <div class="modal" tabindex="-1" id="faultModal">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <form id="faultForm">
              <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Fault</h5>
                <button type="button" class="btn-close" aria-label="Close" id="modalCloseBtn"></button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <!-- EquipmentType Dropdown -->
                  <div class="col-md-3">
                    <label for="equipmentType" class="form-label">EquipmentType</label>
                    <select class="form-select" id="equipmentType" name="EquipmentType" required>
                      <option value="">Select...</option>
                      <option value="Projector">Projector</option>
                      <option value="Visualiser">Visualiser</option>
                      <option value="Projector Screen">Projector Screen</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label for="vendor" class="form-label">Vendor</label>
                    <input type="text" class="form-control" id="vendor" name="Vendor" />
                  </div>
                  <div class="col-md-3">
                    <label for="brandModel" class="form-label">BrandModel</label>
                    <input type="text" class="form-control" id="brandModel" name="BrandModel" />
                  </div>
                  <div class="col-md-3">
                    <label for="assetNo" class="form-label">AssetNo</label>
                    <input type="text" class="form-control" id="assetNo" name="AssetNo" />
                  </div>

                  <div class="col-md-3">
                    <label for="serialNumber" class="form-label">SerialNumber</label>
                    <input type="text" class="form-control" id="serialNumber" name="SerialNumber" />
                  </div>
                  <div class="col-md-3">
                    <label for="endDate" class="form-label">EndDate</label>
                    <input type="date" class="form-control" id="endDate" name="EndDate" />
                  </div>
                  <div class="col-md-3">
                    <label for="startDate" class="form-label">StartDate</label>
                    <input type="date" class="form-control" id="startDate" name="StartDate" />
                  </div>
                  <div class="col-md-3">
                    <label for="room" class="form-label">Room</label>
                    <input type="text" class="form-control" id="room" name="Room" />
                  </div>

                  <div class="col-md-3">
                    <label for="roomNumber" class="form-label">Room Number</label>
                    <input type="text" class="form-control" id="roomNumber" name="RoomNumber" />
                  </div>
                  <div class="col-md-3">
                    <label for="level" class="form-label">Level</label>
                    <input type="text" class="form-control" id="level" name="Level" />
                  </div>
                  <div class="col-md-3">
                    <label for="lamphour" class="form-label">Lamphour</label>
                    <input type="number" class="form-control" id="lamphour" name="Lamphour" />
                  </div>
                  <div class="col-md-3">
                    <label for="fault" class="form-label">Fault</label>
                    <input type="text" class="form-control" id="fault" name="Fault" />
                  </div>

                  <!-- Status Dropdown -->
                  <div class="col-md-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="Status">
                      <option value="">Select...</option>
                      <option value="Open">Open</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Resolved">Resolved</option>
                      <option value="Closed">Closed</option>
                    </select>
                  </div>

                  <div class="col-md-3">
                    <label for="dateResolved" class="form-label">Date resolved</label>
                    <input type="date" class="form-control" id="dateResolved" name="DateResolved" />
                  </div>
                  <div class="col-md-6">
                    <label for="actionTaken" class="form-label">Action Taken</label>
                    <input type="text" class="form-control" id="actionTaken" name="ActionTaken" />
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="submit" class="btn btn-primary" id="saveFaultBtn">Save</button>
                <button type="button" class="btn btn-secondary" id="cancelFaultBtn">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Constants & Elements
    const STORAGE_KEY = 'faultData';
    let faultData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const faultTableBody = document.getElementById('faultTableBody');
    const faultModal = document.getElementById('faultModal');
    const faultForm = document.getElementById('faultForm');
    const modalTitle = document.getElementById('modalTitle');
    const addFaultBtn = document.getElementById('addFaultBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const cancelFaultBtn = document.getElementById('cancelFaultBtn');

    let editingIndex = null;

    // Status options for inline select in table
    const statusOptions = ["", "Open", "In Progress", "Resolved", "Closed"];

    // Utility functions
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(faultData));
    }

    function openModal() {
      faultModal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      faultModal.style.display = 'none';
      document.body.style.overflow = '';
      faultForm.reset();
      editingIndex = null;
    }

    function fillForm(data) {
      for (const key in data) {
        if (faultForm.elements[key]) {
          faultForm.elements[key].value = data[key];
        }
      }
    }

    function renderFaultTable() {
      faultTableBody.innerHTML = '';
      faultData.forEach((fault, index) => {
        const tr = document.createElement('tr');

        // Render all columns except Status & Actions
        [
          'EquipmentType', 'Vendor', 'BrandModel', 'AssetNo', 'SerialNumber',
          'EndDate', 'StartDate', 'Room', 'RoomNumber', 'Level', 'Lamphour',
          'Fault', 'DateResolved', 'ActionTaken'
        ].forEach(field => {
          const td = document.createElement('td');
          td.textContent = fault[field] || '';
          tr.appendChild(td);
        });

        // Status dropdown inline editable
        const statusTd = document.createElement('td');
        const statusSelect = document.createElement('select');
        statusSelect.className = 'form-select form-select-sm';
        statusOptions.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt || '(None)';
          if (opt === fault.Status) option.selected = true;
          statusSelect.appendChild(option);
        });
        statusSelect.addEventListener('change', () => {
          faultData[index].Status = statusSelect.value;
          saveData();
        });
        statusTd.appendChild(statusSelect);
        tr.appendChild(statusTd);

        // Actions: Edit button
        const actionTd = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-warning';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => openEditModal(index));
        actionTd.appendChild(editBtn);

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-sm btn-danger ms-2';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          if (confirm('Are you sure you want to delete this fault?')) {
            faultData.splice(index, 1);
            saveData();
            renderFaultTable();
          }
        });
        actionTd.appendChild(deleteBtn);

        tr.appendChild(actionTd);

        faultTableBody.appendChild(tr);
      });
    }

    function openEditModal(index) {
      editingIndex = index;
      modalTitle.textContent = 'Edit Fault';
      fillForm(faultData[index]);
      openModal();
    }

    // Event Listeners
    addFaultBtn.addEventListener('click', () => {
      editingIndex = null;
      modalTitle.textContent = 'Add Fault';
      faultForm.reset();
      openModal();
    });

    modalCloseBtn.addEventListener('click', closeModal);
    cancelFaultBtn.addEventListener('click', closeModal);

    faultForm.addEventListener('submit', e => {
      e.preventDefault();
      const formData = new FormData(faultForm);
      const newFault = {};
      formData.forEach((value, key) => {
        newFault[key] = value.trim();
      });

      if (editingIndex !== null) {
        faultData[editingIndex] = newFault;
      } else {
        faultData.push(newFault);
      }
      saveData();
      renderFaultTable();
      closeModal();
    });

    // Close modal on clicking outside content
    window.addEventListener('click', e => {
      if (e.target === faultModal) closeModal();
    });

    // Render on page load
    window.onload = () => {
      renderFaultTable();

      // Highlight active menu link
      document.querySelectorAll('.menu-list li').forEach(li => {
        li.classList.remove('active');
      });
      document.querySelector('.menu-list li:nth-child(3)').classList.add('active');
    };
  </script>
</body>
</html>
