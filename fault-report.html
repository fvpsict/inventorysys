<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="https://fvpsict.github.io/inventorysys/index.html">Home</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link active" aria-current="page" href="#">Fault Report</a>
          <!-- Add other menu links here -->
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <label for="filter-equipmenttype" class="form-label me-2">Filter by Equipment Type:</label>
        <select id="filter-equipmenttype" class="form-select d-inline-block w-auto">
          <option value="All">All</option>
          <option>Projector</option>
          <option>Visualiser</option>
          <option>Projector Screen</option>
          <option>Desktop</option>
          <option>Laptop</option>
          <option>iPad</option>
          <option>Mobile Cart</option>
          <!-- Add other types as needed -->
        </select>
      </div>
      <div>
        <input
          type="search"
          id="search-fault"
          class="form-control"
          placeholder="Search faults..."
          style="width: 250px"
        />
      </div>
      <button class="btn btn-success" id="add-fault-btn">Add Fault</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="fault-table">
        <thead class="table-primary">
          <tr>
            <th>Date Reported</th>
            <th>Equipment Type</th>
            <th>Equipment</th>
            <th>Asset No</th>
            <th>Brand / Model</th>
            <th>Serial Number</th>
            <th>Location</th>
            <th>Room Number</th>
            <th>Fault Description</th>
            <th>Status</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filled dynamically by fault-report.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal for Add/Edit Fault -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="fault-modal-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add / Edit Fault Report</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="DateReported" class="form-label">Date Reported <span class="text-danger">*</span></label>
                <input
                  type="date"
                  class="form-control"
                  id="DateReported"
                  name="DateReported"
                  required
                />
              </div>
              <div class="col-md-4">
                <label for="EquipmentType" class="form-label">Equipment Type <span class="text-danger">*</span></label>
                <select class="form-select" id="EquipmentType" name="EquipmentType" required>
                  <option value="" selected disabled>Select type</option>
                  <option>Projector</option>
                  <option>Visualiser</option>
                  <option>Projector Screen</option>
                  <option>Desktop</option>
                  <option>Laptop</option>
                  <option>iPad</option>
                  <option>Mobile Cart</option>
                  <!-- Add more options as needed -->
                </select>
              </div>
              <div class="col-md-4">
                <label for="Equipment" class="form-label">Equipment</label>
                <input
                  type="text"
                  class="form-control"
                  id="Equipment"
                  name="Equipment"
                  placeholder="Optional"
                />
              </div>

              <div class="col-md-4">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input
                  type="text"
                  class="form-control"
                  id="AssetNo"
                  name="AssetNo"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-4">
                <label for="BrandModel" class="form-label">Brand / Model</label>
                <input
                  type="text"
                  class="form-control"
                  id="BrandModel"
                  name="BrandModel"
                />
              </div>
              <div class="col-md-4">
                <label for="SerialNumber" class="form-label">Serial Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="SerialNumber"
                  name="SerialNumber"
                  placeholder="Optional"
                />
              </div>

              <div class="col-md-4">
                <label for="Location" class="form-label">Location</label>
                <input
                  type="text"
                  class="form-control"
                  id="Location"
                  name="Location"
                />
              </div>
              <div class="col-md-4">
                <label for="RoomNumber" class="form-label">Room Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="RoomNumber"
                  name="RoomNumber"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-12">
                <label for="FaultDescription" class="form-label">Fault Description <span class="text-danger">*</span></label>
                <textarea
                  class="form-control"
                  id="FaultDescription"
                  name="FaultDescription"
                  rows="3"
                  required
                ></textarea>
              </div>
              <div class="col-md-4">
                <label for="Status" class="form-label">Status <span class="text-danger">*</span></label>
                <select class="form-select" id="Status" name="Status" required>
                  <option value="" selected disabled>Select status</option>
                  <option>Open</option>
                  <option>In Progress</option>
                  <option>Resolved</option>
                  <option>Closed</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  class="form-control"
                  id="DateUpdated"
                  name="DateUpdated"
                  readonly
                  placeholder="Auto-updated"
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
