<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fault Report</title>
  <link href="styles.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>body{padding-top:70px}.table-responsive{max-height:70vh;overflow-y:auto}</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link active" href="fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <h2 class="mb-3">Fault Report</h2>
    <div class="d-flex gap-2 mb-3">
      <select id="filter-equipmenttype" class="form-select w-auto">
        <option value="all" selected>All Types</option>
        <option>Projector</option><option>Visualiser</option><option>Projector Screen</option><option>Desktop</option><option>Laptop</option><option>iPad</option><option>Mobile Cart</option><option>SSOE</option>
      </select>
      <input type="search" id="search-fault" class="form-control flex-grow-1" placeholder="Search faults..." />
      <button id="add-fault-btn" class="btn btn-success">Add Fault</button>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="fault-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th><th>Equipment</th><th>Venue</th><th>AssetNo</th><th>SerialNo</th><th>Fault</th><th>Status</th><th>DateReported</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="faultModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="fault-form" novalidate>
          <div class="modal-header bg-primary text-white"><h5 class="modal-title">Add Fault</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
          <div class="modal-body row g-3">
            <div class="col-md-6"><label class="form-label">EquipmentType *</label><select name="EquipmentType" class="form-select" required><option value="">Select</option><option>Projector</option><option>Visualiser</option><option>Projector Screen</option><option>Desktop</option><option>Laptop</option><option>iPad</option><option>Mobile Cart</option><option>SSOE</option></select></div>
            <div class="col-md-6"><label class="form-label">Equipment *</label><input name="Equipment" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Venue</label><input name="Venue" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">AssetNo</label><input name="AssetNo" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">SerialNo</label><input name="SerialNo" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Fault *</label><textarea name="Fault" class="form-control" rows="2" required></textarea></div>
            <div class="col-md-6"><label class="form-label">Status *</label><select name="Status" class="form-select" required><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option><option>Pending action by vendor</option><option>Faulty</option></select></div>
            <div class="col-md-6"><label class="form-label">DateReported *</label><input type="date" name="DateReported" class="form-control" required></div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save Fault</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
