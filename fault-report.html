<!DOCTYPE html>
<html lang="en" data-category="FaultReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="styles.css" rel="stylesheet" />
  <style>
    body {
      padding-top: 70px;
    }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Fault Report</h1>
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addFaultModal"
      >
        Add Fault
      </button>
    </div>

    <div class="table-responsive">
      <table
        id="faultTable"
        class="table table-bordered table-striped table-sm"
      >
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Status</th>
            <th>Fault Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Add Fault Modal -->
  <div
    class="modal fade"
    id="addFaultModal"
    tabindex="-1"
    aria-labelledby="addFaultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <form id="faultForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addFaultModalLabel">Add New Fault</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="equipmentType" class="form-label">Equipment Type</label>
            <select
              id="equipmentType"
              name="EquipmentType"
              class="form-select"
              required
            >
              <option value="" disabled selected>Select type</option>
              <option>Projector</option>
              <option>Visualiser</option>
              <option>Projector Screen</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="Status" class="form-select" required>
              <option value="" disabled selected>Select status</option>
              <option>Open</option>
              <option>In Progress</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="faultDescription" class="form-label">Fault Description</label>
            <textarea
              id="faultDescription"
              name="Fault"
              class="form-control"
              rows="3"
              required
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Add Fault</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
