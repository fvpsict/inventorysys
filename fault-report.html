<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Fault Report</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- Add nav items here if needed -->
      </div>
    </div>
  </nav>

  <!-- Main container -->
  <main class="container inventory-container mt-5 pt-3">
    <!-- Filter, Search, Add button row -->
    <div class="d-flex flex-wrap align-items-end gap-3 mb-3">
      <div class="flex-grow-1" style="max-width: 320px;">
        <label for="filter-fault-equipmenttype" class="form-label fw-semibold"
          >Filter by Equipment Type</label
        >
        <select id="filter-fault-equipmenttype" class="form-select">
          <option value="All" selected>All</option>
          <option value="Projector">Projector</option>
          <option value="Visualiser">Visualiser</option>
          <option value="Projector Screen">Projector Screen</option>
        </select>
      </div>

      <div class="flex-grow-1" style="max-width: 320px;">
        <label for="search-fault" class="form-label fw-semibold">Search</label>
        <input
          type="search"
          id="search-fault"
          class="form-control"
          placeholder="Search faults..."
          aria-label="Search faults"
        />
      </div>

      <div>
        <button
          id="add-fault-btn"
          type="button"
          class="btn btn-success"
          style="min-width: 120px;"
        >
          Add Fault
        </button>
      </div>
    </div>

    <!-- Fault report table -->
    <div class="table-responsive">
      <table id="fault-table" class="inventory-table table table-bordered table-hover">
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Vendor</th>
            <th>Brand Model</th>
            <th>Asset No</th>
            <th>Serial Number</th>
            <th>Location</th>
            <th>Status</th>
            <th>Fault</th>
            <th>Date Reported</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows populated dynamically by fault-report.js -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Fault Modal -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="fault-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add Fault Report</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Form fields dynamically generated by fault-report.js -->
          </div>
          <div class="modal-footer">
            <!-- Buttons dynamically generated by fault-report.js -->
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
