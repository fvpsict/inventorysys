<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link href="styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      padding-top: 70px; /* space for fixed navbar */
    }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link active" href="fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-3">
    <h1>Fault Report</h1>

    <!-- Fault Report Form -->
    <form id="faultForm" class="row g-2 align-items-end mb-4">
      <div class="col-md-3">
        <label for="equipmentType" class="form-label">Equipment Type</label>
        <select id="equipmentType" name="EquipmentType" class="form-select" required>
          <option value="">Select</option>
          <option value="Projector">Projector</option>
          <option value="Visualiser">Visualiser</option>
          <option value="Projector Screen">Projector Screen</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="faultDescription" class="form-label">Fault Description</label>
        <input type="text" id="faultDescription" name="Fault" class="form-control" required />
      </div>
      <div class="col-md-2">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="Status" class="form-select" required>
          <option value="">Select</option>
          <option>Open</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Closed</option>
        </select>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-primary w-100">Add</button>
      </div>
    </form>

    <!-- Fault Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped table-sm" id="faultTable">
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Fault</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
