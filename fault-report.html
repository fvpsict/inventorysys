<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - Inventory System</title>
  <link rel="stylesheet" href="styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>
<body>
  <div class="menu-wrapper">
    <!-- Sidebar -->
    <nav class="menu-sidebar" aria-label="Inventory System Navigation">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="index.html"><i class="fas fa-boxes"></i> View Inventory</a></li>
        <li class="active"><a href="#"><i class="fas fa-tools"></i> Fault Report</a></li>
        <li><a href="patching-report.html"><i class="fas fa-calendar-check"></i> Patching Report</a></li>
      </ul>
    </nav>

    <!-- Main content -->
    <main class="main-content" role="main" tabindex="-1">
      <h1>Fault Report</h1>
      <p>
        Paste your raw fault report data below (tab or comma separated columns) including headers.<br />
        Then click <strong>Process Data</strong> to generate the table and summary counts.
      </p>

      <section class="action-buttons" style="margin-bottom:1rem;">
        <textarea
          id="rawFaultData"
          placeholder="Paste raw fault report data here..."
          aria-label="Raw Fault Report Data Input"
        ></textarea>
        <button class="button" onclick="processFaultData()">Process Data</button>
      </section>

      <section id="faultReportSection" style="display:none;">
        <h2>Parsed Fault Report Data</h2>
        <table id="faultTable" class="table" aria-label="Fault Report Data Table">
          <thead></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>

        <h2>Summary by Status</h2>
        <ul id="statusSummary"></ul>
      </section>
    </main>
  </div>

  <script>
    // Fault Report Processing code - reuse or enhance from previous version

    const statusColumnName = 'STATUS';

    function processFaultData() {
      const raw = document.getElementById('rawFaultData').value.trim();
      if (!raw) {
        alert('Please paste your raw fault report data first.');
        return;
      }

      const lines = raw.split(/\r?\n/).filter((l) => l.trim() !== '');
      const delimiter = lines[0].includes('\t') ? '\t' : ',';

      // Parse headers
      const headers = lines[0].split(delimiter).map((h) => h.trim());

      // Get index of STATUS column for summary
      const statusIdx = headers.findIndex(
        (h) => h.toUpperCase() === statusColumnName.toUpperCase()
      );

      const table = document.getElementById('faultTable');
      const thead = table.querySelector('thead');
      const tbody = table.querySelector('tbody');
      const tfoot = table.querySelector('tfoot');
      const summaryList = document.getElementById('statusSummary');
      const faultReportSection = document.getElementById('faultReportSection');

      thead.innerHTML = '';
      tbody.innerHTML = '';
      tfoot.innerHTML = '';
      summaryList.innerHTML = '';

      // Show section
      faultReportSection.style.display = 'block';

      // Build header row
      const headerRow = document.createElement('tr');
      headers.forEach((h) => {
        const th = document.createElement('th');
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Collect status counts
      const statusCounts = {};

      // Build data rows
      for (let i = 1; i < lines.length; i++) {
        const row = document.createElement('tr');
        const cells = lines[i].split(delimiter);
        cells.forEach((cell, idx) => {
          const td = document.createElement('td');
          td.textContent = cell.trim();
          row.appendChild(td);
        });
        tbody.appendChild(row);

        // Count statuses
        if (statusIdx !== -1) {
          const statusVal = (cells[statusIdx] || '').trim().toUpperCase();
          if (statusVal) {
            statusCounts[statusVal] = (statusCounts[statusVal] || 0) + 1;
          }
        }
      }

      // Footer row: total count of rows
      const footerRow = document.createElement('tr');
      headers.forEach((h, idx) => {
        const td = document.createElement('td');
        if (idx === 0) {
          td.textContent = 'TOTAL ROWS';
          td.style.fontWeight = 'bold';
          td.style.textAlign = 'left';
        } else if (idx === 1) {
          td.textContent = lines.length - 1;
        } else {
          td.textContent = '';
        }
        footerRow.appendChild(td);
      });
      tfoot.appendChild(footerRow);

      // Display summary counts
      for (const [status, count] of Object.entries(statusCounts)) {
        const li = document.createElement('li');
        li.textContent = `${status}: ${count}`;
        summaryList.appendChild(li);
      }
    }
  </script>
</body>
</html>
