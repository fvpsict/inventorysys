<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
   <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .menu-wrapper {
      display: flex;
      height: 100vh;
    }

    .menu-sidebar {
      width: 200px;
      background: #343a40;
      color: white;
      padding: 1rem;
    }

    .menu-sidebar h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .menu-list {
      list-style: none;
      padding: 0;
    }

    .menu-list li {
      margin: 0.5rem 0;
    }

    .menu-list li a {
      color: white;
      text-decoration: none;
    }

    .menu-list li.active > a {
      font-weight: bold;
      text-decoration: underline;
    }

    .submenu-list {
      list-style: none;
      padding-left: 1rem;
      margin-top: 0.25rem;
    }

    .submenu-list li a {
      font-size: 0.9rem;
      color: #ccc;
      text-decoration: none;
    }

    .submenu-list li a:hover {
      text-decoration: underline;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: #f9f9f9;
    }

    textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 1rem;
      font-family: monospace;
      resize: vertical;
    }

    .table th, .table td {
      border: 1px solid #ccc;
      padding: 0.5rem;
    }

    .button-group button {
      margin-right: 0.5rem;
    }
  </style>

<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar" aria-label="Main Navigation">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li class="active"><a href="fault-report.html" aria-current="page">Fault Report</a></li>
        <li>
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content" role="main">
      <section class="form-section">
        <h2>Submit Fault Report</h2>
        <form id="faultForm">
          <div class="mb-3">
            <label for="equipmentType" class="form-label">Equipment Type</label>
            <input type="text" class="form-control" id="equipmentType" required />
          </div>
          <div class="mb-3">
            <label for="faultDescription" class="form-label">Fault Description</label>
            <textarea class="form-control" id="faultDescription" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="reportedBy" class="form-label">Reported By</label>
            <input type="text" class="form-control" id="reportedBy" />
          </div>
          <button type="submit" class="btn btn-primary">Add Fault</button>
          <button type="button" class="btn btn-danger ms-2" onclick="clearFaults()">Clear All Faults</button>
        </form>
      </section>

      <section>
        <h2>Fault Reports</h2>
        <div id="faultTableContainer"></div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'faultReports';

    function getFaults() {
      const faults = localStorage.getItem(STORAGE_KEY);
      return faults ? JSON.parse(faults) : [];
    }

    function saveFaults(faults) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(faults));
    }

    function renderFaultTable() {
      const faults = getFaults();
      if (faults.length === 0) {
        document.getElementById('faultTableContainer').innerHTML = '<p>No fault reports submitted yet.</p>';
        return;
      }

      let html = `<table class="table table-striped">
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Fault Description</th>
            <th>Reported By</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>`;

      faults.forEach((fault, index) => {
        html += `
          <tr>
            <td contenteditable="true" oninput="updateFault(${index}, 'equipmentType', this.innerText)">${fault.equipmentType}</td>
            <td contenteditable="true" oninput="updateFault(${index}, 'faultDescription', this.innerText)">${fault.faultDescription}</td>
            <td contenteditable="true" oninput="updateFault(${index}, 'reportedBy', this.innerText)">${fault.reportedBy}</td>
            <td><button class="delete-btn" onclick="deleteFault(${index})" aria-label="Delete fault report">Delete</button></td>
          </tr>`;
      });

      html += '</tbody></table>';
      document.getElementById('faultTableContainer').innerHTML = html;
    }

    function updateFault(index, key, value) {
      const faults = getFaults();
      if (faults[index]) {
        faults[index][key] = value.trim();
        saveFaults(faults);
      }
    }

    function deleteFault(index) {
      const faults = getFaults();
      if (index >= 0 && index < faults.length) {
        if (confirm('Are you sure you want to delete this fault report?')) {
          faults.splice(index, 1);
          saveFaults(faults);
          renderFaultTable();
        }
      }
    }

    document.getElementById('faultForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const equipmentType = document.getElementById('equipmentType').value.trim();
      const faultDescription = document.getElementById('faultDescription').value.trim();
      const reportedBy = document.getElementById('reportedBy').value.trim();

      if (!equipmentType || !faultDescription) {
        alert('Please fill in required fields: Equipment Type and Fault Description.');
        return;
      }

      const faults = getFaults();
      faults.push({ equipmentType, faultDescription, reportedBy });
      saveFaults(faults);
      renderFaultTable();

      e.target.reset();
    });

    function clearFaults() {
      if (confirm('Are you sure you want to clear all fault reports?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderFaultTable();
      }
    }

    window.onload = () => {
      renderFaultTable();
    };
  </script>
</body>
</html>
