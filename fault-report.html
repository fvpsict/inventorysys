<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container mt-4">
    <h2>Fault Report</h2>
    <button class="btn btn-success mb-3" id="addFaultBtn">Add Fault</button>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="faultTable">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Room</th>
            <th>RoomNumber</th>
            <th>Level</th>
            <th>Lamphour</th>
            <th>Fault</th>
            <th>Status</th>
            <th>DateResolved</th>
            <th>ActionTaken</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <form id="faultForm">
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add/Edit Fault</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="EquipmentType" class="form-label">Equipment Type</label>
                <select class="form-select" id="EquipmentType" name="EquipmentType" required></select>
              </div>
              <div class="col-md-3">
                <label for="Vendor" class="form-label">Vendor</label>
                <input type="text" class="form-control" id="Vendor" name="Vendor" />
              </div>
              <div class="col-md-3">
                <label for="BrandModel" class="form-label">BrandModel</label>
                <input type="text" class="form-control" id="BrandModel" name="BrandModel" />
              </div>
              <div class="col-md-3">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input type="text" class="form-control" id="AssetNo" name="AssetNo" />
              </div>
              <div class="col-md-3">
                <label for="SerialNumber" class="form-label">Serial Number</label>
                <input type="text" class="form-control" id="SerialNumber" name="SerialNumber" />
              </div>
              <div class="col-md-3">
                <label for="EndDate" class="form-label">End Date</label>
                <input type="date" class="form-control" id="EndDate" name="EndDate" />
              </div>
              <div class="col-md-3">
                <label for="StartDate" class="form-label">Start Date</label>
                <input type="date" class="form-control" id="StartDate" name="StartDate" />
              </div>
              <div class="col-md-3">
                <label for="Room" class="form-label">Room</label>
                <input type="text" class="form-control" id="Room" name="Room" />
              </div>
              <div class="col-md-3">
                <label for="RoomNumber" class="form-label">Room Number</label>
                <input type="text" class="form-control" id="RoomNumber" name="RoomNumber" />
              </div>
              <div class="col-md-3">
                <label for="Level" class="form-label">Level</label>
                <input type="text" class="form-control" id="Level" name="Level" />
              </div>
              <div class="col-md-3">
                <label for="Lamphour" class="form-label">Lamphour</label>
                <input type="text" class="form-control" id="Lamphour" name="Lamphour" />
              </div>
              <div class="col-md-6">
                <label for="Fault" class="form-label">Fault</label>
                <input type="text" class="form-control" id="Fault" name="Fault" />
              </div>
              <div class="col-md-3">
                <label for="Status" class="form-label">Status</label>
                <select class="form-select" id="Status" name="Status" required></select>
              </div>
              <div class="col-md-3">
                <label for="DateResolved" class="form-label">Date Resolved</label>
                <input type="date" class="form-control" id="DateResolved" name="DateResolved" />
              </div>
              <div class="col-md-6">
                <label for="ActionTaken" class="form-label">Action Taken</label>
                <input type="text" class="form-control" id="ActionTaken" name="ActionTaken" />
              </div>
              <div class="col-md-3">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input type="text" readonly class="form-control" id="DateUpdated" name="DateUpdated" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-danger me-auto"
              id="deleteFaultBtn"
              style="display:none"
            >
              Delete
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
