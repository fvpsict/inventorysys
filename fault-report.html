<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - Inventory System</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="index.html"><i class="fas fa-boxes"></i> View Inventory</a></li>
        <li class="active"><a href="#"><i class="fas fa-tools"></i> Fault Report</a></li>
        <li><a href="patching-report.html"><i class="fas fa-calendar-check"></i> Patching Report</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h1>Fault Report</h1>

      <section class="action-buttons">
        <button class="button" onclick="showFaultForm()">Add Fault Report</button>
        <button class="button secondary" onclick="downloadFaultCSV()">Export CSV</button>
      </section>

      <table id="faultTable" class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Equipment</th>
            <th>Serial No</th>
            <th>Room</th>
            <th>Status</th>
            <th>Action Taken</th>
            <th>Date Resolved</th>
          </tr>
        </thead>
        <tbody id="faultBody">
          <!-- Fault entries go here -->
        </tbody>
      </table>

      <!-- Modal for Fault Entry -->
      <div id="faultModal" class="modal">
        <div class="modal-content">
          <h2>Add Fault Report</h2>
          <form id="faultForm">
            <div class="form-group">
              <label for="faultDate">Date</label>
              <input type="date" id="faultDate" required />
            </div>
            <div class="form-group">
              <label for="faultEquipment">Equipment</label>
              <input type="text" id="faultEquipment" required />
            </div>
            <div class="form-group">
              <label for="faultSerial">Serial No</label>
              <input type="text" id="faultSerial" />
            </div>
            <div class="form-group">
              <label for="faultRoom">Room</label>
              <input type="text" id="faultRoom" />
            </div>
            <div class="form-group">
              <label for="faultStatus">Status</label>
              <select id="faultStatus">
                <option value="Pending">Pending</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
            <div class="form-group">
              <label for="faultAction">Action Taken</label>
              <textarea id="faultAction"></textarea>
            </div>
            <div class="form-group">
              <label for="faultResolved">Date Resolved</label>
              <input type="date" id="faultResolved" />
            </div>

            <div class="button-group">
              <button type="button" class="button secondary" onclick="closeFaultModal()">Cancel</button>
              <button type="submit" class="button">Save</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    const faultModal = document.getElementById('faultModal');
    const faultForm = document.getElementById('faultForm');
    const faultBody = document.getElementById('faultBody');

    function showFaultForm() {
      faultModal.style.display = 'block';
    }

    function closeFaultModal() {
      faultModal.style.display = 'none';
      faultForm.reset();
    }

    faultForm.onsubmit = (e) => {
      e.preventDefault();
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${faultDate.value}</td>
        <td>${faultEquipment.value}</td>
        <td>${faultSerial.value}</td>
        <td>${faultRoom.value}</td>
        <td>${faultStatus.value}</td>
        <td>${faultAction.value}</td>
        <td>${faultResolved.value}</td>
      `;
      faultBody.appendChild(row);
      closeFaultModal();
    };

    function downloadFaultCSV() {
      let csv = "Date,Equipment,Serial No,Room,Status,Action Taken,Date Resolved\n";
      document.querySelectorAll("#faultBody tr").forEach(row => {
        const cells = row.querySelectorAll("td");
        csv += Array.from(cells).map(td => `"${td.textContent}"`).join(",") + "\n";
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "fault-report.csv";
      a.click();
    }

    window.onclick = function(e) {
      if (e.target == faultModal) closeFaultModal();
    }
  </script>
</body>
</html>
