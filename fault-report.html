<!DOCTYPE html>
<html lang="en" data-category="FaultReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="styles.css" rel="stylesheet" />
  <style>
    body {
      padding-top: 70px; /* Space for fixed navbar */
    }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Fault Report</h1>
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addFaultModal"
      >
        Add Fault
      </button>
    </div>

    <div class="table-responsive">
      <table
        id="faultTable"
        class="table table-bordered table-striped table-sm"
      >
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Status</th>
            <th>Fault Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Add Fault Modal -->
  <div
    class="modal fade"
    id="addFaultModal"
    tabindex="-1"
    aria-labelledby="addFaultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <form id="faultForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addFaultModalLabel">Add New Fault</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="equipmentType" class="form-label">Equipment Type</label>
            <select
              id="equipmentType"
              name="EquipmentType"
              class="form-select"
              required
            >
              <option value="" disabled selected>Select type</option>
              <option>Projector</option>
              <option>Visualiser</option>
              <option>Projector Screen</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="Status" class="form-select" required>
              <option value="" disabled selected>Select status</option>
              <option>Open</option>
              <option>In Progress</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="faultDescription" class="form-label">Fault Description</label>
            <textarea
              id="faultDescription"
              name="Fault"
              class="form-control"
              rows="3"
              required
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Add Fault</button>
        </div>
      </form>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const faultTableBody = document.querySelector('#faultTable tbody');
      const faultForm = document.getElementById('faultForm');
      const addFaultModal = new bootstrap.Modal(document.getElementById('addFaultModal'));
      
      // Load faults from localStorage or initialize empty array
      let faults = JSON.parse(localStorage.getItem('faults')) || [];

      // Render faults into table
      function renderFaults() {
        faultTableBody.innerHTML = '';
        faults.forEach((fault, idx) => {
          const tr = document.createElement('tr');

          // EquipmentType
          const tdType = document.createElement('td');
          tdType.textContent = fault.EquipmentType || '';
          tr.appendChild(tdType);

          // Status with inline editable dropdown
          const tdStatus = document.createElement('td');
          const statusSelect = document.createElement('select');
          ['Open', 'In Progress', 'Resolved', 'Closed'].forEach((status) => {
            const option = document.createElement('option');
            option.value = status;
            option.textContent = status;
            if (fault.Status === status) option.selected = true;
            statusSelect.appendChild(option);
          });
          statusSelect.className = 'form-select form-select-sm';
          statusSelect.addEventListener('change', () => {
            faults[idx].Status = statusSelect.value;
            localStorage.setItem('faults', JSON.stringify(faults));
          });
          tdStatus.appendChild(statusSelect);
          tr.appendChild(tdStatus);

          // Fault Description
          const tdFault = document.createElement('td');
          tdFault.textContent = fault.Fault || '';
          tr.appendChild(tdFault);

          // Actions: Delete button
          const tdActions = document.createElement('td');
          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.className = 'btn btn-sm btn-danger delete-btn';
          deleteBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete this fault?')) {
              faults.splice(idx, 1);
              localStorage.setItem('faults', JSON.stringify(faults));
              renderFaults();
            }
          });
          tdActions.appendChild(deleteBtn);
          tr.appendChild(tdActions);

          faultTableBody.appendChild(tr);
        });
      }

      // Initial render
      renderFaults();

      // Handle add new fault form submit
      faultForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(faultForm);
        const newFault = {
          EquipmentType: formData.get('EquipmentType'),
          Status: formData.get('Status'),
          Fault: formData.get('Fault'),
        };
        faults.push(newFault);
        localStorage.setItem('faults', JSON.stringify(faults));
        renderFaults();
        faultForm.reset();
        addFaultModal.hide();
      });
    });
  </script>
</body>
</html>
