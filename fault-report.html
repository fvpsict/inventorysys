<!DOCTYPE html>
<html lang="en" data-category="FaultReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - FVPS Inventory System</title>

  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="styles.css" rel="stylesheet" />

  <style>
    body {
      padding-top: 70px; /* space for fixed navbar */
    }
    .table-responsive {
      max-height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main container -->
  <main class="container mt-4">
    <h2 class="mb-4">Fault Report</h2>

    <!-- Filter & Search -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filter-equipmenttype" class="fw-bold mb-0">Filter by Equipment Type:</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all" selected>All</option>
          <option value="projector">Projector</option>
          <option value="visualiser">Visualiser</option>
          <option value="projector screen">Projector Screen</option>
          <option value="desktop">Desktop</option>
          <option value="laptop">Laptop</option>
          <option value="ipad">iPad</option>
          <option value="mobile cart">Mobile Cart</option>
          <option value="ssoe">SSOE</option>
        </select>
      </div>

      <input
        type="search"
        id="search-inventory"
        placeholder="Search faults..."
        class="form-control w-auto"
      />

      <button class="btn btn-success" id="add-fault-btn">Add Fault</button>
    </div>

    <!-- Faults Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="fault-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Fault Description</th>
            <th>Status</th>
            <th>Date Reported</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by fault-report.js -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Add/Edit Fault -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="fault-form">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="faultModalLabel">Add Fault</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="fault-EquipmentType" class="form-label fw-bold">Equipment Type</label>
                <select id="fault-EquipmentType" name="EquipmentType" class="form-select" required>
                  <option value="">Select Equipment Type</option>
                  <option value="Projector">Projector</option>
                  <option value="Visualiser">Visualiser</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Desktop">Desktop</option>
                  <option value="Laptop">Laptop</option>
                  <option value="iPad">iPad</option>
                  <option value="Mobile Cart">Mobile Cart</option>
                  <option value="SSOE">SSOE</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="fault-Equipment" class="form-label fw-bold">Equipment</label>
                <input
                  type="text"
                  id="fault-Equipment"
                  name="Equipment"
                  class="form-control"
                  placeholder="Equipment Name or ID"
                  required
                />
              </div>

              <div class="col-12">
                <label for="fault-Description" class="form-label fw-bold">Fault Description</label>
                <textarea
                  id="fault-Description"
                  name="FaultDescription"
                  class="form-control"
                  rows="3"
                  placeholder="Describe the fault"
                  required
                ></textarea>
              </div>

              <div class="col-md-6">
                <label for="fault-Status" class="form-label fw-bold">Status</label>
                <select id="fault-Status" name="Status" class="form-select" required>
                  <option value="Open" selected>Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="fault-DateReported" class="form-label fw-bold">Date Reported</label>
                <input
                  type="date"
                  id="fault-DateReported"
                  name="DateReported"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your fault-report.js -->
  <script src="fault-report.js"></script>
</body>
</html>
