<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">FVPS Inventory System</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="view-inventory/index.html">View Inventory</a></li>
        <li class="nav-item"><a class="nav-link active" href="fault-report.html">Fault Report</a></li>
        <li class="nav-item"><a class="nav-link" href="patching/patching-report.html">Patching Report</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main container -->
<div class="container" style="padding-top: 90px;">

  <h2>Fault Report</h2>

  <button id="addFaultBtn" class="btn btn-success mb-3">Add Fault</button>

  <!-- Faults Table -->
  <div class="table-responsive">
    <table id="faultTable" class="table table-striped table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>EquipmentType</th>
          <th>Vendor</th>
          <th>BrandModel</th>
          <th>AssetNo</th>
          <th>SerialNumber</th>
          <th>EndDate</th>
          <th>StartDate</th>
          <th>Room</th>
          <th>Room Number</th>
          <th>Level</th>
          <th>Lamphour</th>
          <th>Fault</th>
          <th>Status</th>
          <th>Date Resolved</th>
          <th>Action Taken</th>
          <th>Date Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal for Add/Edit Fault -->
<div class="modal fade" id="faultModal" tabindex="-1" aria-labelledby="faultModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <form id="faultForm" class="p-3">
        <div class="modal-header">
          <h5 class="modal-title" id="faultModalLabel">Add/Edit Fault</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">

          <div class="row g-3">

            <div class="col-md-4">
              <label for="EquipmentType" class="form-label">Equipment Type *</label>
              <select name="EquipmentType" class="form-select" required>
                <option value="">Select Equipment Type</option>
                <option>Projector</option>
                <option>Projector Screen</option>
                <option>Visualiser</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="Vendor" class="form-label">Vendor</label>
              <input type="text" name="Vendor" class="form-control" />
            </div>

            <div class="col-md-4">
              <label for="BrandModel" class="form-label">Brand Model</label>
              <input type="text" name="BrandModel" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="AssetNo" class="form-label">Asset No</label>
              <input type="text" name="AssetNo" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="SerialNumber" class="form-label">Serial Number</label>
              <input type="text" name="SerialNumber" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="EndDate" class="form-label">End Date</label>
              <input type="date" name="EndDate" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="StartDate" class="form-label">Start Date</label>
              <input type="date" name="StartDate" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="Room" class="form-label">Room</label>
              <input type="text" name="Room" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="RoomNumber" class="form-label">Room Number</label>
              <input type="text" name="RoomNumber" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="Level" class="form-label">Level</label>
              <input type="text" name="Level" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="Lamphour" class="form-label">Lamphour</label>
              <input type="text" name="Lamphour" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="Fault" class="form-label">Fault</label>
              <input type="text" name="Fault" class="form-control" />
            </div>

            <div class="col-md-3">
              <label for="DateUpdated" class="form-label">Date Updated</label>
              <input type="text" readonly class="form-control" id="DateUpdated" name="DateUpdated" />
            </div>

            <div class="col-md-6">
              <label for="Status" class="form-label">Status *</label>
              <select name="Status" class="form-select" required>
                <option value="">Select Status</option>
                <option>Pending Vendor</option>
                <option>Resolved</option>
                <option>InProgress</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="DateResolved" class="form-label">Date Resolved</label>
              <input type="date" name="DateResolved" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="ActionTaken" class="form-label">Action Taken</label>
              <input type="text" name="ActionTaken" class="form-control" />
            </div>

          </div>

        </div>

        <div class="modal-footer">
          <button type="button" id="deleteFaultBtn" class="btn btn-danger me-auto" style="display:none;">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="fault-report.js"></script>

</body>
</html>
