<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .modal .form-label {
      font-weight: 600;
    }
    table th {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Fault Report</h2>

    <button id="addFaultBtn" class="btn btn-success mb-3">Add Fault</button>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="faultTable">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Room</th>
            <th>RoomNumber</th>
            <th>Level</th>
            <th>Lamphour</th>
            <th>Fault</th>
            <th>Status</th>
            <th>DateResolved</th>
            <th>ActionTaken</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="faultForm">
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add/Edit Fault</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="EquipmentType" class="form-label">Equipment Type</label>
                <select id="EquipmentType" name="EquipmentType" class="form-select" required>
                  <option value="">Select Type</option>
                  <option>Projector</option>
                  <option>Visualiser</option>
                  <option>Projector Screen</option>
                  <option>SSOE</option>
                  <!-- Add other categories if needed -->
                </select>
              </div>

              <div class="col-md-4">
                <label for="Vendor" class="form-label">Vendor</label>
                <input type="text" id="Vendor" name="Vendor" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="BrandModel" class="form-label">Brand Model</label>
                <input type="text" id="BrandModel" name="BrandModel" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input type="text" id="AssetNo" name="AssetNo" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="SerialNumber" class="form-label">Serial Number</label>
                <input type="text" id="SerialNumber" name="SerialNumber" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="EndDate" class="form-label">End Date</label>
                <input type="date" id="EndDate" name="EndDate" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="StartDate" class="form-label">Start Date</label>
                <input type="date" id="StartDate" name="StartDate" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="Room" class="form-label">Room</label>
                <input type="text" id="Room" name="Room" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="RoomNumber" class="form-label">Room Number</label>
                <input type="text" id="RoomNumber" name="RoomNumber" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="Level" class="form-label">Level</label>
                <input type="text" id="Level" name="Level" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="Lamphour" class="form-label">Lamphour</label>
                <input type="text" id="Lamphour" name="Lamphour" class="form-control" />
              </div>

              <div class="col-md-12">
                <label for="Fault" class="form-label">Fault Description</label>
                <textarea id="Fault" name="Fault" class="form-control" rows="2"></textarea>
              </div>

              <div class="col-md-4">
                <label for="Status" class="form-label">Status</label>
                <select id="Status" name="Status" class="form-select" required>
                  <option value="">Select Status</option>
                  <option>Open</option>
                  <option>In Progress</option>
                  <option>Resolved</option>
                  <option>Closed</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="DateResolved" class="form-label">Date Resolved</label>
                <input type="date" id="DateResolved" name="DateResolved" class="form-control" />
              </div>

              <div class="col-md-12">
                <label for="ActionTaken" class="form-label">Action Taken</label>
                <textarea id="ActionTaken" name="ActionTaken" class="form-control" rows="2"></textarea>
              </div>

              <div class="col-md-4">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  id="DateUpdated"
                  name="DateUpdated"
                  class="form-control"
                  readonly
                  placeholder="Auto-updated on save"
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="deleteFaultBtn"
              class="btn btn-danger me-auto"
              style="display: none;"
            >
              Delete
            </button>
            <button type="submit" class="btn btn-primary">Save Fault</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
