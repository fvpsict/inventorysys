<!-- Updated portion inside <thead> of table -->
<thead>
  <tr>
    <th>EquipmentType</th>
    <th>Equipment</th>
    <th>Venue</th>
    <th>Asset No</th>
    <th>Serial Number</th>
    <th>Fault Description</th>
    <th>Status</th>
    <th>Date Reported</th>
    <th>Actions</th>
  </tr>
</thead>

<!-- Updated modal form -->
<div class="modal-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label for="fault-EquipmentType" class="form-label fw-bold">Equipment Type</label>
      <select id="fault-EquipmentType" name="EquipmentType" class="form-select" required>
        <option value="">Select Equipment Type</option>
        <option>Projector</option>
        <option>Visualiser</option>
        <option>Projector Screen</option>
        <option>Desktop</option>
        <option>Laptop</option>
        <option>iPad</option>
        <option>Mobile Cart</option>
        <option>SSOE</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="fault-Equipment" class="form-label fw-bold">Equipment</label>
      <input id="fault-Equipment" name="Equipment" class="form-control" placeholder="Equipment Name or ID" required />
    </div>

    <div class="col-md-6">
      <label for="fault-Venue" class="form-label fw-bold">Venue</label>
      <input id="fault-Venue" name="Venue" class="form-control" placeholder="Room/Location" />
    </div>

    <div class="col-md-6">
      <label for="fault-AssetNo" class="form-label fw-bold">Asset No</label>
      <input id="fault-AssetNo" name="AssetNo" class="form-control" />
    </div>

    <div class="col-md-6">
      <label for="fault-SerialNumber" class="form-label fw-bold">Serial Number</label>
      <input id="fault-SerialNumber" name="SerialNumber" class="form-control" />
    </div>

    <div class="col-12">
      <label for="fault-Fault" class="form-label fw-bold">Fault Description</label>
      <textarea id="fault-Fault" name="Fault" class="form-control" rows="3" required></textarea>
    </div>

    <div class="col-md-6">
      <label for="fault-Status" class="form-label fw-bold">Status</label>
      <select id="fault-Status" name="Status" class="form-select" required>
        <option>Open</option>
        <option>In Progress</option>
        <option>Resolved</option>
        <option>Closed</option>
        <option>Pending action by vendor</option>
        <option>Faulty</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="fault-DateReported" class="form-label fw-bold">Date Reported</label>
      <input type="date" id="fault-DateReported" name="DateReported" class="form-control" required />
    </div>
  </div>
</div>
