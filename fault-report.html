<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navigation Sidebar (Optional, or use your site-wide sidebar) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link active" href="fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching-report/patching-report.html">Patching Report</a></li>
          <!-- Add more nav links as needed -->
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Fault Report</h2>
      <button
        type="button"
        class="btn btn-success"
        data-bs-toggle="modal"
        data-bs-target="#faultModal"
        id="addFaultBtn"
      >
        + Add Fault
      </button>
    </div>

    <!-- Category Filter -->
    <div class="mb-3 row">
      <label for="filterCategory" class="col-sm-2 col-form-label">Filter by Equipment Type:</label>
      <div class="col-sm-4">
        <select id="filterCategory" class="form-select">
          <option value="All" selected>All</option>
          <option value="Projector">Projector</option>
          <option value="Visualiser">Visualiser</option>
          <option value="Projector Screen">Projector Screen</option>
          <option value="Desktop">Desktop</option>
          <option value="Laptop">Laptop</option>
          <option value="iPad">iPad</option>
          <option value="Mobile Cart">Mobile Cart</option>
          <!-- Add more equipment types as needed -->
        </select>
      </div>
    </div>

    <!-- Fault Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="faultTable">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Asset No</th>
            <th>Fault Description</th>
            <th>Status</th>
            <th>Date Reported</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Fault entries will be dynamically inserted here by fault-report.js -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Adding / Editing Faults -->
  <div
    class="modal fade"
    id="faultModal"
    tabindex="-1"
    aria-labelledby="faultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="faultForm">
          <div class="modal-header">
            <h5 class="modal-title" id="faultModalLabel">Add New Fault</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="equipmentType" class="form-label">Equipment Type</label>
              <select class="form-select" id="equipmentType" name="equipmentType" required>
                <option value="" selected disabled>Select Equipment Type</option>
                <option>Projector</option>
                <option>Visualiser</option>
                <option>Projector Screen</option>
                <option>Desktop</option>
                <option>Laptop</option>
                <option>iPad</option>
                <option>Mobile Cart</option>
                <!-- Add more options as needed -->
              </select>
            </div>
            <div class="mb-3">
              <label for="assetNo" class="form-label">Asset No</label>
              <input
                type="text"
                class="form-control"
                id="assetNo"
                name="assetNo"
                placeholder="Enter Asset Number"
                required
              />
            </div>
            <div class="mb-3">
              <label for="faultDescription" class="form-label">Fault Description</label>
              <textarea
                class="form-control"
                id="faultDescription"
                name="faultDescription"
                rows="3"
                placeholder="Describe the fault"
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="" selected disabled>Select Status</option>
                <option>Open</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Closed</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="dateReported" class="form-label">Date Reported</label>
              <input
                type="date"
                class="form-control"
                id="dateReported"
                name="dateReported"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <input type="hidden" id="faultIndex" />
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="saveFaultBtn">
              Save Fault
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="fault-report.js"></script>
</body>
</html>
