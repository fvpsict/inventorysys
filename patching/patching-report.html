<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar" aria-label="Main Navigation">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../view-inventory/index.html">View Inventory</a></li>
        <li><a href="../fault-report.html">Fault Report</a></li>
        <li class="active">
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Patching Report Data Input</h2>

      <textarea id="patchingInput" rows="12" placeholder="Paste weekly patching data (tab or comma separated)"></textarea>
      <div class="button-group mb-3">
        <button class="btn btn-primary" onclick="savePatchingData()">Submit</button>
        <button class="btn btn-secondary" onclick="clearPatchingData()">Clear</button>
        <button class="btn btn-success" onclick="exportCSV()">Export CSV</button>
      </div>

      <div id="patchingTableContainer" class="table-responsive"></div>
    </main>
  </div>

  <script>
    function savePatchingData() {
      const input = document.getElementById('patchingInput').value.trim();
      const lines = input.split('\\n');
      const parsed = lines.map(line => line.split(/\\t|,/));
      localStorage.setItem('patchingData', JSON.stringify(parsed));
      renderPatchingTable(parsed);
    }

    function renderPatchingTable(data) {
      if (!data || data.length === 0) return;
      let html = '<table class="table table-bordered"><thead><tr>';
      data[0].forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';
      for (let i = 1; i < data.length; i++) {
        html += '<tr>' + data[i].map((cell, col) =>
          `<td contenteditable="true" oninput="updateCell(${i}, ${col}, this.innerText)">${cell}</td>`
        ).join('') + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('patchingTableContainer').innerHTML = html;
    }

    function updateCell(row, col, value) {
      const data = JSON.parse(localStorage.getItem('patchingData') || '[]');
      if (data[row]) {
        data[row][col] = value;
        localStorage.setItem('patchingData', JSON.stringify(data));
      }
    }

    function clearPatchingData() {
      localStorage.removeItem('patchingData');
      document.getElementById('patchingInput').value = '';
      document.getElementById('patchingTableContainer').innerHTML = '';
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem('patchingData') || '[]');
      if (!data.length) return;
      const csv = data.map(row => row.map(cell => `"${(cell||'').replace(/"/g,'""')}"`).join(',')).join('\\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'patching.csv';
      a.click();
    }

    window.onload = () => {
      const stored = localStorage.getItem('patchingData');
      if (stored) {
        const parsed = JSON.parse(stored);
        document.getElementById('patchingInput').value = parsed.map(r => r.join(',')).join('\\n');
        renderPatchingTable(parsed);
      }
    };
  </script>
</body>
</html>
