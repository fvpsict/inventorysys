<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report - FVPS Inventory System</title>

  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />

  <style>
    body {
      padding-top: 70px; /* space for fixed navbar */
    }
    .table-responsive {
      max-height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <h2 class="mb-4">Patching Report</h2>

    <input
      type="search"
      id="search-patching"
      placeholder="Search patching data..."
      class="form-control w-auto mb-3"
    />

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="patching-table">
        <thead>
          <tr>
            <th>Asset Tag</th>
            <th>Serial Number</th>
            <th>School</th>
            <th>Hostname</th>
            <th>Device Type</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian Name</th>
            <th>CSM</th>
            <th>SSOE Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL of published Google Sheets HTML page
    const sheetURL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pubhtml?gid=0&single=true";

    const tableBody = document.querySelector("#patching-table tbody");
    const searchInput = document.getElementById("search-patching");

    async function fetchSheetData() {
      try {
        const response = await fetch(sheetURL);
        const htmlText = await response.text();

        // Parse the HTML response to extract the table inside Google Sheets publish page
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // Google Sheets publish page has the data in a table with class 'waffle'
        const waffleTable = doc.querySelector("table.waffle");

        if (!waffleTable) {
          console.error("Could not find data table in Google Sheets HTML.");
          tableBody.innerHTML =
            "<tr><td colspan='11'>No data found in the source spreadsheet.</td></tr>";
          return;
        }

        // Extract all rows except the header (first row)
        const rows = Array.from(waffleTable.querySelectorAll("tr")).slice(1);

        // Clear table body first
        tableBody.innerHTML = "";

        rows.forEach((row) => {
          const cells = row.querySelectorAll("td");

          // Some rows might be empty or incomplete - check number of cells
          if (cells.length < 11) return;

          // Extract each cell text trimmed
          const [
            assetTag,
            serialNumber,
            school,
            hostname,
            deviceType,
            brandModel,
            profile,
            custodianName,
            csm,
            ssoeLocation,
            status,
          ] = Array.from(cells).map((c) => c.textContent.trim());

          const tr = document.createElement("tr");

          // Build row HTML cells
          tr.innerHTML = `
            <td>${assetTag}</td>
            <td>${serialNumber}</td>
            <td>${school}</td>
            <td>${hostname}</td>
            <td>${deviceType}</td>
            <td>${brandModel}</td>
            <td>${profile}</td>
            <td>${custodianName}</td>
            <td>${csm}</td>
            <td>${ssoeLocation}</td>
            <td>${status}</td>
          `;

          tableBody.appendChild(tr);
        });
      } catch (error) {
        console.error("Error fetching or parsing Google Sheets data:", error);
        tableBody.innerHTML =
          "<tr><td colspan='11'>Error loading data from spreadsheet.</td></tr>";
      }
    }

    // Filter table rows by search input
    function filterTable() {
      const filter = searchInput.value.toLowerCase();
      const rows = tableBody.querySelectorAll("tr");

      rows.forEach((row) => {
        const rowText = row.textContent.toLowerCase();
        row.style.display = rowText.includes(filter) ? "" : "none";
      });
    }

    // Initialize
    fetchSheetData();

    // Add search filter listener
    searchInput.addEventListener("input", filterTable);
  </script>
</body>
</html>
