<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />

  <link href="../styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report/fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <input
        type="search"
        id="search-patching"
        class="form-control w-auto"
        placeholder="Search patching data..."
      />
      <!-- Optional: Add button or filters here -->
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="patching-table">
        <thead>
          <tr>
            <th>Asset Tag</th>
            <th>Serial Number</th>
            <th>School</th>
            <th>Hostname</th>
            <th>Device Type</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>CustodianName</th>
            <th>CSM</th>
            <th>SSOE Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data rows inserted dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Example patching data - Replace with your own loading mechanism
    const patchingData = [
      {
        assetTag: "AT001",
        serialNumber: "SN12345",
        school: "School A",
        hostname: "host1",
        deviceType: "Laptop",
        brandModel: "Dell Latitude",
        profile: "Admin",
        custodianName: "John Doe",
        csm: "CSM1",
        ssoeLocation: "Room 101",
        status: "Installed"
      },
      {
        assetTag: "AT002",
        serialNumber: "SN67890",
        school: "School B",
        hostname: "host2",
        deviceType: "Desktop",
        brandModel: "HP EliteDesk",
        profile: "Academic",
        custodianName: "Jane Smith",
        csm: "CSM2",
        ssoeLocation: "Room 202",
        status: "Pending"
      }
      // Add more records or fetch from API/Google Sheet
    ];

    const tableBody = document.querySelector("#patching-table tbody");
    const searchInput = document.getElementById("search-patching");

    function renderTable(data) {
      tableBody.innerHTML = "";
      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.assetTag || ""}</td>
          <td>${item.serialNumber || ""}</td>
          <td>${item.school || ""}</td>
          <td>${item.hostname || ""}</td>
          <td>${item.deviceType || ""}</td>
          <td>${item.brandModel || ""}</td>
          <td>${item.profile || ""}</td>
          <td>${item.custodianName || ""}</td>
          <td>${item.csm || ""}</td>
          <td>${item.ssoeLocation || ""}</td>
          <td>${item.status || ""}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = searchInput.value.toLowerCase();
      const filtered = patchingData.filter(item =>
        Object.values(item).some(val =>
          val.toString().toLowerCase().includes(query)
        )
      );
      renderTable(filtered);
    }

    // Initialize table
    renderTable(patchingData);

    // Add search event
    searchInput.addEventListener("input", filterTable);
  </script>
</body>
</html>
