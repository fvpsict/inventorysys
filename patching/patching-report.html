<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 60vh; overflow-y: auto; }
    #patchSummary { background: white; padding: 1rem; border-radius: 0.375rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link active" href="patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Patching Report</h1>
      <button id="loadBtn" class="btn btn-primary">Load Weekly Data</button>
    </div>

    <div class="table-responsive">
      <table id="patchTable" class="table table-striped table-bordered">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="patchSummary" class="mt-4"></div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // URL of the published Google Sheet HTML page
    const HTML_URL = "https://docs.google.com/spreadsheets/d/1zvwKzIEbvQEEgbcqcyp9WP0IfguSaHm2G67ZAeuiSOE/edit?gid=0#gid=0";

    async function fetchAndParseHTML(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network response not OK');
        const text = await res.text();

        // Create DOM parser to parse HTML string
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');

        // Google Sheets published HTML has tables - we grab the first one that contains data
        const sheetTables = doc.querySelectorAll('table');
        if (!sheetTables.length) throw new Error('No tables found in HTML');

        // Usually the first table is the data table we want
        const sheetTable = sheetTables[0];
        const rows = sheetTable.querySelectorAll('tr');

        // Extract header row and data rows into arrays
        const data = [];
        rows.forEach((row, i) => {
          const cells = row.querySelectorAll(i === 0 ? 'th' : 'td');
          if (cells.length === 0) return; // skip empty rows
          const rowData = [];
          cells.forEach(cell => {
            rowData.push(cell.textContent.trim());
          });
          data.push(rowData);
        });

        return data;
      } catch (e) {
        alert('Error loading or parsing Google Sheet HTML: ' + e.message);
        return [];
      }
    }

    function calculateSummary(data) {
      const summaryDiv = document.getElementById('patchSummary');
      if (!data.length) {
        summaryDiv.innerHTML = '';
        return;
      }

      const header = data[0];
      const statusIdx = header.findIndex(h => h.toLowerCase() === 'status');
      if (statusIdx === -1) {
        summaryDiv.innerHTML = '<p><em>Status column not found.</em></p>';
        return;
      }

      const statusCounts = {};
      for (let i = 1; i < data.length; i++) {
        const status = data[i][statusIdx] || 'Unknown';
        statusCounts[status] = (statusCounts[status] || 0) + 1;
      }

      let html = '<h5>Summary by Status</h5><ul>';
      for (const [status, count] of Object.entries(statusCounts)) {
        html += `<li><strong>${status}:</strong> ${count}</li>`;
      }
      html += '</ul>';

      summaryDiv.innerHTML = html;
    }

    function render(data) {
      const thead = document.querySelector('#patchTable thead tr');
      const tbody = document.querySelector('#patchTable tbody');
      thead.innerHTML = '';
      tbody.innerHTML = '';
      if (!data.length) return;

      data[0].forEach(h => thead.innerHTML += `<th>${h}</th>`);
      data.slice(1).forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => tr.innerHTML += `<td>${cell}</td>`);
        tbody.appendChild(tr);
      });

      calculateSummary(data);
    }

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const data = await fetchAndParseHTML(HTML_URL);
      if (data.length) {
        localStorage.setItem('patchingData', JSON.stringify(data));
        render(data);
        alert('Weekly patching data loaded!');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('patchingData');
      if (saved) render(JSON.parse(saved));
    });
  </script>
</body>
</html>
