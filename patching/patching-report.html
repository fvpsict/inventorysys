<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report - Inventory System</title>
  <link href="../styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../view-inventory/index.html">View Inventory</a></li>
        <li><a href="../fault-report.html">Fault Report</a></li>
        <li class="active">
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h1>Patching Report</h1>
      <p>Weekly patching data loaded from Google Sheets CSV:</p>
      <button id="loadCsvBtn" class="btn btn-primary mb-3">Load Latest Data</button>
      <div class="table-responsive" style="max-height: 60vh; overflow-y:auto;">
        <table id="patchingTable" class="table table-bordered table-striped table-sm">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pub?output=csv";

    const loadCsvBtn = document.getElementById('loadCsvBtn');
    const patchingTable = document.getElementById('patchingTable');
    const thead = patchingTable.querySelector('thead');
    const tbody = patchingTable.querySelector('tbody');

    // Simple CSV parser function
    function parseCSV(str) {
      const lines = str.trim().split('\n');
      return lines.map(line => {
        // Split by commas, handling quoted commas would need a library for full safety
        return line.split(',').map(cell => cell.trim());
      });
    }

    function renderTable(data) {
      thead.innerHTML = '';
      tbody.innerHTML = '';

      if (data.length === 0) return;

      // Headers
      const headerRow = document.createElement('tr');
      data[0].forEach(head => {
        const th = document.createElement('th');
        th.textContent = head;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Rows
      for(let i = 1; i < data.length; i++) {
        const row = document.createElement('tr');
        data[i].forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell;
          row.appendChild(td);
        });
        tbody.appendChild(row);
      }
    }

    function saveDataToLocalStorage(data) {
      localStorage.setItem('patchingData', JSON.stringify(data));
    }

    loadCsvBtn.addEventListener('click', () => {
      fetch(CSV_URL)
        .then(resp => {
          if (!resp.ok) throw new Error('Network error fetching CSV');
          return resp.text();
        })
        .then(csvText => {
          const parsed = parseCSV(csvText);
          renderTable(parsed);
          saveDataToLocalStorage(parsed);
          alert('Data loaded and saved locally!');
        })
        .catch(err => {
          alert('Failed to load CSV data: ' + err.message);
        });
    });

    // On page load, try to load existing saved data
    window.onload = () => {
      const saved = localStorage.getItem('patchingData');
      if (saved) {
        const parsed = JSON.parse(saved);
        renderTable(parsed);
      }
    };
  </script>
</body>
</html>
