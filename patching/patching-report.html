<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>body{padding-top:70px}</style>
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">Inventory</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">View Inventory</a></li>
        <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
        <li class="nav-item"><a class="nav-link active" href="patching-report.html">Patching Report</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid">
  <h1>Patching Report</h1>
  <button id="loadCsvBtn" class="btn btn-primary mb-3">Load Latest Data</button>
  <div class="table-responsive" style="max-height:60vh;overflow-y:auto">
    <table id="patchingTable" class="table table-sm table-bordered">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pub?output=csv";
function parseCSV(str){return str.trim().split('\n').map(r=>r.split(',').map(c=>c.trim()));}
function renderTable(data){
  document.querySelector('#patchingTable thead tr').innerHTML = '';
  document.querySelector('#patchingTable tbody').innerHTML = '';
  if(!data.length) return;
  data[0].forEach(h=>document.querySelector('#patchingTable thead tr').innerHTML += `<th>${h}</th>`);
  data.slice(1).forEach(r=>{
    const tr=document.createElement('tr');
    r.forEach(c=>tr.innerHTML+=`<td>${c}</td>`);
    document.querySelector('#patchingTable tbody').append(tr);
  });
}
document.getElementById('loadCsvBtn').onclick = () => {
  fetch(CSV_URL).then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
    const d=parseCSV(txt);
    localStorage.setItem('patchingData',JSON.stringify(d));
    renderTable(d);
    alert('Loaded!');
  }).catch(()=>alert('Failed load.'));
};
window.onload=()=>{
  const saved=localStorage.getItem('patchingData');
  if(saved) renderTable(JSON.parse(saved));
};
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
