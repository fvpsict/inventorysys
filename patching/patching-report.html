<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-3">
    <h1 class="mb-4">Patching Report</h1>

    <p>
      <!-- Placeholder for instructions or summary -->
      Paste weekly patching data below.
    </p>

    <div class="mb-3">
      <textarea
        id="patchingDataInput"
        class="form-control"
        rows="10"
        placeholder="Paste patching data here (e.g. CSV or tabular text)"
      ></textarea>
    </div>

    <button class="btn btn-primary mb-4" id="processPatchingBtn">Process Data</button>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="patchingTable">
        <thead>
          <tr>
            <th>Asset Tag</th>
            <th>Serial Number</th>
            <th>School</th>
            <th>Hostname</th>
            <th>Device Type</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>CustodianName</th>
            <th>CSM</th>
            <th>SSOE Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- dynamically filled -->
        </tbody>
      </table>
    </div>

  </main>

  <script>
    document.getElementById("processPatchingBtn").addEventListener("click", () => {
      const input = document.getElementById("patchingDataInput").value.trim();
      const tbody = document.querySelector("#patchingTable tbody");
      tbody.innerHTML = "";

      if (!input) {
        alert("Please paste patching data before processing.");
        return;
      }

      // Simple CSV or tab-delimited parse:
      // Assume first line is header, skip it
      const lines = input.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length < 2) {
        alert("No data rows found.");
        return;
      }

      // Extract header columns
      const headers = lines[0].split(/,|\t/).map(h => h.trim());

      // Mapping known headers to table columns
      const expectedHeaders = [
        "Asset Tag",
        "Serial Number",
        "School",
        "Hostname",
        "Device Type",
        "BrandModel",
        "Profile",
        "CustodianName",
        "CSM",
        "SSOE Location",
        "Status"
      ];

      // Validate header count
      if (headers.length < expectedHeaders.length) {
        alert("Input data columns do not match expected columns.");
        return;
      }

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(/,|\t/).map(c => c.trim());
        if (cols.length < expectedHeaders.length) continue; // skip incomplete row

        const tr = document.createElement("tr");
        expectedHeaders.forEach((header, idx) => {
          const td = document.createElement("td");
          td.textContent = cols[idx] || "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
