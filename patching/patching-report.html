<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top:70px; background:#f8f9fa; }
    .table-responsive { max-height:60vh; overflow-y:auto; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link active" href="patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Patching Report</h1>
      <button id="loadBtn" class="btn btn-primary">Load Weekly Data</button>
    </div>

    <div class="table-responsive">
      <table id="patchTable" class="table table-striped table-bordered">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pub?output=csv";

    function parseCSV(txt) {
      return txt.trim().split('\\n').map(r=>r.split(',').map(c=>c.trim()));
    }

    function render(data) {
      const thead = document.querySelector('#patchTable thead tr');
      const tbody = document.querySelector('#patchTable tbody');
      thead.innerHTML=''; tbody.innerHTML='';
      if(!data.length) return;
      data[0].forEach(h=> thead.innerHTML+=`<th>${h}</th>`);
      data.slice(1).forEach(row=>{
        const tr=document.createElement('tr');
        row.forEach(c=> tr.innerHTML+=`<td>${c}</td>`);
        tbody.appendChild(tr);
      });
    }

    document.getElementById('loadBtn').addEventListener('click', ()=>{
      fetch(CSV_URL)
        .then(r=>r.text())
        .then(txt=>{
          const d=parseCSV(txt);
          localStorage.setItem('patchingData',JSON.stringify(d));
          render(d);
          alert('Loaded!');
        })
        .catch(()=>alert('Failed to load data.'));
    });

    window.addEventListener('DOMContentLoaded', ()=>{
      const saved=localStorage.getItem('patchingData');
      if(saved) render(JSON.parse(saved));
    });
  </script>
</body>
</html>
