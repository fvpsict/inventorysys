<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />

</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../view-inventory/index.html">View Inventory</a></li>
        <li><a href="../fault-report.html">Fault Report</a></li>
        <li class="active">
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Pasting Weekly Data</h2>
      <textarea id="pasteData" rows="10" placeholder="Paste weekly patching data here (tab or comma separated)"></textarea>
      <button id="processDataBtn" class="btn btn-primary">Process Data</button>

      <h2>Parsed Data</h2>
      <table>
        <thead>
          <tr>
            <th>Asset Tag</th>
            <th>Serial Number</th>
            <th>School</th>
            <th>Hostname</th>
            <th>Device Type</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>CustodianName</th>
            <th>CSM</th>
            <th>SSOE Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="patchingTableBody"></tbody>
      </table>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'patchingData';

    function savePatchingData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getPatchingData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function renderPatchingTable() {
      const data = getPatchingData();
      const tbody = document.getElementById('patchingTableBody');
      tbody.innerHTML = '';

      data.forEach((item, idx) => {
        const tr = document.createElement('tr');
        ['Asset Tag', 'Serial Number', 'School', 'Hostname', 'Device Type', 'BrandModel', 'Profile', 'CustodianName', 'CSM', 'SSOE Location', 'Status'].forEach(key => {
          const td = document.createElement('td');
          td.textContent = item[key] || '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function parseInputData(text) {
      const lines = text.trim().split('\n');
      const data = [];
      lines.forEach(line => {
        // Try splitting by tab or comma
        let parts = line.split('\t');
        if (parts.length < 11) parts = line.split(',');
        if (parts.length < 11) return; // ignore incomplete line

          'Serial Number': parts[1].trim(),
