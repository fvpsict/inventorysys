<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../view-inventory/index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report/fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <input
        type="search"
        id="search-patching"
        class="form-control w-auto"
        placeholder="Search patching data..."
      />
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="patching-table">
        <thead>
          <tr>
            <th>Asset Tag</th>
            <th>Serial Number</th>
            <th>School</th>
            <th>Hostname</th>
            <th>Device Type</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>CustodianName</th>
            <th>CSM</th>
            <th>SSOE Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows loaded dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pubhtml?gid=0&single=true";

    const tableBody = document.querySelector("#patching-table tbody");
    const searchInput = document.getElementById("search-patching");
    let patchingData = [];

    // Fetch published Google Sheet HTML and parse data table rows
    async function fetchSheetData() {
      try {
        const response = await fetch(SHEET_URL);
        if (!response.ok) throw new Error("Failed to fetch sheet");

        const htmlText = await response.text();

        // Parse the HTML text as DOM
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // The published Google Sheet puts the sheet table inside <table class="waffle">
        const sheetTable = doc.querySelector("table.waffle");
        if (!sheetTable) throw new Error("Sheet table not found");

        const rows = Array.from(sheetTable.querySelectorAll("tr"));
        if (rows.length < 2) throw new Error("No data rows found");

        // First row = headers; read header text
        const headers = Array.from(rows[0].querySelectorAll("td,th")).map(th =>
          th.textContent.trim()
        );

        // Map headers to your column keys (adjust if sheet headers differ)
        // Expected sheet headers (case-insensitive): Asset Tag, Serial Number, School, Hostname, Device Type, BrandModel, Profile, CustodianName, CSM, SSOE Location, Status
        // Defensive: lowercase keys
        const keyMap = headers.map(h =>
          h
            .toLowerCase()
            .replace(/\s/g, "")
            .replace(/[^a-z]/g, "")
        );

        // Rows: parse all data rows after header
        patchingData = rows.slice(1).map(row => {
          const cells = Array.from(row.querySelectorAll("td"));
          const item = {};
          cells.forEach((cell, i) => {
            if (keyMap[i]) {
              // Map to your keys exactly:
              // assetTag, serialNumber, school, hostname, deviceType, brandModel, profile, custodianName, csm, ssoeLocation, status
              switch (keyMap[i]) {
                case "assettag":
                  item.assetTag = cell.textContent.trim();
                  break;
                case "serialnumber":
                  item.serialNumber = cell.textContent.trim();
                  break;
                case "school":
                  item.school = cell.textContent.trim();
                  break;
                case "hostname":
                  item.hostname = cell.textContent.trim();
                  break;
                case "devicetype":
                  item.deviceType = cell.textContent.trim();
                  break;
                case "brandmodel":
                  item.brandModel = cell.textContent.trim();
                  break;
                case "profile":
                  item.profile = cell.textContent.trim();
                  break;
                case "custodianname":
                  item.custodianName = cell.textContent.trim();
                  break;
                case "csm":
                  item.csm = cell.textContent.trim();
                  break;
                case "ssoelocation":
                  item.ssoeLocation = cell.textContent.trim();
                  break;
                case "status":
                  item.status = cell.textContent.trim();
                  break;
                default:
                  // ignore extra columns
                  break;
              }
            }
          });
          return item;
        });

        renderTable(patchingData);
      } catch (err) {
        tableBody.innerHTML =
          `<tr><td colspan="11" class="text-center text-danger">Error loading data: ${err.message}</td></tr>`;
        console.error(err);
      }
    }

    function renderTable(data) {
      tableBody.innerHTML = "";
      if (!data.length) {
        tableBody.innerHTML =
          '<tr><td colspan="11" class="text-center">No matching records found</td></tr>';
        return;
      }
      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.assetTag || ""}</td>
          <td>${item.serialNumber || ""}</td>
          <td>${item.school || ""}</td>
          <td>${item.hostname || ""}</td>
          <td>${item.deviceType || ""}</td>
          <td>${item.brandModel || ""}</td>
          <td>${item.profile || ""}</td>
          <td>${item.custodianName || ""}</td>
          <td>${item.csm || ""}</td>
          <td>${item.ssoeLocation || ""}</td>
          <td>${item.status || ""}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) {
        renderTable(patchingData);
        return;
      }
      const filtered = patchingData.filter(item =>
        Object.values(item).some(val =>
          val.toLowerCase().includes(query)
        )
      );
      renderTable(filtered);
    }

    searchInput.addEventListener("input", filterTable);

    // Load data on page load
    fetchSheetData();
  </script>
</body>
</html>
