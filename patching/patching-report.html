<!DOCTYPE html>
<html lang="en" data-category="PatchingReport">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 60vh; overflow-y: auto; }
    #patchSummary { background: white; padding: 1rem; border-radius: 0.375rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link active" href="patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Patching Report</h1>
      <button id="loadBtn" class="btn btn-primary">Load Weekly Data</button>
    </div>

    <div class="table-responsive">
      <table id="patchTable" class="table table-striped table-bordered">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="patchSummary" class="mt-4"></div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8dXgl3cTXv04SMY1T5K0OugNh1veaPjVaCE619s1GPgobbExe6z4sL1J0_xk1oqkNQvEV8qx8gpT4/pub?output=csv";

    function parseCSV(txt) {
      // Simple CSV parsing (no quotes or commas inside fields supported)
      return txt.trim().split('\n').map(row => row.split(',').map(cell => cell.trim()));
    }

    function calculateSummary(data) {
      const summaryDiv = document.getElementById('patchSummary');
      if (!data.length) {
        summaryDiv.innerHTML = '';
        return;
      }

      const header = data[0];
      const statusIdx = header.indexOf('Status');
      if (statusIdx === -1) {
        summaryDiv.innerHTML = '<p><em>Status column not found.</em></p>';
        return;
      }

      const statusCounts = {};
      for(let i=1; i<data.length; i++) {
        const status = data[i][statusIdx] || 'Unknown';
        statusCounts[status] = (statusCounts[status] || 0) + 1;
      }

      let html = '<h5>Summary by Status</h5><ul>';
      for (const [status, count] of Object.entries(statusCounts)) {
        html += `<li><strong>${status}:</strong> ${count}</li>`;
      }
      html += '</ul>';

      summaryDiv.innerHTML = html;
    }

    function render(data) {
      const thead = document.querySelector('#patchTable thead tr');
      const tbody = document.querySelector('#patchTable tbody');
      thead.innerHTML = '';
      tbody.innerHTML = '';
      if (!data.length) return;

      // Headers
      data[0].forEach(h => thead.innerHTML += `<th>${h}</th>`);

      // Rows
      data.slice(1).forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => tr.innerHTML += `<td>${cell}</td>`);
        tbody.appendChild(tr);
      });

      calculateSummary(data);
    }

    document.getElementById('loadBtn').addEventListener('click', () => {
      fetch(CSV_URL)
        .then(response => response.text())
        .then(txt => {
          const parsedData = parseCSV(txt);
          localStorage.setItem('patchingData', JSON.stringify(parsedData));
          render(parsedData);
          alert('Weekly patching data loaded!');
        })
        .catch(() => alert('Failed to load patching data.'));
    });

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('patchingData');
      if (saved) render(JSON.parse(saved));
    });
  </script>
</body>
</html>
