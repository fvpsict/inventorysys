<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Patching Summary</title>
  <link href="../styles.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>body{padding-top:70px}</style>
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">Inventory</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="../view-inventory/index.html">View Inventory</a></li>
        <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
        <li class="nav-item"><a class="nav-link active" href="patching-summary.html">Patching Summary</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid">
  <h1>Patching Summary</h1>
  <div class="table-responsive" style="max-height:60vh;overflow-y:auto">
    <table id="summaryTable" class="table table-sm table-bordered">
      <thead><tr>
        <th>DATE</th><th>ADMIN INSTALLED</th><th>ACAD INSTALLED</th><th>ADMIN SCCM EPP &gt; 4 wks</th>
        <th>ACAD SCCM EPP &gt; 4 wks</th><th>ADMIN NOT CONNECTED</th><th>ACAD NOT CONNECTED</th>
        <th>ADMIN REQUIRED</th><th>ACAD REQUIRED</th><th>ADMIN UNKNOWN</th><th>ACAD UNKNOWN</th>
        <th>E-EXAM</th><th>FAULTY</th><th>Tech Refresh</th><th>Percentage</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
function parseIntSafe(s){const n=parseInt(s,10);return isNaN(n)?0:n;}
function summarize(data){
  if(!data||data.length<2) return [];
  const idxMap = data[0].reduce((a,h,i)=>(a[h.trim()]=i,a),{});
  const headers=['ADMIN INSTALLED','ACAD INSTALLED','ADMIN SCCM EPP > 4 wks','ACAD SCCM EPP > 4 wks','ADMIN NOT CONNECTED','ACAD NOT CONNECTED','ADMIN REQUIRED','ACAD REQUIRED','ADMIN UNKNOWN','ACAD UNKNOWN','E-EXAM','FAULTY','Tech Refresh','Percentage'];
  const sums = {};
  data.slice(1).forEach(r=>{
    const d=r[0];
    sums[d]=sums[d]||headers.reduce((o,h)=>(o[h]=0,o),{});
    headers.forEach(h=>sums[d][h]+=parseIntSafe(r[idxMap[h]]));
  });
  return Object.entries(sums).map(([d,v])=>[d,...headers.map(h=>v[h])]);
}

function renderSum(){
  const s=localStorage.getItem('patchingData');
  if(!s){alert('Load data first');return;}
  const sum=summarize(JSON.parse(s));
  const tb=document.querySelector('#summaryTable tbody');
  tb.innerHTML='';
  sum.forEach(r=>{const tr=document.createElement('tr');r.forEach(c=>tr.innerHTML+=`<td>${c}</td>`);tb.append(tr);});
}

window.onload=renderSum;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
