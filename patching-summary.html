<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li><a href="fault-report.html">Fault Report</a></li>
        <li class="active">
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li class="active"><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Patching Summary</h2>
      <div class="button-group">
        <button class="btn btn-success" onclick="exportCSV()">Export CSV</button>
      </div>
      <div id="summaryTableContainer" class="table-responsive"></div>
    </main>
  </div>

  <script>
    function renderSummaryTable(data) {
      if (!data.length) {
        document.getElementById('summaryTableContainer').innerHTML = '<p>No data available.</p>';
        return;
      }

      const headers = data[0];
      let html = '<table class="table table-bordered table-hover"><thead><tr>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';
      for (let i = 1; i < data.length; i++) {
        html += '<tr>';
        data[i].forEach(cell => html += `<td>${cell}</td>`);
        html += '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('summaryTableContainer').innerHTML = html;
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem('patchingData') || '[]');
      if (!data.length) return;
      const csv = data.map(row =>
        row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(',')
      ).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'patching-summary.csv';
      a.click();
    }

    window.onload = () => {
      const stored = localStorage.getItem('patchingData');
      if (stored) {
        const parsed = JSON.parse(stored);
        renderSummaryTable(parsed);
      } else {
        document.getElementById('summaryTableContainer').innerHTML = '<p>No patching data found.</p>';
      }
    };
  </script>
</body>
</html>
