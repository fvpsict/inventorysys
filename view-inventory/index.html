<!-- Add/Edit Inventory Modal -->
<div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="inventory-form">
        <div class="modal-header">
          <h5 class="modal-title" id="inventoryModalLabel">Add/Edit Inventory</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Equipment Type</label>
              <select class="form-select" name="EquipmentType" id="equipmentType" required>
                <option value="">Select</option>
                <option>SSOE</option>
                <option>Projector</option>
                <option>Projector Screen</option>
                <option>Visualiser</option>
                <option>Apple TV</option>
                <option>SMax</option>
                <option>Portable HDD</option>
                <option>Macbook</option>
                <option>TV</option>
                <option>OMR</option>
                <option>Hansvision</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Equipment</label>
              <select class="form-select" name="Equipment" id="equipmentField">
                <option value="">Select</option>
                <option>Desktop</option>
                <option>Laptop</option>
                <option>iPad</option>
                <option>Mobile Cart</option>
              </select>
              <div class="invalid-feedback">This field is required when Equipment Type is SSOE.</div>
            </div>

            <!-- ... other fields remain unchanged ... -->

          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("inventory-form");
    const equipmentType = document.getElementById("equipmentType");
    const equipmentField = document.getElementById("equipmentField");

    function toggleEquipmentRequirement() {
      if (equipmentType.value === "SSOE") {
        equipmentField.setAttribute("required", true);
      } else {
        equipmentField.removeAttribute("required");
      }
    }

    equipmentType.addEventListener("change", toggleEquipmentRequirement);

    form.addEventListener("submit", function (e) {
      if (equipmentType.value === "SSOE" && equipmentField.value === "") {
        equipmentField.classList.add("is-invalid");
        e.preventDefault();
      } else {
        equipmentField.classList.remove("is-invalid");
      }
    });
  });
</script>
