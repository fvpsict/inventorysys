<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      padding-top: 70px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">View Inventory</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="container">
    <h1 class="mb-4">Inventory</h1>
    <button class="btn btn-success mb-3" id="add-item-btn">Add Item</button>

    <table class="table table-bordered" id="inventory-table">
      <thead>
        <tr>
          <th>EquipmentType</th>
          <th>AssetNo</th>
          <th>Custodian</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inventoryModalLabel">Add/Edit Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="inventory-form">
            <div class="mb-3">
              <label class="form-label">EquipmentType</label>
              <select class="form-select" name="EquipmentType" required>
                <option value="">Select</option>
                <option>SSOE</option>
                <option>Projector</option>
                <option>Projector Screen</option>
                <option>Touch Panel</option>
                <option>Visualiser</option>
                <option>SMax</option>
                <option>Macbook</option>
                <option>Portable HDD</option>
                <option>TV</option>
                <option>Monitor</option>
                <option>OMR</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">AssetNo</label>
              <input type="text" class="form-control" name="AssetNo" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Custodian</label>
              <input type="text" class="form-control" name="Custodian" />
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let inventory = [];

    function renderTable() {
      const tbody = document.querySelector("#inventory-table tbody");
      tbody.innerHTML = "";
      inventory.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.EquipmentType}</td>
          <td>${item.AssetNo}</td>
          <td>${item.Custodian}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="editItem(${index})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteItem(${index})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function openModal(index = null) {
      const modal = new bootstrap.Modal(document.getElementById("inventoryModal"));
      const form = document.getElementById("inventory-form");
      form.reset();

      if (index !== null) {
        const data = inventory[index];
        form.EquipmentType.value = data.EquipmentType;
        form.AssetNo.value = data.AssetNo;
        form.Custodian.value = data.Custodian;
        form.dataset.editIndex = index;
      } else {
        delete form.dataset.editIndex;
      }

      modal.show();
    }

    function editItem(index) {
      openModal(index);
    }

    function deleteItem(index) {
      if (confirm("Are you sure?")) {
        inventory.splice(index, 1);
        renderTable();
      }
    }

    document.getElementById("add-item-btn").addEventListener("click", () => openModal());

    document.getElementById("inventory-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const item = {
        EquipmentType: this.EquipmentType.value,
        AssetNo: this.AssetNo.value,
        Custodian: this.Custodian.value
      };

      if (this.dataset.editIndex) {
        inventory[this.dataset.editIndex] = item;
      } else {
        inventory.push(item);
      }

      renderTable();
      bootstrap.Modal.getInstance(document.getElementById("inventoryModal")).hide();
    });

    renderTable();
  </script>
</body>
</html>
