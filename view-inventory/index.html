<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
    </div>
  </nav>

  <main class="container mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <select id="filter-equipmenttype" class="form-select w-auto">
        <option value="all" selected>All</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>TV</option>
      </select>

      <input type="text" id="search-inventory" placeholder="Search..." class="form-control w-25" />

      <button id="add-item-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#inventoryModal">
        Add Item
      </button>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="inventory-modal-form" novalidate>
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title">Add Inventory Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="equipmentType" class="form-label">Equipment Type</label>
                  <select id="equipmentType" name="equipmentType" class="form-select" required>
                    <option value="">Select Equipment Type</option>
                    <option>SSOE</option>
                    <option>Projector</option>
                    <option>TV</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="equipment" class="form-label">Equipment</label>
                  <select id="equipment" name="equipment" class="form-select">
                    <option value="">Select Equipment</option>
                    <option>Desktop</option>
                    <option>Laptop</option>
                    <option>iPad</option>
                    <option>Mobile Cart</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="assetNo" class="form-label">Asset No</label>
                  <input type="text" id="assetNo" name="assetNo" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="serialNumber" class="form-label">Serial Number</label>
                  <input type="text" id="serialNumber" name="serialNumber" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="dateUpdated" class="form-label">Date Updated</label>
                  <input type="text" id="dateUpdated" name="dateUpdated" class="form-control" readonly />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
