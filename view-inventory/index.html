<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li class="active"><a href="index.html">View Inventory</a></li>
        <li><a href="../fault-report.html">Fault Report</a></li>
        <li>
          <a href="../patching/patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="../patching/patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Inventory List</h2>

      <form id="inventoryForm">
        <!-- Example fields for SSOE inventory, adjust as needed -->
        <input type="text" name="EquipmentType" placeholder="Equipment Type" required />
        <input type="text" name="Vendor" placeholder="Vendor" />
        <input type="text" name="BrandModel" placeholder="BrandModel" />
        <input type="text" name="Profile" placeholder="Profile" />
        <input type="text" name="Custodian" placeholder="Custodian" />
        <input type="text" name="AssetNo" placeholder="Asset No" required />
        <input type="text" name="SerialNumber" placeholder="Serial Number" />
        <input type="text" name="Location" placeholder="Location" />
        <input type="date" name="EndDate" placeholder="End Date" />
        <input type="date" name="StartDate" placeholder="Start Date" />
        <input type="text" name="Hostname" placeholder="Hostname" />
        <input type="text" name="SSOE_PONumber" placeholder="SSOE PO Number" />
        <input type="text" name="CartNo" placeholder="Cart No" />
        <input type="date" name="SanitiseDate" placeholder="Sanitise Date" />
        <input type="text" name="Fault" placeholder="Fault" />
        <button type="submit" class="btn btn-primary">Add Item</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Equipment Type</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>Asset No</th>
            <th>Serial Number</th>
            <th>Location</th>
            <th>End Date</th>
            <th>Start Date</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>Sanitise Date</th>
            <th>Fault</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryTbody"></tbody>
      </table>
    </main>
  </div>
  <script src="../inventory.js"></script>
</body>
</html>
