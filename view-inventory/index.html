<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../styles.css" rel="stylesheet" />

  <style>
    body {
      padding-top: 70px;
      background: #f8f9fa;
    }
    .duration {
      white-space: nowrap;
    }
    .filter-search-bar {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid">

    <div class="d-flex justify-content-between align-items-center filter-search-bar">
      <div>
        <label for="filterEquipmentType" class="form-label fw-bold me-2">Filter by EquipmentType:</label>
        <select id="filterEquipmentType" class="form-select d-inline-block w-auto">
          <option value="All">All</option>
          <option value="SSOE">SSOE</option>
          <option value="Projector">Projector</option>
          <option value="Projector Screen">Projector Screen</option>
          <option value="Macbook">Macbook</option>
          <option value="Speaker">Speaker</option>
          <option value="Apple TV">Apple TV</option>
          <option value="SMax">SMax</option>
          <option value="Portable HDD">Portable HDD</option>
          <option value="TV">TV</option>
          <option value="OMR">OMR</option>
          <option value="Hansvision">Hansvision</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <input type="search" id="searchInventory" class="form-control" placeholder="Search inventory..." style="min-width:250px;" />
        <button class="btn btn-success" id="add-item-btn">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-striped table-bordered align-middle text-nowrap">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Duration in use</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Add/Edit Item -->
  <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content" id="itemForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="itemModalLabel">Add Inventory Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">

          <input type="hidden" id="editIndex" />

          <div class="row g-3">

            <div class="col-md-6">
              <label for="equipmentType" class="form-label">Equipment Type</label>
              <select id="equipmentType" name="equipmentType" class="form-select" required>
                <option value="">Select Equipment Type</option>
                <option value="SSOE">SSOE</option>
                <option value="Projector">Projector</option>
                <option value="Projector Screen">Projector Screen</option>
                <option value="Macbook">Macbook</option>
                <option value="Speaker">Speaker</option>
                <option value="Apple TV">Apple TV</option>
                <option value="SMax">SMax</option>
                <option value="Portable HDD">Portable HDD</option>
                <option value="TV">TV</option>
                <option value="OMR">OMR</option>
                <option value="Hansvision">Hansvision</option>
              </select>
            </div>

            <div class="col-md-6" style="display:none;">
              <label for="equipment" class="form-label">Equipment (SSOE only)</label>
              <select id="equipment" name="equipment" class="form-select">
                <option value="">Select Equipment</option>
                <option value="Desktop">Desktop</option>
                <option value="Laptop">Laptop</option>
                <option value="iPad">iPad</option>
                <option value="Mobile Cart">Mobile Cart</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="vendor" class="form-label">Vendor</label>
              <input type="text" id="vendor" name="vendor" class="form-control" required />
            </div>

            <div class="col-md-6">
              <label for="brandModel" class="form-label">BrandModel</label>
              <input type="text" id="brandModel" name="brandModel" class="form-control" required />
            </div>

            <div class="col-md-6">
              <label for="profile" class="form-label">Profile</label>
              <input type="text" id="profile" name="profile" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="custodian" class="form-label">Custodian</label>
              <input type="text" id="custodian" name="custodian" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="assetNo" class="form-label">Asset No</label>
              <input type="text" id="assetNo" name="assetNo" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="serialNumber" class="form-label">Serial Number</label>
              <input type="text" id="serialNumber" name="serialNumber" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="location" class="form-label">Location</label>
              <input type="text" id="location" name="location" class="form-control" />
            </div>

            <div class="col-md-6">
              <label for="startDate" class="form-label">Start Date</label>
              <input type="date" id="startDate" name="startDate" class="form-control" required />
            </div>

            <div class="col-md-6">
              <label for="endDate" class="form-label">End Date</label>
              <input type="date" id="endDate" name="endDate" class="form-control" />
            </div>

          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Item</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
