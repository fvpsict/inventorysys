<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 60vh; overflow-y: auto; }
    td, th { vertical-align: middle !important; }
    .duration-cell { white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Inventory</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#inventoryModal">Add Inventory</button>
    </div>

    <div class="mb-3">
      <label for="equipmentFilter" class="form-label me-2">Filter by EquipmentType:</label>
      <select id="equipmentFilter" class="form-select w-auto d-inline-block">
        <option value="">All</option>
      </select>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th><th>Vendor</th><th>BrandModel</th><th>Profile</th><th>Custodian</th><th>AssetNo</th><th>SerialNumber</th><th>Location</th><th>EndDate</th><th>StartDate</th><th>Hostname</th><th>SSOE PO Number</th><th>Cart No</th><th>SanitiseDate</th><th>Duration in use</th><th>Lamp Hour</th><th>DateUpdated</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <form id="inventoryForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Inventory</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <!-- Form fields dynamically populated by script -->
        </div>
        <div class="modal-footer">
          <button id="deleteInvBtn" type="button" class="btn btn-danger me-auto" style="display:none;">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS and custom script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('inventoryForm'),
            tbody = document.querySelector('#inventoryTable tbody'),
            modal = new bootstrap.Modal(document.getElementById('inventoryModal')),
            deleteBtn = document.getElementById('deleteInvBtn'),
            equipmentFilter = document.getElementById('equipmentFilter');

      let data = JSON.parse(localStorage.getItem('inventoryData')) || [],
          editIndex = null;

      const fields = [
        {name:'EquipmentType',label:'EquipmentType',type:'text'},
        {name:'Vendor',label:'Vendor',type:'text'},
        {name:'BrandModel',label:'BrandModel',type:'text'},
        {name:'Profile',label:'Profile',type:'text'},
        {name:'Custodian',label:'Custodian',type:'text'},
        {name:'AssetNo',label:'AssetNo',type:'text'},
        {name:'SerialNumber',label:'SerialNumber',type:'text'},
        {name:'Location',label:'Location',type:'text'},
        {name:'EndDate',label:'EndDate',type:'date'},
        {name:'StartDate',label:'StartDate',type:'date'},
        {name:'Hostname',label:'Hostname',type:'text'},
        {name:'SSOE PO Number',label:'SSOE PO Number',type:'text'},
        {name:'Cart No',label:'Cart No',type:'text'},
        {name:'SanitiseDate',label:'SanitiseDate',type:'date'},
        {name:'Lamp Hour',label:'Lamp Hour',type:'number'}
      ];

      function calcDuration(start, end) {
        if(!start) return '';
        const s = new Date(start), e = end ? new Date(end) : new Date();
        let years = e.getFullYear() - s.getFullYear(),
            months = e.getMonth() - s.getMonth();
        if(months < 0) { years--; months +=12; }
        return `${years}y ${months}m`;
      }

      function save() {
        localStorage.setItem('inventoryData', JSON.stringify(data));
      }

      function render() {
        tbody.innerHTML = '';
        const filterVal = equipmentFilter.value;
        const filtered = filterVal ? data.filter(d=>d.EquipmentType===filterVal) : data;

        filtered.forEach((item,i) => {
          const tr = document.createElement('tr');
          fields.forEach(f => {
            const td = document.createElement('td'),
                  inp = document.createElement('input');
            inp.type = f.type;
            inp.className = 'form-control form-control-sm';
            inp.value = item[f.name]||'';
            inp.onchange = () => {
              item[f.name] = inp.value;
              item.DateUpdated = new Date().toISOString().slice(0,10);
              save(); render();
            };
            td.append(inp); tr.append(td);
          });

          const durTd = document.createElement('td');
          durTd.className = 'duration-cell';
          durTd.textContent = calcDuration(item.StartDate, item.EndDate);
          tr.append(durTd);

          const dateTd = document.createElement('td');
          dateTd.textContent = item.DateUpdated||'';
          tr.append(dateTd);

          const actTd = document.createElement('td');
          actTd.innerHTML = '<button class="btn btn-sm btn-primary edit">Edit</button><button class="btn btn-sm btn-danger ms-1 del">Del</button>';
          actTd.querySelector('.edit').onclick = () => openForm(i);
          actTd.querySelector('.del').onclick = () => {
            if(confirm('Delete this item?')) { data.splice(i,1); save(); render(); }
          };
          tr.append(actTd);

          tbody.append(tr);
        });

        const types = [...new Set(data.map(d=>d.EquipmentType).filter(Boolean))];
        equipmentFilter.innerHTML = '<option value="">All</option>' + types.map(t => `<option${t===equipmentFilter.value?' selected':''}>${t}</option>`).join('');
      }

      function buildForm(item={}) {
        const container = form.querySelector('.modal-body');
        container.innerHTML = '';
        fields.forEach(f => {
          const col = document.createElement('div');
          col.className = 'col-md-4 mb-2';
          const label = document.createElement('label');
          label.className = 'form-label';
          label.textContent = f.label;
          const inp = document.createElement('input');
          inp.name = f.name; inp.type = f.type; inp.className = 'form-control';
          inp.value = item[f.name]||'';
          col.append(label, inp);
          container.append(col);
        });
      }

      function openForm(idx=null) {
        editIndex = idx;
        deleteBtn.style.display = idx===null ? 'none' : 'inline-block';
        buildForm(idx!==null ? data[idx] : {});
        modal.show();
      }

      deleteBtn.onclick = () => {
        if(editIndex!==null && confirm('Delete this item?')) {
          data.splice(editIndex,1);
          save(); render();
          modal.hide();
        }
      };

      form.onsubmit = e => {
        e.preventDefault();
        const obj = {};
        fields.forEach(f => obj[f.name] = form.elements[f.name].value);
        obj.DateUpdated = new Date().toISOString().slice(0,10);
        if(editIndex===null) data.push(obj);
        else data[editIndex] = obj;
        save(); render(); modal.hide();
      };

      document.querySelector('[data-bs-target="#inventoryModal"]').onclick = () => openForm(null);
      equipmentFilter.onchange = render;

      render();
    });
  </script>
</body>
</html>
