 <!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    td, th { vertical-align: middle !important; }
    .duration-cell {
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="inventory.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <h1>Inventory</h1>

    <div class="mb-3">
      <label for="filterEquipmentType" class="form-label">Filter by Equipment Type:</label>
      <select id="filterEquipmentType" class="form-select w-auto">
        <option value="">All</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>Visualiser</option>
        <option>Projector Screen</option>
        <option>Apple TV</option>
        <option>SMax</option>
        <option>Portable HDD</option>
        <option>Macbook</option>
        <option>TV</option>
        <option>OMR</option>
        <option>Hansvision</option>
      </select>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <button id="addRowBtn" class="btn btn-success mt-3">Add New Item</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const table = document.getElementById('inventoryTable').getElementsByTagName('tbody')[0];
    const filterSelect = document.getElementById('filterEquipmentType');
    const addRowBtn = document.getElementById('addRowBtn');

    // Load data from localStorage or initialize empty
    let inventoryData = JSON.parse(localStorage.getItem('inventoryData')) || [];

    function calculateDuration(startDateStr) {
      if (!startDateStr) return '';
      const startDate = new Date(startDateStr);
      if (isNaN(startDate)) return '';

      const now = new Date();
      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();

      if (months < 0) {
        years--;
        months += 12;
      }
      return `${years}y ${months}m`;
    }

    function saveData() {
      localStorage.setItem('inventoryData', JSON.stringify(inventoryData));
    }

    function renderTable(filter = '') {
      table.innerHTML = '';
      inventoryData.forEach((item, index) => {
        if (filter && item.EquipmentType !== filter) return;

        const tr = document.createElement('tr');

        // Create editable cells for each field except Actions & Duration (Duration auto calc)
        ['EquipmentType', 'Vendor', 'BrandModel', 'Profile', 'Custodian', 'AssetNo', 'SerialNumber',
         'Location', 'EndDate', 'StartDate', 'Hostname', 'SSOE_PO_Number', 'Cart_No', 'SanitiseDate',
         'Lamp_Hour', 'DateUpdated'].forEach(key => {
          const td = document.createElement('td');

          // For dates and numeric, use input types where appropriate
          let inputType = 'text';
          if (key.toLowerCase().includes('date')) inputType = 'date';
          if (key.toLowerCase().includes('hour')) inputType = 'number';

          const input = document.createElement('input');
          input.type = inputType;
          input.className = 'form-control form-control-sm';
          input.value = item[key] || '';
          input.addEventListener('change', (e) => {
            item[key] = e.target.value;
            if (key === 'StartDate') {
              // Update Duration when StartDate changes
              const durCell = tr.querySelector('.duration-cell');
              durCell.textContent = calculateDuration(item.StartDate);
            }
            saveData();
          });
          td.appendChild(input);
          tr.appendChild(td);
        });

        // Duration cell (auto calculated)
        const durTd = document.createElement('td');
        durTd.className = 'duration-cell';
        durTd.textContent = calculateDuration(item.StartDate);
        tr.appendChild(durTd);

        // Actions cell
        const actionsTd = document.createElement('td');
        actionsTd.innerHTML = `
          <button class="btn btn-danger btn-sm btn-delete">Delete</button>
        `;
        actionsTd.querySelector('.btn-delete').addEventListener('click', () => {
          if (confirm('Delete this item?')) {
            inventoryData.splice(index, 1);
            saveData();
            renderTable(filterSelect.value);
          }
        });
        tr.appendChild(actionsTd);

        table.appendChild(tr);
      });
    }

    filterSelect.addEventListener('change', () => {
      renderTable(filterSelect.value);
    });

    addRowBtn.addEventListener('click', () => {
      // Add blank item with all keys, matching the header keys
      const newItem = {
        EquipmentType: '',
        Vendor: '',
        BrandModel: '',
        Profile: '',
        Custodian: '',
        AssetNo: '',
        SerialNumber: '',
        Location: '',
        EndDate: '',
        StartDate: '',
        Hostname: '',
        SSOE_PO_Number: '',
        Cart_No: '',
        SanitiseDate: '',
        Lamp_Hour: '',
        DateUpdated: ''
      };
      inventoryData.push(newItem);
      saveData();
      renderTable(filterSelect.value);
    });

    // Initial render
    renderTable();
  </script>
</body>
</html>
