<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 60vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Inventory</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#inventoryModal">
        Add Inventory
      </button>
    </div>

    <!-- EquipmentType Filter -->
    <div class="mb-3">
      <label for="equipmentFilter" class="form-label">Filter by EquipmentType:</label>
      <select id="equipmentFilter" class="form-select w-auto d-inline-block">
        <option value="">All</option>
      </select>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered table-sm">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <form id="inventoryForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Inventory</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <!-- Dynamic form fields injected here -->
        </div>
        <div class="modal-footer">
          <button id="deleteInvBtn" type="button" class="btn btn-danger me-auto" style="display:none;">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('inventoryForm');
      const tbody = document.querySelector('#inventoryTable tbody');
      const thead = document.querySelector('#inventoryTable thead');
      const modal = new bootstrap.Modal(document.getElementById('inventoryModal'));
      const deleteBtn = document.getElementById('deleteInvBtn');
      const equipmentFilter = document.getElementById('equipmentFilter');
      let data = JSON.parse(localStorage.getItem('inventory')) || [];
      let editIdx = null;

      // Headers exactly as requested
      const headers = [
        "EquipmentType", "Vendor", "BrandModel", "Profile", "Custodian", "AssetNo", "SerialNumber",
        "Location", "EndDate", "StartDate", "Hostname", "SSOE PO Number", "Cart No", "SanitiseDate",
        "DurationInUse", "LampHour", "DateUpdated", "Actions"
      ];

      // Fields for form, matching headers except Actions and DurationInUse, DateUpdated are auto
      const formFields = [
        {name: "EquipmentType", label: "EquipmentType", type: "text"},
        {name: "Vendor", label: "Vendor", type: "text"},
        {name: "BrandModel", label: "BrandModel", type: "text"},
        {name: "Profile", label: "Profile", type: "text"},
        {name: "Custodian", label: "Custodian", type: "text"},
        {name: "AssetNo", label: "AssetNo", type: "text", required:true},
        {name: "SerialNumber", label: "SerialNumber", type: "text"},
        {name: "Location", label: "Location", type: "text"},
        {name: "EndDate", label: "EndDate", type: "date"},
        {name: "StartDate", label: "StartDate", type: "date"},
        {name: "Hostname", label: "Hostname", type: "text"},
        {name: "SSOE PO Number", label: "SSOE PO Number", type: "text"},
        {name: "Cart No", label: "Cart No", type: "text"},
        {name: "SanitiseDate", label: "SanitiseDate", type: "date"},
        {name: "LampHour", label: "Lamp Hour", type: "text"}
      ];

      // Calculate duration in use string (years + months)
      function calculateDuration(startInput, endInput) {
        if (!startInput) return '';
        const start = new Date(startInput);
        const end = endInput ? new Date(endInput) : new Date();
        let years = end.getFullYear() - start.getFullYear();
        let months = end.getMonth() - start.getMonth();
        if (months < 0) {
          years--;
          months += 12;
        }
        if (years < 0) return '';
        return `${years} year(s) ${months} month(s)`;
      }

      // Render table header
      function renderHeaders() {
        thead.innerHTML = '';
        const tr = document.createElement('tr');
        headers.forEach(hdr => {
          const th = document.createElement('th');
          // Beautify header label
          th.textContent = hdr === "DurationInUse" ? "Duration in use" : (hdr === "LampHour" ? "Lamp Hour" : (hdr === "Actions" ? "Actions" : hdr));
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }

      // Render table rows
      function renderRows(filteredData) {
        tbody.innerHTML = '';
        filteredData.forEach((item, i) => {
          const tr = document.createElement('tr');

          headers.forEach(hdr => {
            const td = document.createElement('td');
            if (hdr === "Actions") {
              td.innerHTML = `
                <button class="btn btn-sm btn-primary edit-btn" data-i="${i}">Edit</button>
                <button class="btn btn-sm btn-danger del-btn" data-i="${i}">Del</button>`;
            } else if (hdr === "DurationInUse") {
              td.textContent = item.DurationInUse || calculateDuration(item.StartDate, item.EndDate);
            } else {
              td.textContent = item[hdr] || '';
            }
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });
      }

      // Render equipment filter dropdown
      function renderFilter() {
        const types = Array.from(new Set(data.map(d => d.EquipmentType).filter(Boolean)));
        equipmentFilter.innerHTML = `<option value="">All</option>` +
          types.map(t => `<option value="${t}" ${t === equipmentFilter.value ? "selected" : ""}>${t}</option>`).join('');
      }

      // Render entire table and filter
      function render() {
        renderFilter();
        renderHeaders();

        const filterVal = equipmentFilter.value;
        const filtered = filterVal ? data.filter(d => d.EquipmentType === filterVal) : data;
        renderRows(filtered);
      }

      // Build form fields dynamically
      function buildFormFields(values = {}) {
        const container = form.querySelector('.modal-body');
        container.innerHTML = '';

        formFields.forEach(f => {
          const col = document.createElement('div');
          col.className = 'col-md-6';

          const label = document.createElement('label');
          label.className = 'form-label';
          label.textContent = f.label;
          label.setAttribute('for', f.name);

          const input = document.createElement('input');
          input.type = f.type;
          input.className = 'form-control';
          input.name = f.name;
          if (f.required) input.required = true;
          input.value = values[f.name] || '';

          col.appendChild(label);
          col.appendChild(input);
          container.appendChild(col);
        });
      }

      // Clear form and reset state
      function clearForm() {
        form.reset();
        editIdx = null;
        deleteBtn.style.display = 'none';
        buildFormFields();
      }

      // Fill form for editing
      function fillForm(item) {
        buildFormFields(item);
      }

      // Open modal for add new
      document.querySelector('button[data-bs-target="#inventoryModal"]').addEventListener('click', () => {
        clearForm();
        modal.show();
      });

      // Handle edit/delete button clicks on table rows
      tbody.addEventListener('click', e => {
        const btn = e.target;
        const i = btn.dataset.i;
        if (btn.classList.contains('edit-btn')) {
          editIdx = i;
          fillForm(data[i]);
          deleteBtn.style.display = 'inline-block';
          modal.show();
        }
        if (btn.classList.contains('del-btn') && confirm('Delete this record?')) {
          data.splice(i, 1);
          localStorage.setItem('inventory', JSON.stringify(data));
          render();
        }
      });

      // Delete button in modal
      deleteBtn.addEventListener('click', () => {
        if (editIdx !== null && confirm('Are you sure you want to delete this item?')) {
          data.splice(editIdx, 1);
          localStorage.setItem('inventory', JSON.stringify(data));
          render();
          modal.hide();
          clearForm();
        }
      });

      // Handle form submit (add/edit)
      form.addEventListener('submit', e => {
        e.preventDefault();
        const obj = {};
        for (const el of form.elements) {
          if (el.name && el.type !== 'submit' && el.type !== 'button') {
            obj[el.name] = el.value.trim();
          }
        }

        obj.DurationInUse = calculateDuration(obj.StartDate, obj.EndDate);
        obj.DateUpdated = new Date().toISOString().slice(0,10);

        if (editIdx === null) {
          data.push(obj);
        } else {
          data[editIdx] = obj;
        }

        localStorage.setItem('inventory', JSON.stringify(data));
        render();
        modal.hide();
        clearForm();
      });

      equipmentFilter.addEventListener('change', render);

      // Initial render
      render();
    });
  </script>
</body>
</html>
