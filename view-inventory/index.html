<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    td, th { vertical-align: middle !important; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <h1>Inventory</h1>

    <div class="mb-3">
      <label for="filterEquipmentType" class="form-label">Filter by Equipment Type:</label>
      <select id="filterEquipmentType" class="form-select w-auto">
        <option value="">All</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>Visualiser</option>
        <option>Projector Screen</option>
        <option>Apple TV</option>
        <option>SMax</option>
        <option>Portable HDD</option>
        <option>Macbook</option>
        <option>TV</option>
        <option>OMR</option>
        <option>Hansvision</option>
      </select>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <button id="addRowBtn" class="btn btn-success mt-3">Add New Item</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tableBody = document.querySelector('#inventoryTable tbody');
    const filterSelect = document.getElementById('filterEquipmentType');
    const addRowBtn = document.getElementById('addRowBtn');

    let data = JSON.parse(localStorage.getItem('inventoryData')) || [];

    // Calculate duration from StartDate to now
    function calcDuration(startStr) {
      if (!startStr) return '';
      const s = new Date(startStr), now = new Date();
      let years = now.getFullYear() - s.getFullYear();
      let months = now.getMonth() - s.getMonth();
      if (months < 0) { years--; months += 12; }
      return `${years}y ${months}m`;
    }

    const columns = [
      'EquipmentType', 'Vendor', 'BrandModel', 'Profile', 'Custodian',
      'AssetNo', 'SerialNumber', 'Location', 'EndDate', 'StartDate',
      'Hostname', 'PO Number', 'Cart No', 'SanitiseDate', 
      'Duration in use', 'Last Updated'
    ];

    function saveData() {
      localStorage.setItem('inventoryData', JSON.stringify(data));
    }

    function render(filter = '') {
      tableBody.innerHTML = '';
      data.forEach((item, idx) => {
        if (filter && item.EquipmentType !== filter) return;
        const tr = document.createElement('tr');

        columns.forEach(col => {
          const td = document.createElement('td');
          if (col === 'Duration in use') {
            td.textContent = calcDuration(item['StartDate']);
          } else if (col === 'Last Updated') {
            td.textContent = item['Last Updated'] || '';
          } else {
            const input = document.createElement('input');
            input.type = col.includes('Date') ? 'date' : 'text';
            input.className = 'form-control form-control-sm';
            input.value = item[col] || '';
            input.addEventListener('change', () => {
              item[col] = input.value;
              item['Last Updated'] = new Date().toISOString().split('T')[0];
              saveData();
              render(filter);
            });
            td.appendChild(input);
          }
          tr.appendChild(td);
        });

        // Actions cell
        const actionTd = document.createElement('td');
        actionTd.innerHTML = `<button class="btn btn-danger btn-sm">Delete</button>`;
        actionTd.querySelector('button').addEventListener('click', () => {
          if (confirm('Delete this item?')) {
            data.splice(idx, 1);
            saveData();
            render(filter);
          }
        });
        tr.appendChild(actionTd);

        tableBody.appendChild(tr);
      });

      // Refresh filter options
      const types = Array.from(new Set(data.map(d => d.EquipmentType).filter(Boolean)));
      filterSelect.innerHTML = `<option value="">All</option>` +
        types.map(t => `<option${t === filter ? ' selected' : ''}>${t}</option>`).join('');
    }

    filterSelect.addEventListener('change', () => render(filterSelect.value));

    addRowBtn.addEventListener('click', () => {
      const newItem = columns.reduce((o, c) => {
        o[c] = '';
        return o;
      }, {});
      data.push(newItem);
      saveData();
      render(filterSelect.value);
    });

    // Initial render
    render(filterSelect.value);
  </script>
</body>
</html>
