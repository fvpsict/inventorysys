<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    th, td { vertical-align: middle !important; text-align: center; }
    /* Duration column narrower */
    th.duration, td.duration { width: 130px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html" rel="noopener noreferrer">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html" aria-current="page">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
      <h1>Inventory</h1>
      <button id="add-item-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#itemModal">Add Item</button>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped table-hover">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th class="duration">Duration In Use</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Add/Edit Item -->
  <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="itemForm">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="itemModalLabel">Add Inventory Item</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="equipmentType" class="form-label fw-bold">Equipment Type</label>
                <select id="equipmentType" name="equipmentType" class="form-select" required>
                  <option value="">Select Equipment Type</option>
                  <option>SSOE</option>
                  <option>Projector</option>
                  <option>Projector Screen</option>
                  <option>Patch Panel</option>
                  <option>Macbook</option>
                  <option>Speaker</option>
                  <option>Apple TV</option>
                  <option>SMax</option>
                  <option>Portable HDD</option>
                  <option>TV</option>
                  <option>OMR</option>
                  <option>Hansvision</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="vendor" class="form-label fw-bold">Vendor</label>
                <input type="text" id="vendor" name="vendor" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label for="brandModel" class="form-label fw-bold">Brand/Model</label>
                <input type="text" id="brandModel" name="brandModel" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label for="profile" class="form-label fw-bold">Profile</label>
                <input type="text" id="profile" name="profile" class="form-control" />
              </div>
              <div class="col-md-4">
                <label for="custodian" class="form-label fw-bold">Custodian</label>
                <input type="text" id="custodian" name="custodian" class="form-control" />
              </div>
              <div class="col-md-4">
                <label for="assetNo" class="form-label fw-bold">Asset No</label>
                <input type="text" id="assetNo" name="assetNo" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label for="serialNumber" class="form-label fw-bold">Serial Number</label>
                <input type="text" id="serialNumber" name="serialNumber" class="form-control" />
              </div>
              <div class="col-md-4">
                <label for="location" class="form-label fw-bold">Location</label>
                <input type="text" id="location" name="location" class="form-control" />
              </div>

              <div class="col-md-4">
                <label for="startDate" class="form-label fw-bold">Start Date</label>
                <input type="date" id="startDate" name="startDate" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label for="endDate" class="form-label fw-bold">End Date</label>
                <input type="date" id="endDate" name="endDate" class="form-control" />
                <small class="form-text text-muted">Leave empty if still in use</small>
              </div>

            </div>
          </div>
          <div class="modal-footer">
            <input type="hidden" id="editIndex" />
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="saveItemBtn" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Elements
    const tableBody = document.querySelector('#inventory-table tbody');
    const addItemBtn = document.getElementById('add-item-btn');
    const itemModal = new bootstrap.Modal(document.getElementById('itemModal'));
    const itemForm = document.getElementById('itemForm');
    const modalTitle = document.getElementById('itemModalLabel');
    const editIndexInput = document.getElementById('editIndex');

    // Storage Key
    const STORAGE_KEY = 'fvpsInventory';

    // Load saved data or empty array
    let inventory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Utility: Calculate Duration In Use (years + months)
    function calculateDuration(startDateStr, endDateStr) {
      if (!startDateStr) return '';
      const startDate = new Date(startDateStr);
      const endDate = endDateStr ? new Date(endDateStr) : new Date();
      if (endDate < startDate) return 'Invalid dates';

      let years = endDate.getFullYear() - startDate.getFullYear();
      let months = endDate.getMonth() - startDate.getMonth();

      if (months < 0) {
        years--;
        months += 12;
      }

      let durationStr = '';
      if (years > 0) durationStr += years + (years === 1 ? ' yr ' : ' yrs ');
      if (months > 0) durationStr += months + (months === 1 ? ' mo' : ' mos');
      if (durationStr === '') durationStr = 'Less than 1 month';

      return durationStr.trim();
    }

    // Render inventory table
    function renderTable() {
      tableBody.innerHTML = '';
      if (inventory.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="12" class="text-center">No inventory items found.</td></tr>`;
        return;
      }
      inventory.forEach((item, idx) => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${item.equipmentType || ''}</td>
          <td>${item.vendor || ''}</td>
          <td>${item.brandModel || ''}</td>
          <td>${item.profile || ''}</td>
          <td>${item.custodian || ''}</td>
          <td>${item.assetNo || ''}</td>
          <td>${item.serialNumber || ''}</td>
          <td>${item.location || ''}</td>
          <td>${item.startDate || ''}</td>
          <td>${item.endDate || ''}</td>
          <td class="duration">${calculateDuration(item.startDate, item.endDate)}</td>
          <td>
            <button class="btn btn-sm btn-primary btn-edit" data-index="${idx}">Edit</button>
            <button class="btn btn-sm btn-danger btn-delete" data-index="${idx}">Delete</button>
          </td>
        `;

        tableBody.appendChild(tr);
      });

      // Attach event listeners for edit/delete buttons
      document.querySelectorAll('.btn-edit').forEach(btn =>
        btn.addEventListener('click', e => openEditModal(e.target.dataset.index))
      );
      document.querySelectorAll('.btn-delete').forEach(btn =>
        btn.addEventListener('click', e => deleteItem(e.target.dataset.index))
      );
    }

    // Open modal for editing an item
    function openEditModal(index) {
      const item = inventory[index];
      if (!item) return;

      modalTitle.textContent = 'Edit Inventory Item';
      editIndexInput.value = index;

      itemForm.equipmentType.value = item.equipmentType || '';
      itemForm.vendor.value = item.vendor || '';
      itemForm.brandModel.value = item.brandModel || '';
      itemForm.profile.value = item.profile || '';
      itemForm.custodian.value = item.custodian || '';
      itemForm.assetNo.value = item.assetNo || '';
      itemForm.serialNumber.value = item.serialNumber || '';
      itemForm.location.value = item.location || '';
      itemForm.startDate.value = item.startDate || '';
      itemForm.endDate.value = item.endDate || '';

      itemModal.show();
    }

    // Delete item
    function deleteItem(index) {
      if (confirm('Are you sure you want to delete this item?')) {
        inventory.splice(index, 1);
        saveAndRender();
      }
    }

    // Save and render data
    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
      renderTable();
    }

    // Reset and open modal for new item
    addItemBtn.addEventListener('click', () => {
      modalTitle.textContent = 'Add Inventory Item';
      editIndexInput.value = '';
      itemForm.reset();
    });

    // Handle form submit
    itemForm.addEventListener('submit', e => {
      e.preventDefault();

      // Validate required fields (HTML5 validation will mostly handle this)
      if (!itemForm.checkValidity()) {
        itemForm.reportValidity();
        return;
      }

      const newItem = {
        equipmentType: itemForm.equipmentType.value.trim(),
        vendor: itemForm.vendor.value.trim(),
        brandModel: itemForm.brandModel.value.trim(),
        profile: itemForm.profile.value.trim(),
        custodian: itemForm.custodian.value.trim(),
        assetNo: itemForm.assetNo.value.trim(),
        serialNumber: itemForm.serialNumber.value.trim(),
        location: itemForm.location.value.trim(),
        startDate: itemForm.startDate.value,
        endDate: itemForm.endDate.value || ''
      };

      const editIndex = editIndexInput.value;

      if (editIndex === '') {
        // Add new
        inventory.push(newItem);
      } else {
        // Update existing
        inventory[editIndex] = newItem;
      }

      saveAndRender();
      itemModal.hide();
    });

    // Initial render
    renderTable();
  </script>
</body>
</html>
