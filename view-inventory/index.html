<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="https://fvpsict.github.io/inventorysys/fault-report.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report/fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 pt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <label for="filter-equipmenttype" class="form-label me-2 fw-bold">Filter by EquipmentType:</label>
        <select id="filter-equipmenttype" class="form-select d-inline-block w-auto">
          <option value="all">All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Touch Panel</option>
          <option>Visualiser</option>
          <option>SMax</option>
          <option>Macbook</option>
          <option>Portable HDD</option>
          <option>TV</option>
          <option>Monitor</option>
          <option>OMR</option>
          <option>AV</option>
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input
          type="search"
          id="search-inventory"
          class="form-control"
          placeholder="Search inventory..."
          style="min-width: 200px"
        />
        <button id="add-item-btn" class="btn btn-success">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>Brand/Model</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>Asset No</th>
            <th>Serial No</th>
            <th>Location</th>
            <th>Start Date</th>
            <th>Duration in use</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Inventory rows injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Inventory Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-form">
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="EquipmentType" class="form-label">Equipment Type *</label>
                <select
                  id="EquipmentType"
                  name="EquipmentType"
                  class="form-select"
                >
                  <option value="" disabled selected>Select Equipment Type</option>
                  <option>SSOE</option>
                  <option>Projector</option>
                  <option>Projector Screen</option>
                  <option>Touch Panel</option>
                  <option>Visualiser</option>
                  <option>SMax</option>
                  <option>Macbook</option>
                  <option>Portable HDD</option>
                  <option>TV</option>
                  <option>Monitor</option>
                  <option>OMR</option>
                  <option>AV</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="Equipment" class="form-label">Equipment *</label>
                <select
                  id="Equipment"
                  name="Equipment"
                  class="form-select"
                  required
                >
                  <option value="" disabled selected>Select Equipment</option>
                  <option>Desktop</option>
                  <option>Laptop</option>
                  <option>iPad</option>
                  <option>Mobile Cart</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="Vendor" class="form-label">Vendor</label>
                <input type="text" id="Vendor" name="Vendor" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="BrandModel" class="form-label">Brand/Model</label>
                <input
                  type="text"
                  id="BrandModel"
                  name="BrandModel"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="Profile" class="form-label">Profile</label>
                <input type="text" id="Profile" name="Profile" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="Custodian" class="form-label">Custodian</label>
                <input
                  type="text"
                  id="Custodian"
                  name="Custodian"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input
                  type="text"
                  id="AssetNo"
                  name="AssetNo"
                  class="form-control"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-6">
                <label for="SerialNumber" class="form-label">Serial No</label>
                <input
                  type="text"
                  id="SerialNumber"
                  name="SerialNumber"
                  class="form-control"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-6">
                <label for="Location" class="form-label">Location</label>
                <input
                  type="text"
                  id="Location"
                  name="Location"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="StartDate" class="form-label">Start Date</label>
                <input
                  type="date"
                  id="StartDate"
                  name="StartDate"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  id="DateUpdated"
                  name="DateUpdated"
                  class="form-control"
                  readonly
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
