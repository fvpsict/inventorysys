<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    /* Custom styles */
    body {
      padding: 1rem;
      background: #f8f9fa;
    }
    table thead th {
      background-color: #007bff;
      color: white;
      vertical-align: middle;
      text-align: center;
    }
    table tbody td {
      vertical-align: middle;
    }
    .filter-search-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <h2 class="mb-3">FVPS Inventory Management</h2>

  <div class="filter-search-row">
    <div class="d-flex align-items-center gap-2">
      <label for="filter-equipmenttype" class="form-label mb-0">Filter by Equipment Type:</label>
      <select id="filter-equipmenttype" class="form-select">
        <option value="all" selected>All</option>
        <option value="ssoe">SSOE</option>
        <option value="projector">Projector</option>
        <option value="projector screen">Projector Screen</option>
        <option value="patch panel">Patch Panel</option>
        <option value="macbook">Macbook</option>
        <option value="speaker">Speaker</option>
        <option value="apple tv">Apple TV</option>
        <option value="smax">SMax</option>
        <option value="portable hdd">Portable HDD</option>
        <option value="tv">TV</option>
        <option value="omr">OMR</option>
        <option value="hansvision">Hansvision</option>
      </select>
    </div>

    <div class="d-flex align-items-center gap-2">
      <label for="search-inventory" class="form-label mb-0">Search:</label>
      <input
        type="search"
        id="search-inventory"
        class="form-control"
        placeholder="Search inventory..."
      />
    </div>

    <button id="add-item-btn" class="btn btn-success">Add Item</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped" id="inventory-table">
      <thead>
        <tr>
          <th>Equipment Type</th>
          <th>Vendor</th>
          <th>Brand Model</th>
          <th>Profile</th>
          <th>Custodian</th>
          <th>Asset No</th>
          <th>Serial Number</th>
          <th>Location</th>
          <th>End Date</th>
          <th>Start Date</th>
          <th>Hostname</th>
          <th>SSOE PO Number</th>
          <th>Cart No</th>
          <th>Sanitise Date</th>
          <th>Duration in Use</th>
          <th>Lamp Hour</th>
          <th>Date Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Populated by inventory.js -->
      </tbody>
    </table>
  </div>

  <!-- Inventory Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-modal-form">
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="equipmentType" class="form-label">Equipment Type</label>
                <select
                  class="form-select"
                  name="EquipmentType"
                  id="equipmentType"
                  required
                >
                  <option value="" selected disabled>Select...</option>
                  <option value="SSOE">SSOE</option>
                  <option value="Projector">Projector</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Patch Panel">Patch Panel</option>
                  <option value="Macbook">Macbook</option>
                  <option value="Speaker">Speaker</option>
                  <option value="Apple TV">Apple TV</option>
                  <option value="SMax">SMax</option>
                  <option value="Portable HDD">Portable HDD</option>
                  <option value="TV">TV</option>
                  <option value="OMR">OMR</option>
                  <option value="Hansvision">Hansvision</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="vendor" class="form-label">Vendor</label>
                <input
                  type="text"
                  class="form-control"
                  id="vendor"
                  name="Vendor"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="brandModel" class="form-label">Brand Model</label>
                <input
                  type="text"
                  class="form-control"
                  id="brandModel"
                  name="BrandModel"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="profile" class="form-label">Profile</label>
                <input
                  type="text"
                  class="form-control"
                  id="profile"
                  name="Profile"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="custodian" class="form-label">Custodian</label>
                <input
                  type="text"
                  class="form-control"
                  id="custodian"
                  name="Custodian"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="assetNo" class="form-label">Asset No</label>
                <input
                  type="text"
                  class="form-control"
                  id="assetNo"
                  name="AssetNo"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="col-md-4">
                <label for="serialNumber" class="form-label">Serial Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="serialNumber"
                  name="SerialNumber"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="location" class="form-label">Location</label>
                <input
                  type="text"
                  class="form-control"
                  id="location"
                  name="Location"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="endDate" class="form-label">End Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="endDate"
                  name="EndDate"
                />
              </div>

              <div class="col-md-4">
                <label for="startDate" class="form-label">Start Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="startDate"
                  name="StartDate"
                />
              </div>

              <div class="col-md-4">
                <label for="hostname" class="form-label">Hostname</label>
                <input
                  type="text"
                  class="form-control"
                  id="hostname"
                  name="Hostname"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="ssoePoNumber" class="form-label">SSOE PO Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="ssoePoNumber"
                  name="SSOE_PONumber"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="cartNo" class="form-label">Cart No</label>
                <input
                  type="text"
                  class="form-control"
                  id="cartNo"
                  name="CartNo"
                  autocomplete="off"
                />
              </div>

              <div class="col-md-4">
                <label for="sanitiseDate" class="form-label">Sanitise Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="sanitiseDate"
                  name="SanitiseDate"
                />
              </div>

              <div class="col-md-4">
                <label for="lampHour" class="form-label">Lamp Hour</label>
                <input
                  type="number"
                  class="form-control"
                  id="lampHour"
                  name="LampHour"
                  min="0"
                />
              </div>

              <div class="col-md-4 d-none">
                <label for="dateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  class="form-control"
                  id="dateUpdated"
                  name="DateUpdated"
                  readonly
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
