<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar" aria-label="Main Navigation">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="../index.html">Home</a></li>
        <li class="active"><a href="index.html" aria-current="page">View Inventory</a></li>
        <li><a href="../fault-report.html">Fault Report</a></li>
        <li>
          <a href="../patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="../patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content" role="main">
      <section class="form-section">
        <h2>Add Inventory Item</h2>
        <form id="addItemForm">
          <div class="mb-3">
            <label for="assetNo" class="form-label">Asset No (Unique & Required)</label>
            <input type="text" class="form-control" id="assetNo" required />
          </div>
          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" />
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" />
          </div>
          <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" min="1" value="1" />
          </div>
          <button type="submit" class="btn btn-primary">Add Item</button>
        </form>
      </section>

      <section class="mb-3">
        <div class="btn-group">
          <button id="exportCsvBtn" class="btn btn-secondary">Export CSV</button>
          <input type="file" id="importCsvInput" accept=".csv" style="display:none;" />
          <button id="importCsvBtn" class="btn btn-secondary">Import CSV</button>
          <button id="clearInventoryBtn" class="btn btn-danger">Clear Inventory</button>
        </div>

        <input
          type="text"
          id="searchInput"
          placeholder="Search inventory..."
          class="form-control"
          style="max-width: 300px;"
        />
      </section>

      <section>
        <h2>Inventory Items</h2>
        <table class="table table-striped" aria-label="Inventory table">
          <thead>
            <tr>
              <th>Asset No</th>
              <th>Category</th>
              <th>Description</th>
              <th>Location</th>
              <th>Quantity</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'inventoryItems';

    function getInventory() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveInventory(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderTable(filter = '') {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      const items = getInventory();
      const filteredItems = items.filter(item =>
        Object.values(item).some(val =>
          val.toString().toLowerCase().includes(filter.toLowerCase())
        )
      );

      if (filteredItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No inventory items found.</td></tr>';
        return;
      }

      filteredItems.forEach((item, index) => {
        const tr = document.createElement('tr');

        // Asset No (editable)
        const assetNoTd = document.createElement('td');
        assetNoTd.contentEditable = true;
        assetNoTd.innerText = item.assetNo;
        assetNoTd.setAttribute('aria-label', 'Asset Number');
        assetNoTd.oninput = () => updateItem(index, 'assetNo', assetNoTd.innerText);
        tr.appendChild(assetNoTd);

        // Other editable fields
        ['category', 'description', 'location', 'quantity'].forEach(key => {
          const td = document.createElement('td');
          td.contentEditable = true;
          td.innerText = item[key] ?? '';
          td.oninput = () => updateItem(index, key, td.innerText);
          tr.appendChild(td);
        });

        // Actions: Delete button
        const actionsTd = document.createElement('td');
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-sm btn-danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.setAttribute('aria-label', `Delete inventory item ${item.assetNo}`);
        deleteBtn.onclick = () => deleteItem(index);
        actionsTd.appendChild(deleteBtn);
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });
    }

    function updateItem(index, key, value) {
      const items = getInventory();
      if (!items[index]) return;

      value = value.trim();

      if (key === 'assetNo') {
        if (!value) {
          alert('Asset No cannot be empty.');
          renderTable();
          return;
        }
        // Check uniqueness except current item
        const duplicate = items.some((item, i) => i !== index && item.assetNo.toLowerCase() === value.toLowerCase());
        if (duplicate) {
          alert('Asset No must be unique.');
          renderTable();
          return;
        }
        items[index][key] = value;
      } else if (key === 'quantity') {
        const qty = parseInt(value);
        items[index][key] = isNaN(qty) || qty < 1 ? 1 : qty;
      } else {
        items[index][key] = value;
      }

      saveInventory(items);
      renderTable(document.getElementById('searchInput').value);
    }

    function deleteItem(index) {
      const items = getInventory();
      if (index >= 0 && index < items.length) {
        if (confirm(`Are you sure you want to delete asset no "${items[index].assetNo}"?`)) {
          items.splice(index, 1);
          saveInventory(items);
          renderTable(document.getElementById('searchInput').value);
        }
      }
    }

    document.getElementById('addItemForm').addEventListener('submit', e => {
      e.preventDefault();

      const assetNo = document.getElementById('assetNo').value.trim();
      const category = document.getElementById('category').value.trim();
      const description = document.getElementById('description').value.trim();
      const location = document.getElementById('location').value.trim();
      let quantity = parseInt(document.getElementById('quantity').value);

      if (!assetNo) {
        alert('Asset No is required.');
        return;
      }

      const items = getInventory();
      const duplicate = items.some(item => item.assetNo.toLowerCase() === assetNo.toLowerCase());
      if (duplicate) {
        alert('Asset No must be unique.');
        return;
      }

      if (isNaN(quantity) || quantity < 1) quantity = 1;

      items.push({ assetNo, category, description, location, quantity });
      saveInventory(items);
      renderTable(document.getElementById('searchInput').value);
      e.target.reset();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      renderTable(e.target.value);
    });

    // CSV Export
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const items = getInventory();
      if (items.length === 0) {
        alert('No inventory data to export.');
        return;
      }
      const headers = ['Asset No', 'Category', 'Description', 'Location', 'Quantity'];
      const csvRows = [headers.join(',')];

      items.forEach(item => {
        const row = [
          `"${item.assetNo.replace(/"/g, '""')}"`,
          `"${(item.category ?? '').replace(/"/g, '""')}"`,
          `"${(item.description ?? '').replace(/"/g, '""')}"`,
          `"${(item.location ?? '').replace(/"/g, '""')}"`,
          item.quantity
        ];
        csvRows.push(row.join(','));
      });

      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'inventory.csv';
      a.click();

      URL.revokeObjectURL(url);
    });

    // CSV Import
    const importInput = document.getElementById('importCsvInput');
    document.getElementById('importCsvBtn').addEventListener('click', () => {
      importInput.click();
    });

    importInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const text = event.target.result;
          const lines = text.trim().split('\n');
          if (lines.length < 2) throw new Error('CSV has no data');

          const header = lines[0].split(',').map(h => h.trim().toLowerCase());
          const expectedHeaders = ['asset no', 'category', 'description', 'location', 'quantity'];
          for (let i = 0; i < expectedHeaders.length; i++) {
            if (!header[i] || header[i] !== expectedHeaders[i]) {
              throw new Error(`CSV header mismatch. Expected "${expectedHeaders.join(', ')}"`);
            }
          }

          const newItems = [];
          const existingItems = getInventory();

          for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 5) continue;

            const assetNo = cols[0].trim();
            if (!assetNo) continue;

            const category = cols[1].trim();
            const description = cols[2].trim();
            const location = cols[3].trim();
            let quantity = parseInt(cols[4]);
            if (isNaN(quantity) || quantity < 1) quantity = 1;

            if (
              existingItems.some(item => item.assetNo.toLowerCase() === assetNo.toLowerCase()) ||
              newItems.some(item => item.assetNo.toLowerCase() === assetNo.toLowerCase())
            ) {
              continue;
            }

            newItems.push({ assetNo, category, description, location, quantity });
          }

          const combinedItems = existingItems.concat(newItems);
          saveInventory(combinedItems);
          renderTable(document.getElementById('searchInput').value);
          alert(`Imported ${newItems.length} new items.`);
        } catch (err) {
          alert('Error importing CSV: ' + err.message);
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    });

    function parseCSVLine(text) {
      const regex = /("([^"]|"")*"|[^,]*)(,|$)/g;
      const fields = [];
      let match;
      while ((match = regex.exec(text)) !== null) {
        let field = match[1];
        if (field.startsWith('"') && field.endsWith('"')) {
          field = field.slice(1, -1).replace(/""/g, '"');
        }
        fields.push(field);
        if (match[3] === '') break;
      }
      return fields;
    }

    // Clear inventory
    document.getElementById('clearInventoryBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to clear the entire inventory? This cannot be undone.')) {
        localStorage.removeItem(STORAGE_KEY);
        renderTable();
      }
    });

    // Initial render
    renderTable();
  </script>
</body>
</html>
