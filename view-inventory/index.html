<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory Management</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Inventory</a>
          </li>
          <!-- Add other nav links if needed -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Inventory</h2>
      <button class="btn btn-success" id="add-item-btn">Add Item</button>
    </div>

    <div class="table-responsive" style="max-height: 75vh; overflow-y: auto;">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead class="table-primary sticky-top">
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration In Use</th>
            <th>Lamp Hour</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Table rows inserted here by inventory.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Inventory Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add / Edit Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="equipmentType" class="form-label">Equipment Type</label>
                <select class="form-select" id="equipmentType" required>
                  <option value="">Select Type</option>
                  <option value="SSOE">SSOE</option>
                  <option value="Projector">Projector</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Patch Panel">Patch Panel</option>
                  <option value="Macbook">Macbook</option>
                  <option value="Speaker">Speaker</option>
                  <option value="Apple TV">Apple TV</option>
                  <option value="SMax">SMax</option>
                  <option value="Portable HDD">Portable HDD</option>
                  <option value="TV">TV</option>
                  <option value="OMR">OMR</option>
                  <option value="Hansvision">Hansvision</option>
                </select>
              </div>

              <div class="col-md-3">
                <label for="equipment" class="form-label">
                  Equipment <span id="equipment-required-star" class="text-danger d-none">*</span>
                </label>
                <select class="form-select" id="equipment">
                  <option value="">Select Equipment</option>
                  <option value="Desktop">Desktop</option>
                  <option value="Laptop">Laptop</option>
                  <option value="iPad">iPad</option>
                  <option value="Mobile Cart">Mobile Cart</option>
                </select>
              </div>

              <div class="col-md-3">
                <label for="vendor" class="form-label">Vendor</label>
                <input type="text" class="form-control" id="vendor" />
              </div>

              <div class="col-md-3">
                <label for="brandModel" class="form-label">BrandModel</label>
                <input type="text" class="form-control" id="brandModel" />
              </div>

              <div class="col-md-3">
                <label for="profile" class="form-label">Profile</label>
                <input type="text" class="form-control" id="profile" />
              </div>

              <div class="col-md-3">
                <label for="custodian" class="form-label">Custodian</label>
                <input type="text" class="form-control" id="custodian" />
              </div>

              <div class="col-md-3">
                <label for="assetNo" class="form-label">Asset No</label>
                <input type="text" class="form-control" id="assetNo" />
              </div>

              <div class="col-md-3">
                <label for="serialNumber" class="form-label">Serial Number</label>
                <input type="text" class="form-control" id="serialNumber" />
              </div>

              <div class="col-md-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" />
              </div>

              <div class="col-md-3">
                <label for="endDate" class="form-label">End Date</label>
                <input type="date" class="form-control" id="endDate" />
              </div>

              <div class="col-md-3">
                <label for="startDate" class="form-label">Start Date</label>
                <input type="date" class="form-control" id="startDate" />
              </div>

              <div class="col-md-3">
                <label for="hostname" class="form-label">Hostname</label>
                <input type="text" class="form-control" id="hostname" />
              </div>

              <div class="col-md-3">
                <label for="ssoePoNumber" class="form-label">SSOE PO Number</label>
                <input type="text" class="form-control" id="ssoePoNumber" />
              </div>

              <div class="col-md-3">
                <label for="cartNo" class="form-label">Cart No</label>
                <input type="text" class="form-control" id="cartNo" />
              </div>

              <div class="col-md-3">
                <label for="sanitiseDate" class="form-label">Sanitise Date</label>
                <input type="date" class="form-control" id="sanitiseDate" />
              </div>

              <div class="col-md-3">
                <label for="durationInUse" class="form-label">Duration In Use</label>
                <input
                  type="text"
                  class="form-control"
                  id="durationInUse"
                  readonly
                  placeholder="Auto calculated"
                />
              </div>

              <div class="col-md-3">
                <label for="lampHour" class="form-label">Lamp Hour</label>
                <input type="number" class="form-control" id="lampHour" min="0" />
              </div>

              <div class="col-md-3 d-none">
                <label for="dateUpdated" class="form-label">Date Updated</label>
                <input type="date" class="form-control" id="dateUpdated" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="inventory.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
