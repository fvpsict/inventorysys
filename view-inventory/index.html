<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filter-equipmenttype" class="form-label fw-bold mb-0">Filter:</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all" selected>All</option>
          <option value="ssoe">SSOE</option>
          <option value="projector">Projector</option>
          <!-- Add more categories as needed -->
        </select>
      </div>
      <input
        type="search"
        id="search-inventory"
        class="form-control w-auto"
        placeholder="Search inventory..."
      />
      <button id="add-item-btn" class="btn btn-success">Add Item</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>Duration in use</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Inventory Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="inventory-form">
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="EquipmentType" class="form-label">Equipment Type *</label>
                <select id="EquipmentType" name="EquipmentType" class="form-select" required>
                  <option value="" selected disabled>Select type</option>
                  <option value="SSOE">SSOE</option>
                  <option value="Projector">Projector</option>
                  <!-- Add more options as needed -->
                </select>
              </div>
              <div class="col-md-6">
                <label for="Equipment" class="form-label">Equipment *</label>
                <input
                  type="text"
                  id="Equipment"
                  name="Equipment"
                  class="form-control"
                  placeholder="Equipment name"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="Vendor" class="form-label">Vendor</label>
                <input type="text" id="Vendor" name="Vendor" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="BrandModel" class="form-label">Brand/Model</label>
                <input type="text" id="BrandModel" name="BrandModel" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="Profile" class="form-label">Profile</label>
                <input type="text" id="Profile" name="Profile" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="Custodian" class="form-label">Custodian</label>
                <input type="text" id="Custodian" name="Custodian" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input type="text" id="AssetNo" name="AssetNo" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="SerialNumber" class="form-label">Serial Number</label>
                <input type="text" id="SerialNumber" name="SerialNumber" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="Location" class="form-label">Location</label>
                <input type="text" id="Location" name="Location" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="StartDate" class="form-label">Start Date</label>
                <input type="date" id="StartDate" name="StartDate" class="form-control" />
              </div>
              <div class="col-md-6">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  id="DateUpdated"
                  name="DateUpdated"
                  class="form-control"
                  readonly
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
