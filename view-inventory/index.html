<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5 pt-4">
    <!-- Filter and Search -->
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
      <div>
        <label for="filter-equipmenttype" class="form-label">Filter by Equipment Type</label>
        <select id="filter-equipmenttype" class="form-select">
          <option>All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Touch Panel</option>
          <option>Visualiser</option>
          <option>SMax</option>
          <option>Macbook</option>
          <option>Portable HDD</option>
          <option>TV</option>
          <option>Monitor</option>
          <option>OMR</option>
        </select>
      </div>

      <div>
        <label for="search-inventory" class="form-label">Search</label>
        <input type="text" id="search-inventory" class="form-control" placeholder="Search inventory..." />
      </div>
    </div>

    <!-- Inline Add/Edit Form (Horizontal) -->
    <form id="inventory-inline-form" class="row row-cols-lg-4 row-cols-md-3 row-cols-sm-2 g-3 mb-4 align-items-end">
      <div class="col"><label class="form-label">Equipment Type</label><select class="form-select" name="EquipmentType" required><option value="">Select</option><option>SSOE</option><option>Projector</option><option>Visualiser</option></select></div>
      <div class="col"><label class="form-label">Vendor</label><input type="text" class="form-control" name="Vendor" /></div>
      <div class="col"><label class="form-label">BrandModel</label><input type="text" class="form-control" name="BrandModel" /></div>
      <div class="col"><label class="form-label">Profile</label><input type="text" class="form-control" name="Profile" /></div>
      <div class="col"><label class="form-label">Custodian</label><input type="text" class="form-control" name="Custodian" /></div>
      <div class="col"><label class="form-label">Asset No</label><input type="text" class="form-control" name="AssetNo" required /></div>
      <div class="col"><label class="form-label">Serial Number</label><input type="text" class="form-control" name="SerialNumber" /></div>
      <div class="col"><label class="form-label">Location</label><input type="text" class="form-control" name="Location" /></div>
      <div class="col"><label class="form-label">End Date</label><input type="date" class="form-control" name="EndDate" /></div>
      <div class="col"><label class="form-label">Start Date</label><input type="date" class="form-control" name="StartDate" /></div>
      <div class="col"><label class="form-label">Hostname</label><input type="text" class="form-control" name="Hostname" /></div>
      <div class="col"><label class="form-label">SSOE PO Number</label><input type="text" class="form-control" name="SSOE PO Number" /></div>
      <div class="col"><label class="form-label">Cart No</label><input type="text" class="form-control" name="Cart No" /></div>
      <div class="col"><label class="form-label">Sanitise Date</label><input type="date" class="form-control" name="SanitiseDate" /></div>
      <div class="col"><label class="form-label">Lamp Hour</label><input type="number" class="form-control" name="Lamp Hour" /></div>
      <div class="col"><label class="form-label">Date Updated</label><input type="text" class="form-control" name="DateUpdated" readonly /></div>
      <div class="col-12 text-end mt-2">
        <button type="submit" class="btn btn-primary">Save Item</button>
      </div>
    </form>

    <!-- Inventory Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped inventory-table" id="inventory-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
