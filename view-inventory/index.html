<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
    </div>
  </nav>

  <div class="container-fluid mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Inventory</h3>
      <button class="btn btn-success" id="add-item-btn">Add Item</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th>Equipment</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Inventory Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <form id="inventory-modal-form">
          <div class="modal-header">
            <h5 class="modal-title">Add/Edit Inventory Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <!-- 1st Column -->
              <div class="col-md-3">
                <label class="form-label">Equipment Type</label>
                <input type="text" class="form-control" name="EquipmentType" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Vendor</label>
                <input type="text" class="form-control" name="Vendor">
              </div>
              <div class="col-md-3">
                <label class="form-label">Brand Model</label>
                <input type="text" class="form-control" name="BrandModel">
              </div>
              <div class="col-md-3">
                <label class="form-label">Profile</label>
                <input type="text" class="form-control" name="Profile">
              </div>

              <!-- 2nd Column -->
              <div class="col-md-3">
                <label class="form-label">Custodian</label>
                <input type="text" class="form-control" name="Custodian">
              </div>
              <div class="col-md-3">
                <label class="form-label">Asset No</label>
                <input type="text" class="form-control" name="AssetNo">
              </div>
              <div class="col-md-3">
                <label class="form-label">Serial Number</label>
                <input type="text" class="form-control" name="SerialNumber">
              </div>
              <div class="col-md-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="Location">
              </div>

              <!-- 3rd Column -->
              <div class="col-md-3">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" name="EndDate">
              </div>
              <div class="col-md-3">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" name="StartDate">
              </div>
              <div class="col-md-3">
                <label class="form-label">Hostname</label>
                <input type="text" class="form-control" name="Hostname">
              </div>
              <div class="col-md-3">
                <label class="form-label">SSOE PO Number</label>
                <input type="text" class="form-control" name="SSOE PO Number">
              </div>

              <!-- 4th Column -->
              <div class="col-md-3">
                <label class="form-label">Cart No</label>
                <input type="text" class="form-control" name="Cart No">
              </div>
              <div class="col-md-3">
                <label class="form-label">Sanitise Date</label>
                <input type="date" class="form-control" name="SanitiseDate">
              </div>
              <div class="col-md-3">
                <label class="form-label">Lamp Hour</label>
                <input type="text" class="form-control" name="Lamp Hour">
              </div>
              <div class="col-md-3">
                <label class="form-label">Equipment</label>
                <select class="form-select" name="Equipment"></select>
              </div>
            </div>
          </div>
          <div class="modal-footer mt-3">
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
