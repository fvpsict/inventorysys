<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="../view-inventory/index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-4">
    <h1 class="mb-4">Inventory</h1>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <button class="btn btn-success" id="add-item-btn">Add Item</button>
      <input type="file" id="csv-upload" accept=".csv" class="form-control" style="max-width: 300px;">
      <select class="form-select" id="category-filter" style="max-width: 250px;">
        <option value="">Filter by EquipmentType</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>Projector Screen</option>
        <option>Touch Panel</option>
        <option>Visualiser</option>
        <option>SMax</option>
        <option>Macbook</option>
        <option>Portable HDD</option>
        <option>TV</option>
        <option>Monitor</option>
        <option>OMR</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped w-100" id="inventory-table">
        <thead class="table-dark">
          <tr>
            <th>EquipmentType</th><th>Equipment Vendor</th><th>BrandModel</th><th>LampHour Profile</th>
            <th>Custodian</th><th>AssetNo</th><th>SerialNumber</th><th>Location</th>
            <th>EndDate</th><th>StartDate</th><th>Hostname</th><th>SSOE PO No</th><th>Cart No</th>
            <th>SanitiseDate</th><th>DateUpdated</th><th>DurationInUse</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Add Inventory Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="inventory-form"></form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
