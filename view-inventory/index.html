<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
      <div>
        <label for="filter-equipmenttype" class="form-label fw-bold mb-1">Filter by Equipment Type</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all" selected>All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Touch Panel</option>
          <option>Visualiser</option>
          <option>SMax</option>
          <option>Macbook</option>
          <option>Portable HDD</option>
          <option>TV</option>
          <option>Monitor</option>
          <option>OMR</option>
          <option>AV</option>
        </select>
      </div>
      <div class="flex-grow-1">
        <label for="search-inventory" class="form-label fw-bold mb-1">Search Inventory</label>
        <input type="search" id="search-inventory" class="form-control" placeholder="Search inventory..." />
      </div>
      <div>
        <button class="btn btn-success" id="add-item-btn">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped inventory-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th><th>Equipment</th><th>Vendor</th><th>BrandModel</th><th>Profile</th>
            <th>Custodian</th><th>AssetNo</th><th>SerialNumber</th><th>Location</th>
            <th>StartDate</th><th>EndDate</th><th>Duration</th><th>Hostname</th>
            <th>SSOE_PO_No</th><th>CartNo</th><th>SanitiseDate</th><th>LampHour</th><th>DateUpdated</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <form id="inventory-modal-form" class="p-3" novalidate>
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body container-fluid">
              <div class="row g-3">
                <!-- Mandatory -->
                <div class="col-md-4">
                  <label class="form-label">EquipmentType *</label>
                  <select class="form-select" name="EquipmentType" required>
                    <option value="">Select</option><option>SSOE</option><option>Projector</option><option>Projector Screen</option><option>Touch Panel</option><option>Visualiser</option><option>SMax</option><option>Macbook</option><option>Portable HDD</option><option>TV</option><option>Monitor</option><option>OMR</option><option>AV</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Equipment *</label>
                  <select class="form-select" name="Equipment" required>
                    <option value="">Select</option><option>Desktop</option><option>Laptop</option><option>iPad</option><option>Mobile Cart</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Vendor</label>
                  <input type="text" name="Vendor" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">BrandModel</label>
                  <input type="text" name="BrandModel" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Profile</label>
                  <input type="text" name="Profile" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Custodian</label>
                  <input type="text" name="Custodian" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">AssetNo *</label>
                  <input type="text" name="AssetNo" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">SerialNumber</label>
                  <input type="text" name="SerialNumber" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Location</label>
                  <input type="text" name="Location" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">StartDate</label>
                  <input type="date" name="StartDate" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">EndDate</label>
                  <input type="date" name="EndDate" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Hostname</label>
                  <input type="text" name="Hostname" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">SSOE_PO_No</label>
                  <input type="text" name="SSOE_PO_No" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">CartNo</label>
                  <input type="text" name="CartNo" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">SanitiseDate</label>
                  <input type="date" name="SanitiseDate" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">LampHour</label>
                  <input type="number" name="LampHour" class="form-control" min="0" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">DateUpdated</label>
                  <input type="text" name="DateUpdated" class="form-control" readonly />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
