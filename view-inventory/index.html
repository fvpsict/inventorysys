<!DOCTYPE html>
<html lang="en" data-category="SSOE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory - SSOE</title>
  <link href="../styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      padding-top: 70px; /* space for fixed navbar */
    }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <h1 class="mb-4">View Inventory - SSOE</h1>

    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addInventoryModal">
      Add New Inventory Item
    </button>

    <!-- Modal -->
    <div
      class="modal fade"
      id="addInventoryModal"
      tabindex="-1"
      aria-labelledby="addInventoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="inventoryForm" class="p-3">
            <div class="modal-header">
              <h5 class="modal-title" id="addInventoryModalLabel">Add Inventory Item</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-2">
                <div class="col-md-6">
                  <label class="form-label">EquipmentType</label>
                  <input class="form-control" name="EquipmentType" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Vendor</label>
                  <input class="form-control" name="Vendor" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">BrandModel</label>
                  <input class="form-control" name="BrandModel" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Profile</label>
                  <input class="form-control" name="Profile" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Custodian</label>
                  <input class="form-control" name="Custodian" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">AssetNo</label>
                  <input class="form-control" name="AssetNo" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">SerialNumber</label>
                  <input class="form-control" name="SerialNumber" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Location</label>
                  <input class="form-control" name="Location" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">EndDate</label>
                  <input type="date" class="form-control" name="EndDate" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">StartDate</label>
                  <input type="date" class="form-control" name="StartDate" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Hostname</label>
                  <input class="form-control" name="Hostname" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">SSOE PO Number</label>
                  <input class="form-control" name="SSOE PO Number" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Cart No</label>
                  <input class="form-control" name="Cart No" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">SanitiseDate</label>
                  <input type="date" class="form-control" name="SanitiseDate" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Fault</label>
                  <input class="form-control" name="Fault" />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="table-responsive">
      <table
        class="table table-bordered table-striped table-sm"
        id="inventoryTable"
      >
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Fault</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>

</body>
</html>
