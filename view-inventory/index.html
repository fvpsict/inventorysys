<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filterEquipmentType" class="form-label fw-bold mb-0">Filter by EquipmentType:</label>
        <select id="filterEquipmentType" class="form-select w-auto">
          <option value="">All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Visualiser</option>
          <option>Apple TV</option>
          <option>SMax</option>
          <option>Portable HDD</option>
          <option>Macbook</option>
          <option>TV</option>
          <option>OMR</option>
          <option>Hansvision</option>
        </select>
      </div>

      <input type="search" id="searchInventory" class="form-control w-auto" placeholder="Search Inventory..." />

      <button class="btn btn-success" id="addItemBtn" data-bs-toggle="modal" data-bs-target="#inventoryModal">
        Add Item
      </button>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Duration in Use</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <form id="inventoryForm" novalidate>
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="equipmentType" class="form-label">EquipmentType</label>
                    <select id="equipmentType" class="form-select" required>
                      <option value="">Select</option>
                      <option>SSOE</option>
                      <option>Projector</option>
                      <option>Projector Screen</option>
                      <option>Visualiser</option>
                      <option>Apple TV</option>
                      <option>SMax</option>
                      <option>Portable HDD</option>
                      <option>Macbook</option>
                      <option>TV</option>
                      <option>OMR</option>
                      <option>Hansvision</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="equipment" class="form-label">Equipment</label>
                    <select id="equipment" class="form-select">
                      <option value="">Select</option>
                      <option>Desktop</option>
                      <option>Laptop</option>
                      <option>iPad</option>
                      <option>Mobile Cart</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="vendor" class="form-label">Vendor</label>
                    <input type="text" class="form-control" id="vendor" />
                  </div>
                  <div class="col-md-6">
                    <label for="brandModel" class="form-label">BrandModel</label>
                    <input type="text" class="form-control" id="brandModel" />
                  </div>
                  <div class="col-md-6">
                    <label for="profile" class="form-label">Profile</label>
                    <input type="text" class="form-control" id="profile" />
                  </div>
                  <div class="col-md-6">
                    <label for="custodian" class="form-label">Custodian</label>
                    <input type="text" class="form-control" id="custodian" />
                  </div>
                  <div class="col-md-6">
                    <label for="assetNo" class="form-label">AssetNo</label>
                    <input type="text" class="form-control" id="assetNo" required />
                  </div>
                  <div class="col-md-6">
                    <label for="serialNumber" class="form-label">SerialNumber</label>
                    <input type="text" class="form-control" id="serialNumber" />
                  </div>
                  <div class="col-md-6">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" />
                  </div>
                  <div class="col-md-6">
                    <label for="startDate" class="form-label">StartDate</label>
                    <input type="date" class="form-control" id="startDate" />
                  </div>
                  <div class="col-md-6">
                    <label for="endDate" class="form-label">EndDate</label>
                    <input type="date" class="form-control" id="endDate" />
                  </div>
                  <div class="col-md-6">
                    <label for="hostname" class="form-label">Hostname</label>
                    <input type="text" class="form-control" id="hostname" />
                  </div>
                  <div class="col-md-6">
                    <label for="ssoePoNumber" class="form-label">SSOE PO Number</label>
                    <input type="text" class="form-control" id="ssoePoNumber" />
                  </div>
                  <div class="col-md-6">
                    <label for="cartNo" class="form-label">Cart No</label>
                    <input type="text" class="form-control" id="cartNo" />
                  </div>
                  <div class="col-md-6">
                    <label for="sanitiseDate" class="form-label">SanitiseDate</label>
                    <input type="date" class="form-control" id="sanitiseDate" />
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
