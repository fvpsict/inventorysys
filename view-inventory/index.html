<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>View Inventory</h1>
      <div class="d-flex gap-2">
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all">All Types</option>
          <option value="SSOE">SSOE</option>
          <option value="Projector">Projector</option>
          <option value="Projector Screen">Projector Screen</option>
          <option value="Visualiser">Visualiser</option>
          <option value="Apple TV">Apple TV</option>
          <option value="TV">TV</option>
          <option value="Macbook">Macbook</option>
          <option value="SMax">SMax</option>
          <option value="Portable HDD">Portable HDD</option>
          <option value="OMR">OMR</option>
          <option value="Hansvision">Hansvision</option>
        </select>
        <input type="search" id="search-inventory" class="form-control" placeholder="Search..." />
        <button id="add-item-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#inventoryModal">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Duration in Use</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <form id="inventory-form">
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add / Edit Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-md-4">
              <label class="form-label fw-bold">EquipmentType</label>
              <select name="EquipmentType" id="EquipmentType" class="form-select" required>
                <option value="">Select</option>
                <option value="SSOE">SSOE</option>
                <option value="Projector">Projector</option>
                <option value="Projector Screen">Projector Screen</option>
                <option value="Visualiser">Visualiser</option>
                <option value="Apple TV">Apple TV</option>
                <option value="TV">TV</option>
                <option value="Macbook">Macbook</option>
                <option value="SMax">SMax</option>
                <option value="Portable HDD">Portable HDD</option>
                <option value="OMR">OMR</option>
                <option value="Hansvision">Hansvision</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Equipment</label>
              <select name="Equipment" id="Equipment" class="form-select" >
                <option value="">Select</option>
                <option value="Desktop">Desktop</option>
                <option value="Laptop">Laptop</option>
                <option value="iPad">iPad</option>
                <option value="Mobile Cart">Mobile Cart</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Vendor</label>
              <input type="text" class="form-control" name="Vendor" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">BrandModel</label>
              <input type="text" class="form-control" name="BrandModel" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Profile</label>
              <input type="text" class="form-control" name="Profile" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Custodian</label>
              <input type="text" class="form-control" name="Custodian" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">AssetNo</label>
              <input type="text" class="form-control" name="AssetNo" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">SerialNumber</label>
              <input type="text" class="form-control" name="SerialNumber" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Location</label>
              <input type="text" class="form-control" name="Location" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">StartDate</label>
              <input type="date" class="form-control" name="StartDate" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">EndDate</label>
              <input type="date" class="form-control" name="EndDate" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">DateUpdated</label>
              <input type="date" class="form-control" name="DateUpdated" id="DateUpdated" readonly />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
