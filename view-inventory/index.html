<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
  <style>
    body {
      padding-top: 70px;
    }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Inventory</h1>
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addInventoryModal"
      >
        Add Inventory
      </button>
    </div>

    <div class="table-responsive">
      <table
        id="inventoryTable"
        class="table table-bordered table-striped table-hover table-sm"
      >
        <thead>
          <tr>
            <th>AssetNo</th>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Add Inventory Modal -->
  <div
    class="modal fade"
    id="addInventoryModal"
    tabindex="-1"
    aria-labelledby="addInventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <form id="inventoryForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addInventoryModalLabel">Add Inventory</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label for="assetNo" class="form-label">Asset No</label>
            <input type="text" class="form-control" id="assetNo" name="AssetNo" required />
          </div>
          <div class="col-md-6">
            <label for="equipmentType" class="form-label">Equipment Type</label>
            <input
              type="text"
              class="form-control"
              id="equipmentType"
              name="EquipmentType"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="vendor" class="form-label">Vendor</label>
            <input type="text" class="form-control" id="vendor" name="Vendor" />
          </div>
          <div class="col-md-6">
            <label for="brandModel" class="form-label">Brand/Model</label>
            <input type="text" class="form-control" id="brandModel" name="BrandModel" />
          </div>
          <div class="col-md-6">
            <label for="serialNumber" class="form-label">Serial Number</label>
            <input
              type="text"
              class="form-control"
              id="serialNumber"
              name="SerialNumber"
            />
          </div>
          <div class="col-md-6">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="Location" />
          </div>
          <div class="col-md-6">
            <label for="startDate" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="startDate" name="StartDate" />
          </div>
          <div class="col-md-6">
            <label for="endDate" class="form-label">End Date</label>
            <input type="date" class="form-control" id="endDate" name="EndDate" />
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Add Inventory</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
