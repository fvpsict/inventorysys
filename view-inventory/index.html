<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    td, th { vertical-align: middle !important; }
    .duration-cell { white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Inventory</h1>
      <button id="addRowBtn" class="btn btn-success">Add New Item</button>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tableBody = document.querySelector('#inventoryTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    let inventory = JSON.parse(localStorage.getItem('inventoryData')) || [];

    const fields = [
      'EquipmentType','Vendor','BrandModel','Profile','Custodian','AssetNo',
      'SerialNumber','Location','EndDate','StartDate','Hostname',
      'PONumber','CartNo','SanitiseDate','DurationInUse'
    ];

    function calcDuration(start) {
      if (!start) return '';
      const sd = new Date(start);
      if (isNaN(sd)) return '';
      const now = new Date();
      let yrs = now.getFullYear() - sd.getFullYear();
      let mos = now.getMonth() - sd.getMonth();
      if (mos < 0) { yrs--; mos += 12; }
      return `${yrs}y ${mos}m`;
    }

    function save() {
      localStorage.setItem('inventoryData', JSON.stringify(inventory));
    }

    function render() {
      tableBody.innerHTML = '';
      inventory.forEach((row, i) => {
        const tr = document.createElement('tr');
        fields.forEach(f => {
          const td = document.createElement('td');
          if (f === 'DurationInUse') {
            td.textContent = calcDuration(row.StartDate);
            td.className = 'duration-cell';
          } else {
            const input = document.createElement('input');
            input.className = 'form-control form-control-sm';
            input.type = f.toLowerCase().includes('date') ? 'date'
                         : 'form-control-sm';
            input.value = row[f] || '';
            input.addEventListener('change', () => {
              row[f] = input.value;
              if (f === 'StartDate') render();
              save();
            });
            td.appendChild(input);
          }
          tr.appendChild(td);
        });
        // Actions cell
        const td = document.createElement('td');
        const del = document.createElement('button');
        del.className = 'btn btn-sm btn-danger';
        del.textContent = 'Delete';
        del.onclick = () => {
          if (confirm('Delete this row?')) {
            inventory.splice(i, 1);
            save();
            render();
          }
        };
        td.appendChild(del);
        tr.appendChild(td);
        tableBody.appendChild(tr);
      });
    }

    addRowBtn.addEventListener('click', () => {
      const newRow = {};
      fields.forEach(f => newRow[f] = '');
      inventory.push(newRow);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
