<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div
        class="collapse navbar-collapse"
        id="navbarNav"
      >
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report/fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../patching-report/patching-report.html">Patching Report</a>
          </li>
          <!-- Add more nav links here -->
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 pt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <label for="filter-equipmenttype" class="form-label me-2 fw-bold">Filter by Equipment:</label>
        <select id="filter-equipmenttype" class="form-select d-inline-block w-auto">
          <option value="all">All</option>
          <option value="Desktop">Desktop</option>
          <option value="Laptop">Laptop</option>
          <option value="iPad">iPad</option>
          <option value="Mobile Cart">Mobile Cart</option>
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input
          type="search"
          id="search-inventory"
          class="form-control"
          placeholder="Search inventory..."
          style="min-width: 200px"
        />
        <button id="add-item-btn" class="btn btn-success">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table
        class="table table-bordered table-striped"
        id="inventory-table"
      >
        <thead class="table-primary">
          <tr>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>Brand/Model</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>Asset No</th>
            <th>Serial No</th>
            <th>Location</th>
            <th>Start Date</th>
            <th>Duration in use</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Inventory rows will be injected here by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="Equipment" class="form-label">Equipment *</label>
                <select
                  id="Equipment"
                  name="Equipment"
                  class="form-select"
                  required
                >
                  <option value="">Select Equipment</option>
                  <option value="Desktop">Desktop</option>
                  <option value="Laptop">Laptop</option>
                  <option value="iPad">iPad</option>
                  <option value="Mobile Cart">Mobile Cart</option>
                </select>
                <div class="invalid-feedback">Please select equipment.</div>
              </div>
              <div class="col-md-6">
                <label for="Vendor" class="form-label">Vendor</label>
                <input
                  type="text"
                  id="Vendor"
                  name="Vendor"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="BrandModel" class="form-label">Brand/Model</label>
                <input
                  type="text"
                  id="BrandModel"
                  name="BrandModel"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="Profile" class="form-label">Profile</label>
                <input
                  type="text"
                  id="Profile"
                  name="Profile"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="Custodian" class="form-label">Custodian</label>
                <input
                  type="text"
                  id="Custodian"
                  name="Custodian"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="AssetNo" class="form-label">Asset No</label>
                <input
                  type="text"
                  id="AssetNo"
                  name="AssetNo"
                  class="form-control"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-6">
                <label for="SerialNumber" class="form-label">Serial No</label>
                <input
                  type="text"
                  id="SerialNumber"
                  name="SerialNumber"
                  class="form-control"
                  placeholder="Optional"
                />
              </div>
              <div class="col-md-6">
                <label for="Location" class="form-label">Location</label>
                <input
                  type="text"
                  id="Location"
                  name="Location"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="StartDate" class="form-label">Start Date</label>
                <input
                  type="date"
                  id="StartDate"
                  name="StartDate"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="DateUpdated" class="form-label">Date Updated</label>
                <input
                  type="text"
                  id="DateUpdated"
                  name="DateUpdated"
                  class="form-control"
                  readonly
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle (Popper.js included) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
