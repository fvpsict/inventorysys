<!-- Add Item Modal -->
<div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="add-item-form" novalidate>
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="addItemModalLabel">Add Inventory Item</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="newEquipmentType" class="form-label">Equipment Type</label>
              <select id="newEquipmentType" name="EquipmentType" class="form-select" required>
                <option value="">Select Equipment Type</option>
                <option>SSOE</option>
                <option>Projector</option>
                <option>TV</option>
                <option>Visualiser</option>
                <option>Projector Screen</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="newEquipment" class="form-label">Equipment</label>
              <select id="newEquipment" name="Equipment" class="form-select" required>
                <option value="">Select Equipment</option>
                <option>Desktop</option>
                <option>Laptop</option>
                <option>iPad</option>
                <option>Mobile Cart</option>
              </select>
            </div>
            <div class="col-md-6"><label for="newVendor" class="form-label">Vendor</label><input type="text" id="newVendor" name="Vendor" class="form-control" /></div>
            <div class="col-md-6"><label for="newBrandModel" class="form-label">BrandModel</label><input type="text" id="newBrandModel" name="BrandModel" class="form-control" /></div>
            <div class="col-md-6"><label for="newProfile" class="form-label">Profile</label><input type="text" id="newProfile" name="Profile" class="form-control" /></div>
            <div class="col-md-6"><label for="newCustodian" class="form-label">Custodian</label><input type="text" id="newCustodian" name="Custodian" class="form-control" /></div>
            <div class="col-md-6"><label for="newAssetNo" class="form-label">AssetNo</label><input type="text" id="newAssetNo" name="AssetNo" class="form-control" required /></div>
            <div class="col-md-6"><label for="newSerialNumber" class="form-label">SerialNumber</label><input type="text" id="newSerialNumber" name="SerialNumber" class="form-control" /></div>
            <div class="col-md-6"><label for="newLocation" class="form-label">Location</label><input type="text" id="newLocation" name="Location" class="form-control" /></div>
            <div class="col-md-6"><label for="newEndDate" class="form-label">EndDate</label><input type="date" id="newEndDate" name="EndDate" class="form-control" /></div>
            <div class="col-md-6"><label for="newStartDate" class="form-label">StartDate</label><input type="date" id="newStartDate" name="StartDate" class="form-control" /></div>
            <div class="col-md-6"><label for="newHostname" class="form-label">Hostname</label><input type="text" id="newHostname" name="Hostname" class="form-control" /></div>
            <div class="col-md-6"><label for="newSSOEPO" class="form-label">SSOE PO Number</label><input type="text" id="newSSOEPO" name="SSOE PO Number" class="form-control" /></div>
            <div class="col-md-6"><label for="newCartNo" class="form-label">Cart No</label><input type="text" id="newCartNo" name="Cart No" class="form-control" /></div>
            <div class="col-md-6"><label for="newSanitiseDate" class="form-label">SanitiseDate</label><input type="date" id="newSanitiseDate" name="SanitiseDate" class="form-control" /></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Add Item</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
