<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="index.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container inventory-container">
    <h1>Inventory</h1>

    <div class="d-flex flex-wrap align-items-center mb-3 gap-3">
      <select id="filter-equipmenttype" class="form-select" style="max-width: 320px;">
        <option value="All">All Equipment Types</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>Projector Screen</option>
        <option>Touch Panel</option>
        <option>Visualiser</option>
        <option>SMax</option>
        <option>Macbook</option>
        <option>Portable HDD</option>
        <option>TV</option>
        <option>Monitor</option>
        <option>OMR</option>
      </select>

      <button id="add-item-btn" class="btn btn-primary">Add Inventory Item</button>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="inventory-table table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="inventoryModal"
      tabindex="-1"
      aria-labelledby="inventoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Inventory Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="inventory-form"></form>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="inventory.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
