<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4">Inventory Management</h1>
    <button id="add-item-btn" class="btn btn-success">Add Item</button>
  </div>

  <div class="table-responsive">
    <table id="inventory-table" class="table table-bordered table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>EquipmentType</th>
          <th>Vendor</th>
          <th>BrandModel</th>
          <th>Profile</th>
          <th>Custodian</th>
          <th>AssetNo</th>
          <th>SerialNumber</th>
          <th>Location</th>
          <th>EndDate</th>
          <th>StartDate</th>
          <th>Hostname</th>
          <th>SSOE PO Number</th>
          <th>Cart No</th>
          <th>SanitiseDate</th>
          <th>Duration in use</th>
          <th>Lamp Hour</th>
          <th>DateUpdated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows populated by JS -->
      </tbody>
    </table>
  </div>

  <!-- Bootstrap Modal for Add/Edit Form -->
  <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Inventory Form</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="inventory-form"></form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
