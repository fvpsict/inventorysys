<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Inventory System</a>
      <!-- You can add navigation links here if needed -->
    </div>
  </nav>

  <!-- Main container -->
  <div class="container inventory-container mt-4">
    <h1 class="mb-4">Inventory Management</h1>

    <!-- Filters and Add button -->
    <div class="d-flex flex-wrap align-items-end gap-3 mb-3">
      <div class="flex-grow-0" style="max-width: 320px;">
        <label for="filter-equipmenttype" class="form-label fw-semibold">Filter by Equipment Type</label>
        <select id="filter-equipmenttype" class="form-select">
          <option value="All" selected>All</option>
          <option value="SSOE">SSOE</option>
          <option value="Projector">Projector</option>
          <option value="Projector Screen">Projector Screen</option>
          <option value="Patch Panel">Patch Panel</option>
          <option value="Macbook">Macbook</option>
          <option value="Speaker">Speaker</option>
          <option value="Apple TV">Apple TV</option>
          <option value="SMax">SMax</option>
          <option value="Portable HDD">Portable HDD</option>
          <option value="TV">TV</option>
          <option value="OMR">OMR</option>
          <option value="Hansvision">Hansvision</option>
        </select>
      </div>

      <div class="flex-grow-1">
        <label for="search-inventory" class="form-label fw-semibold">Search Inventory</label>
        <input type="search" id="search-inventory" class="form-control" placeholder="Search by any field..." />
      </div>

      <div class="flex-grow-0 d-flex align-items-end">
        <button id="add-item-btn" class="btn btn-primary">Add Item</button>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="table-responsive">
      <table id="inventory-table" class="table inventory-table table-striped table-bordered">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows dynamically inserted by inventory.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Inventory Modal -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Inventory Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Form fields dynamically generated by inventory.js -->
          </div>
          <div class="modal-footer">
            <!-- Buttons dynamically generated by inventory.js -->
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (Popper included) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Inventory JS -->
  <script src="inventory.js"></script>
</body>
</html>
