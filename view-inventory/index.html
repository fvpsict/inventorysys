<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    .table-responsive { max-height: 60vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Inventory</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#inventoryModal">
        Add Inventory
      </button>
    </div>

    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>AssetNo</th>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="inventoryForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Inventory</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label class="form-label">AssetNo</label>
            <input name="AssetNo" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">EquipmentType</label>
            <input name="EquipmentType" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Vendor</label>
            <input name="Vendor" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">BrandModel</label>
            <input name="BrandModel" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">SerialNumber</label>
            <input name="SerialNumber" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Location</label>
            <input name="Location" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">StartDate</label>
            <input type="date" name="StartDate" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">EndDate</label>
            <input type="date" name="EndDate" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button id="deleteInvBtn" type="button" class="btn btn-danger me-auto" style="display:none;">
            Delete
          </button>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('inventoryForm');
      const tbody = document.querySelector('#inventoryTable tbody');
      const modal = new bootstrap.Modal(document.getElementById('inventoryModal'));
      const deleteBtn = document.getElementById('deleteInvBtn');
      let data = JSON.parse(localStorage.getItem('inventory')) || [];
      let editIdx = null;

      function render() {
        tbody.innerHTML = '';
        data.forEach((item,i) => {
          const tr=document.createElement('tr');
          tr.innerHTML=`
            <td>${item.AssetNo||''}</td>
            <td>${item.EquipmentType||''}</td>
            <td>${item.Vendor||''}</td>
            <td>${item.BrandModel||''}</td>
            <td>${item.SerialNumber||''}</td>
            <td>${item.Location||''}</td>
            <td>${item.StartDate||''}</td>
            <td>${item.EndDate||''}</td>
            <td>
              <button class="btn btn-sm btn-primary edit-btn" data-i="${i}">Edit</button>
              <button class="btn btn-sm btn-danger del-btn" data-i="${i}">Del</button>
            </td>`;
          tbody.appendChild(tr);
        });
      }

      function clearForm() { form.reset(); editIdx=null; deleteBtn.style.display='none'; }
      function fillForm(it) { Object.keys(it).forEach(k=>form.elements[k].value=it[k]); }

      document.querySelector('button[data-bs-target="#inventoryModal"]').addEventListener('click', () => {
        clearForm(); modal.show();
      });

      tbody.addEventListener('click', e => {
        const btn=e.target, i=btn.dataset.i;
        if(btn.classList.contains('edit-btn')) {
          editIdx=i; fillForm(data[i]);
          deleteBtn.style.display='inline-block'; modal.show();
        }
        if(btn.classList.contains('del-btn') && confirm('Delete?')) {
          data.splice(i,1); localStorage.setItem('inventory',JSON.stringify(data)); render();
        }
      });

      deleteBtn.addEventListener('click', () => {
        if(editIdx!==null && confirm('Delete?')) {
          data.splice(editIdx,1);
          localStorage.setItem('inventory',JSON.stringify(data));
          render(); modal.hide(); clearForm();
        }
      });

      form.addEventListener('submit', e => {
        e.preventDefault();
        const obj={};
        ['AssetNo','EquipmentType','Vendor','BrandModel','SerialNumber','Location','StartDate','EndDate']
          .forEach(k=>obj[k]=form.elements[k].value);
        if(editIdx===null) data.push(obj);
        else data[editIdx]=obj;
        localStorage.setItem('inventory',JSON.stringify(data));
        render(); modal.hide(); clearForm();
      });

      render();
    });
  </script>
</body>
</html>
