<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">
        <label for="filter-equipmenttype" class="form-label fw-bold">Filter by Type:</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all">All</option>
          <option value="SSOE">SSOE</option>
          <option value="Projector">Projector</option>
          <option value="Projector Screen">Projector Screen</option>
          <option value="Visualiser">Visualiser</option>
          <option value="Apple TV">Apple TV</option>
          <option value="SMax">SMax</option>
          <option value="Portable HDD">Portable HDD</option>
          <option value="Macbook">Macbook</option>
          <option value="TV">TV</option>
          <option value="OMR">OMR</option>
          <option value="Hansvision">Hansvision</option>
        </select>
      </div>

      <input type="text" id="search-inventory" class="form-control" placeholder="Search inventory..." />
      <button class="btn btn-success" id="add-item-btn">Add Item</button>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Duration in use</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Inventory Modal -->
  <div class="modal fade" id="inventoryModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <form id="inventory-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Equipment Type</label>
              <select class="form-select" name="EquipmentType" id="EquipmentType" required>
                <option value="">Select Type</option>
                <option>SSOE</option>
                <option>Projector</option>
                <option>Projector Screen</option>
                <option>Visualiser</option>
                <option>Apple TV</option>
                <option>SMax</option>
                <option>Portable HDD</option>
                <option>Macbook</option>
                <option>TV</option>
                <option>OMR</option>
                <option>Hansvision</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Equipment</label>
              <select class="form-select" name="Equipment" id="Equipment">
                <option value="">Select Equipment</option>
                <option>Desktop</option>
                <option>Laptop</option>
                <option>iPad</option>
                <option>Mobile Cart</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Vendor</label>
              <input type="text" class="form-control" name="Vendor" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Brand/Model</label>
              <input type="text" class="form-control" name="BrandModel" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Profile</label>
              <input type="text" class="form-control" name="Profile" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Custodian</label>
              <input type="text" class="form-control" name="Custodian" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Asset No</label>
              <input type="text" class="form-control" name="AssetNo" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Serial Number</label>
              <input type="text" class="form-control" name="SerialNumber" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" name="Location" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" name="StartDate" />
            </div>
            <div class="col-md-4">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control" name="EndDate" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Date Updated</label>
              <input type="text" class="form-control" name="DateUpdated" id="DateUpdated" readonly />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
