<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html" rel="noopener noreferrer">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html" aria-current="page">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h1>Inventory</h1>
      <button id="add-item-btn" class="btn btn-success">Add Item</button>
      <input type="text" id="search-inventory" class="form-control w-auto" placeholder="Search inventory..." />
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped inventory-table" id="inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Duration In Use</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="inventory-form" novalidate>
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="inventoryModalLabel">Add/Edit Inventory Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="equipmentType" class="form-label fw-bold">Equipment Type</label>
                  <select id="equipmentType" name="equipmentType" class="form-select" required>
                    <option value="" disabled selected>Select Equipment Type</option>
                    <option>SSOE</option>
                    <option>Projector</option>
                    <option>Projector Screen</option>
                    <option>Patch Panel</option>
                    <option>Macbook</option>
                    <option>Speaker</option>
                    <option>Apple TV</option>
                    <option>SMax</option>
                    <option>Portable HDD</option>
                    <option>TV</option>
                    <option>OMR</option>
                    <option>Hansvision</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="vendor" class="form-label fw-bold">Vendor</label>
                  <input type="text" id="vendor" name="vendor" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label for="brandModel" class="form-label fw-bold">Brand / Model</label>
                  <input type="text" id="brandModel" name="brandModel" class="form-control" required />
                </div>

                <div class="col-md-4">
                  <label for="profile" class="form-label fw-bold">Profile</label>
                  <input type="text" id="profile" name="profile" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label for="custodian" class="form-label fw-bold">Custodian</label>
                  <input type="text" id="custodian" name="custodian" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label for="assetNo" class="form-label fw-bold">Asset No</label>
                  <input type="text" id="assetNo" name="assetNo" class="form-control" required />
                </div>

                <div class="col-md-4">
                  <label for="serialNumber" class="form-label fw-bold">Serial Number</label>
                  <input type="text" id="serialNumber" name="serialNumber" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label for="location" class="form-label fw-bold">Location</label>
                  <input type="text" id="location" name="location" class="form-control" />
                </div>

                <div class="col-md-4">
                  <label for="startDate" class="form-label fw-bold">Start Date</label>
                  <input type="date" id="startDate" name="startDate" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label for="endDate" class="form-label fw-bold">End Date</label>
                  <input type="date" id="endDate" name="endDate" class="form-control" />
                  <div class="form-text">Leave blank if still in use</div>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Duration In Use</label>
                  <input type="text" id="durationInUse" class="form-control" readonly />
                </div>

              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" id="save-item-btn" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
