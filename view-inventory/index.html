<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="#">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">
        <label class="form-label fw-bold">Filter:</label>
        <select id="category-filter" class="form-select w-auto">
          <option value="">All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Visualiser</option>
          <option>Apple TV</option>
          <option>SMax</option>
          <option>Portable HDD</option>
          <option>Macbook</option>
          <option>TV</option>
          <option>OMR</option>
          <option>Hansvision</option>
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input type="search" id="search-inventory" class="form-control" placeholder="Search..." />
        <button class="btn btn-success" id="add-item-btn">Add Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in Use</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add/Edit Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="itemForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">EquipmentType</label>
                <select class="form-select" id="EquipmentType" name="EquipmentType" required>
                  <option value="">Select</option>
                  <option>SSOE</option>
                  <option>Projector</option>
                  <option>Projector Screen</option>
                  <option>Visualiser</option>
                  <option>Apple TV</option>
                  <option>SMax</option>
                  <option>Portable HDD</option>
                  <option>Macbook</option>
                  <option>TV</option>
                  <option>OMR</option>
                  <option>Hansvision</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Equipment</label>
                <select class="form-select" id="Equipment" name="Equipment">
                  <option value="">Select</option>
                  <option>Desktop</option>
                  <option>Laptop</option>
                  <option>iPad</option>
                  <option>Mobile Cart</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Vendor</label>
                <input type="text" class="form-control" name="Vendor" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">BrandModel</label>
                <input type="text" class="form-control" name="BrandModel" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Profile</label>
                <input type="text" class="form-control" name="Profile" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Custodian</label>
                <input type="text" class="form-control" name="Custodian" />
              </div>
              <div class="col-md-4">
                <label class="form-label">AssetNo</label>
                <input type="text" class="form-control" name="AssetNo" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">SerialNumber</label>
                <input type="text" class="form-control" name="SerialNumber" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="Location" />
              </div>
              <div class="col-md-4">
                <label class="form-label">StartDate</label>
                <input type="date" class="form-control" name="StartDate" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">EndDate</label>
                <input type="date" class="form-control" name="EndDate" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Hostname</label>
                <input type="text" class="form-control" name="Hostname" />
              </div>
              <div class="col-md-4">
                <label class="form-label">SSOE PO Number</label>
                <input type="text" class="form-control" name="SSOE PO Number" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Cart No</label>
                <input type="text" class="form-control" name="Cart No" />
              </div>
              <div class="col-md-4">
                <label class="form-label">SanitiseDate</label>
                <input type="date" class="form-control" name="SanitiseDate" />
              </div>
            </div>
            <input type="hidden" name="Duration in Use" />
          </form>
        </div>
        <div class="modal-footer">
          <button type="submit" form="itemForm" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</body>
</html>
