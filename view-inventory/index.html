<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom styles -->
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div class="container my-4">
    <div class="page-header d-flex align-items-center mb-3">
      <h1 class="me-auto">Inventory Management</h1>
      <button class="btn btn-success" id="add-item-btn">Add Item</button>
    </div>

    <div class="filters d-flex align-items-center mb-3">
      <label for="filter-category" class="mb-0 me-2 fw-semibold">Filter Category:</label>
      <select id="filter-category" class="form-select" style="width: 220px;">
        <option value="All" selected>All</option>
        <option value="SSOE">SSOE</option>
        <option value="Projector">Projector</option>
        <option value="Projector Screen">Projector Screen</option>
        <option value="Patch Panel">Patch Panel</option>
        <option value="Macbook">Macbook</option>
        <option value="Speaker">Speaker</option>
        <option value="Apple TV">Apple TV</option>
        <option value="SMax">SMax</option>
        <option value="Portable HDD">Portable HDD</option>
        <option value="TV">TV</option>
        <option value="OMR">OMR</option>
        <option value="Hansvision">Hansvision</option>
      </select>

      <input
        type="search"
        id="search-inventory"
        class="form-control ms-auto"
        placeholder="Search inventory..."
        style="max-width: 300px;"
      />
    </div>

    <div class="table-responsive">
      <table
        id="inventory-table"
        class="table table-bordered table-striped inventory-table"
      >
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in use</th>
            <th>Lamp Hour</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal for Add/Edit -->
  <div
    class="modal fade"
    id="inventoryModal"
    tabindex="-1"
    aria-labelledby="inventoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="inventory-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="inventoryModalLabel">Add Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">

              <div class="col-md-4">
                <label for="equipmentType" class="form-label fw-semibold"
                  >Equipment Type <span class="text-danger">*</span></label
                >
                <select
                  id="equipmentType"
                  name="equipmentType"
                  class="form-select"
                  required
                >
                  <option value="" disabled selected>Select category</option>
                  <option value="SSOE">SSOE</option>
                  <option value="Projector">Projector</option>
                  <option value="Projector Screen">Projector Screen</option>
                  <option value="Patch Panel">Patch Panel</option>
                  <option value="Macbook">Macbook</option>
                  <option value="Speaker">Speaker</option>
                  <option value="Apple TV">Apple TV</option>
                  <option value="SMax">SMax</option>
                  <option value="Portable HDD">Portable HDD</option>
                  <option value="TV">TV</option>
                  <option value="OMR">OMR</option>
                  <option value="Hansvision">Hansvision</option>
                </select>
                <div class="invalid-feedback">Please select Equipment Type.</div>
              </div>

              <div class="col-md-4">
                <label for="vendor" class="form-label fw-semibold">Vendor</label>
                <input
                  type="text"
                  id="vendor"
                  name="vendor"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4">
                <label for="brandModel" class="form-label fw-semibold"
                  >Brand Model</label
                >
                <input
                  type="text"
                  id="brandModel"
                  name="brandModel"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4">
                <label for="profile" class="form-label fw-semibold">Profile</label>
                <input
                  type="text"
                  id="profile"
                  name="profile"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4">
                <label for="custodian" class="form-label fw-semibold">Custodian</label>
                <input
                  type="text"
                  id="custodian"
                  name="custodian"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4">
                <label for="assetNo" class="form-label fw-semibold"
                  >Asset No <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="assetNo"
                  name="assetNo"
                  class="form-control"
                  maxlength="50"
                  required
                />
                <div class="invalid-feedback">Asset No is required.</div>
              </div>

              <div class="col-md-4">
                <label for="serialNumber" class="form-label fw-semibold"
                  >Serial Number</label
                >
                <input
                  type="text"
                  id="serialNumber"
                  name="serialNumber"
                  class="form-control"
                  maxlength="50"
                />
              </div>

              <div class="col-md-4">
                <label for="location" class="form-label fw-semibold">Location</label>
                <input
                  type="text"
                  id="location"
                  name="location"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4">
                <label for="endDate" class="form-label fw-semibold">End Date</label>
                <input
                  type="date"
                  id="endDate"
                  name="endDate"
                  class="form-control"
                />
              </div>

              <div class="col-md-4">
                <label for="startDate" class="form-label fw-semibold">Start Date</label>
                <input
                  type="date"
                  id="startDate"
                  name="startDate"
                  class="form-control"
                />
              </div>

              <div class="col-md-4">
                <label for="hostname" class="form-label fw-semibold">Hostname</label>
                <input
                  type="text"
                  id="hostname"
                  name="hostname"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4 ssoe-only">
                <label for="ssoePoNumber" class="form-label fw-semibold"
                  >SSOE PO Number</label
                >
                <input
                  type="text"
                  id="ssoePoNumber"
                  name="ssoePoNumber"
                  class="form-control"
                  maxlength="100"
                />
              </div>

              <div class="col-md-4 ssoe-only">
                <label for="cartNo" class="form-label fw-semibold">Cart No</label>
                <input
                  type="text"
                  id="cartNo"
                  name="cartNo"
                  class="form-control"
                  maxlength="50"
                />
              </div>

              <div class="col-md-4 ssoe-only">
                <label for="sanitiseDate" class="form-label fw-semibold"
                  >Sanitise Date</label
                >
                <input
                  type="date"
                  id="sanitiseDate"
                  name="sanitiseDate"
                  class="form-control"
                />
              </div>

              <div class="col-md-4">
                <label for="durationInUse" class="form-label fw-semibold"
                  >Duration in use</label
                >
                <input
                  type="text"
                  id="durationInUse"
                  name="durationInUse"
                  class="form-control"
                  readonly
                />
              </div>

              <div class="col-md-4">
                <label for="lampHour" class="form-label fw-semibold">Lamp Hour</label>
                <input
                  type="number"
                  id="lampHour"
                  name="lampHour"
                  class="form-control"
                  min="0"
                />
              </div>

              <div class="col-md-4">
                <label for="dateUpdated" class="form-label fw-semibold"
                  >Date Updated</label
                >
                <input
                  type="text"
                  id="dateUpdated"
                  name="dateUpdated"
                  class="form-control"
                  readonly
                />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="save-btn">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle (Popper + Bootstrap) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Inventory JS -->
  <script src="inventory.js"></script>
</body>
</html>
