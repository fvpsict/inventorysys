<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
    </div>
  </nav>

  <main class="container mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <select id="filter-equipmenttype" class="form-select w-auto">
        <option value="all" selected>All</option>
        <option>SSOE</option>
        <option>Projector</option>
        <option>Projector Screen</option>
        <option>Touch Panel</option>
        <option>Visualiser</option>
        <option>SMax</option>
        <option>Macbook</option>
        <option>Portable HDD</option>
        <option>TV</option>
        <option>Monitor</option>
        <option>OMR</option>
        <option>AV</option>
      </select>

      <input type="text" id="search-inventory" placeholder="Search..." class="form-control w-auto" />

      <button id="add-item-btn" class="btn btn-success">Add Item</button>
    </div>

    <div class="table-responsive">
      <table id="inventory-table" class="table table-bordered table-striped">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>EndDate</th>
            <th>StartDate</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Duration in Use</th>
            <th>Date Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- JS-generated rows -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="inventory.js"></script>
</body>
</html>
