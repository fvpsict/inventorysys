<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FVPS Inventory System - View Inventory</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* Additional quick styles */
    .modal-dialog {
      max-width: 900px;
    }
    .modal-body .row > div {
      margin-bottom: 1rem;
    }
    /* Horizontal form in modal */
    @media(min-width: 576px) {
      .modal-body .form-label {
        text-align: right;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">View Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="../fault-report.html">Fault Report</a></li>
          <li class="nav-item"><a class="nav-link" href="../patching/patching-report.html">Patching Report</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filterEquipmentType" class="form-label fw-bold mb-0">Filter by EquipmentType:</label>
        <select id="filterEquipmentType" class="form-select w-auto">
          <option value="">All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Visualiser</option>
          <option>Apple TV</option>
          <option>SMax</option>
          <option>Portable HDD</option>
          <option>Macbook</option>
          <option>TV</option>
          <option>OMR</option>
          <option>Hansvision</option>
        </select>
      </div>

      <input
        type="search"
        id="searchInventory"
        class="form-control w-auto"
        placeholder="Search Inventory..."
        aria-label="Search Inventory"
      />

      <button
        class="btn btn-success"
        id="addItemBtn"
        data-bs-toggle="modal"
        data-bs-target="#inventoryModal"
      >
        Add Item
      </button>
    </div>

    <div class="table-responsive">
      <table
        id="inventoryTable"
        class="table table-bordered table-striped"
      >
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>EndDate</th>
            <th>Duration in Use</th>
            <th>Hostname</th>
            <th>SSOE PO Number</th>
            <th>Cart No</th>
            <th>SanitiseDate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Inventory rows populated by JS -->
        </tbody>
      </table>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="inventoryModal"
      tabindex="-1"
      aria-labelledby="inventoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form id="inventoryForm" novalidate>
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row gy-2">
                  <!-- EquipmentType -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="equipmentType" class="form-label fw-bold mb-0 me-2 w-50 text-end">EquipmentType</label>
                    <select id="equipmentType" class="form-select w-50" required>
                      <option value="">Select EquipmentType</option>
                      <option>SSOE</option>
                      <option>Projector</option>
                      <option>Projector Screen</option>
                      <option>Visualiser</option>
                      <option>Apple TV</option>
                      <option>SMax</option>
                      <option>Portable HDD</option>
                      <option>Macbook</option>
                      <option>TV</option>
                      <option>OMR</option>
                      <option>Hansvision</option>
                    </select>
                  </div>

                  <!-- Equipment (only shown if EquipmentType == SSOE) -->
                  <div
                    class="col-md-4 d-flex align-items-center"
                    id="equipmentContainer"
                    style="display:none"
                  >
                    <label for="equipment" class="form-label fw-bold mb-0 me-2 w-50 text-end">Equipment</label>
                    <select id="equipment" class="form-select w-50">
                      <option value="">Select Equipment</option>
                      <option>Desktop</option>
                      <option>Laptop</option>
                      <option>iPad</option>
                      <option>Mobile Cart</option>
                    </select>
                  </div>

                  <!-- Vendor -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="vendor" class="form-label fw-bold mb-0 me-2 w-50 text-end">Vendor</label>
                    <input type="text" id="vendor" class="form-control w-50" required />
                  </div>

                  <!-- BrandModel -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="brandModel" class="form-label fw-bold mb-0 me-2 w-50 text-end">BrandModel</label>
                    <input type="text" id="brandModel" class="form-control w-50" required />
                  </div>

                  <!-- Profile -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="profile" class="form-label fw-bold mb-0 me-2 w-50 text-end">Profile</label>
                    <input type="text" id="profile" class="form-control w-50" />
                  </div>

                  <!-- Custodian -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="custodian" class="form-label fw-bold mb-0 me-2 w-50 text-end">Custodian</label>
                    <input type="text" id="custodian" class="form-control w-50" />
                  </div>

                  <!-- AssetNo -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="assetNo" class="form-label fw-bold mb-0 me-2 w-50 text-end">AssetNo</label>
                    <input type="text" id="assetNo" class="form-control w-50" required />
                  </div>

                  <!-- SerialNumber -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="serialNumber" class="form-label fw-bold mb-0 me-2 w-50 text-end">SerialNumber</label>
                    <input type="text" id="serialNumber" class="form-control w-50" />
                  </div>

                  <!-- Location -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="location" class="form-label fw-bold mb-0 me-2 w-50 text-end">Location</label>
                    <input type="text" id="location" class="form-control w-50" />
                  </div>

                  <!-- StartDate -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="startDate" class="form-label fw-bold mb-0 me-2 w-50 text-end">StartDate</label>
                    <input type="date" id="startDate" class="form-control w-50" />
                  </div>

                  <!-- EndDate -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="endDate" class="form-label fw-bold mb-0 me-2 w-50 text-end">EndDate</label>
                    <input type="date" id="endDate" class="form-control w-50" />
                  </div>

                  <!-- Hostname -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="hostname" class="form-label fw-bold mb-0 me-2 w-50 text-end">Hostname</label>
                    <input type="text" id="hostname" class="form-control w-50" />
                  </div>

                  <!-- SSOE PO Number -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="ssoePoNumber" class="form-label fw-bold mb-0 me-2 w-50 text-end">SSOE PO Number</label>
                    <input type="text" id="ssoePoNumber" class="form-control w-50" />
                  </div>

                  <!-- Cart No -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="cartNo" class="form-label fw-bold mb-0 me-2 w-50 text-end">Cart No</label>
                    <input type="text" id="cartNo" class="form-control w-50" />
                  </div>

                  <!-- SanitiseDate -->
                  <div class="col-md-4 d-flex align-items-center">
                    <label for="sanitiseDate" class="form-label fw-bold mb-0 me-2 w-50 text-end">SanitiseDate</label>
                    <input type="date" id="sanitiseDate" class="form-control w-50" />
                  </div>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
  <script>
    // Show/hide equipment dropdown depending on EquipmentType selection
    const equipmentTypeSelect = document.getElementById('equipmentType');
    const equipmentContainer = document.getElementById('equipmentContainer');
    const equipmentSelect = document.getElementById('equipment');

    equipmentTypeSelect.addEventListener('change', () => {
      if (equipmentTypeSelect.value === 'SSOE') {
        equipmentContainer.style.display = 'flex';
        equipmentSelect.setAttribute('required', 'required');
      } else {
        equipmentContainer.style.display = 'none';
        equipmentSelect.removeAttribute('required');
        equipmentSelect.value = '';
      }
    });
  </script>
</body>
</html>
