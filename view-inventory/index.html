<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory - FVPS Inventory System</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="../styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="index.html">View Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../fault-report.html">Fault Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../patching/patching-report.html">Patching Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-3">
    <h1>Inventory Management</h1>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <label for="filter-equipmenttype" class="form-label fw-bold me-2">Filter by Equipment Type:</label>
        <select id="filter-equipmenttype" class="form-select w-auto">
          <option value="all">All</option>
          <option>SSOE</option>
          <option>Projector</option>
          <option>Projector Screen</option>
          <option>Visualiser</option>
          <option>Apple TV</option>
          <option>SMax</option>
          <option>Portable HDD</option>
          <option>Macbook</option>
          <option>TV</option>
          <option>OMR</option>
          <option>Hansvision</option>
        </select>
      </div>

      <input
        type="search"
        id="search-inventory"
        class="form-control"
        placeholder="Search inventory..."
        style="min-width: 200px; max-width: 300px;"
      />

      <button id="add-item-btn" class="btn btn-success">Add Item</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="inventory-table">
        <thead>
          <tr>
            <th>EquipmentType</th>
            <th>Equipment</th>
            <th>Vendor</th>
            <th>BrandModel</th>
            <th>Profile</th>
            <th>Custodian</th>
            <th>AssetNo</th>
            <th>SerialNumber</th>
            <th>Location</th>
            <th>StartDate</th>
            <th>Duration in use</th>
            <th>DateUpdated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- dynamically filled -->
        </tbody>
      </table>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="inventoryModal"
      tabindex="-1"
      aria-labelledby="inventoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="inventory-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="inventoryModalLabel">Add Inventory Item</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="EquipmentType" class="form-label fw-bold">Equipment Type *</label>
                  <select id="EquipmentType" name="EquipmentType" class="form-select" required>
                    <option value="">Select...</option>
                    <option>SSOE</option>
                    <option>Projector</option>
                    <option>Projector Screen</option>
                    <option>Visualiser</option>
                    <option>Apple TV</option>
                    <option>SMax</option>
                    <option>Portable HDD</option>
                    <option>Macbook</option>
                    <option>TV</option>
                    <option>OMR</option>
                    <option>Hansvision</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="Equipment" class="form-label fw-bold">Equipment *</label>
                  <input
                    type="text"
                    id="Equipment"
                    name="Equipment"
                    class="form-control"
                    placeholder="Enter Equipment"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="Vendor" class="form-label fw-bold">Vendor</label>
                  <input type="text" id="Vendor" name="Vendor" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="BrandModel" class="form-label fw-bold">Brand/Model</label>
                  <input type="text" id="BrandModel" name="BrandModel" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="Profile" class="form-label fw-bold">Profile</label>
                  <input type="text" id="Profile" name="Profile" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="Custodian" class="form-label fw-bold">Custodian</label>
                  <input type="text" id="Custodian" name="Custodian" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="AssetNo" class="form-label fw-bold">Asset No</label>
                  <input type="text" id="AssetNo" name="AssetNo" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="SerialNumber" class="form-label fw-bold">Serial Number</label>
                  <input type="text" id="SerialNumber" name="SerialNumber" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="Location" class="form-label fw-bold">Location</label>
                  <input type="text" id="Location" name="Location" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="StartDate" class="form-label fw-bold">Start Date</label>
                  <input type="date" id="StartDate" name="StartDate" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="DateUpdated" class="form-label fw-bold">Date Updated</label>
                  <input
                    type="text"
                    id="DateUpdated"
                    name="DateUpdated"
                    class="form-control"
                    readonly
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Save</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../inventory.js"></script>
</main>
</body>
</html>
