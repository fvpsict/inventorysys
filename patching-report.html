<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Weekly Data</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li><a href="fault-report.html">Fault Report</a></li>
        <li class="active"><a href="patching-weekly.html">Patching Report</a></li>
        <li><a href="patching-summary.html">Summary</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Patching Weekly Data Input</h2>
      <textarea id="patchingInput" rows="15" placeholder="Paste weekly patching data (tab or comma separated)"></textarea>
      <div class="button-group">
        <button onclick="savePatchingData()">Submit</button>
        <button onclick="clearPatchingData()">Clear</button>
      </div>
      <div id="patchingTableContainer"></div>
    </main>
  </div>

  <script>
    function savePatchingData() {
      const input = document.getElementById('patchingInput').value.trim();
      const lines = input.split('\n');
      const parsed = lines.map(line => line.split(/\t|,/));
      localStorage.setItem('patchingData', JSON.stringify(parsed));
      renderPatchingTable(parsed);
    }

    function renderPatchingTable(data) {
      if (!data.length) return;
      const headers = data[0];
      let html = `<table class="table"><thead><tr>`;
      headers.forEach(h => html += `<th>${h}</th>`);
      html += `</tr></thead><tbody>`;
      for (let i = 1; i < data.length; i++) {
        html += '<tr>' + data[i].map((cell, colIndex) => `<td contenteditable="true" oninput="updateStoredPatching(${i}, ${colIndex}, this.innerText)">${cell}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('patchingTableContainer').innerHTML = html;
    }

    function updateStoredPatching(row, col, value) {
      const stored = JSON.parse(localStorage.getItem('patchingData'));
      if (stored && stored[row]) {
        stored[row][col] = value;
        localStorage.setItem('patchingData', JSON.stringify(stored));
      }
    }

    function clearPatchingData() {
      localStorage.removeItem('patchingData');
      document.getElementById('patchingTableContainer').innerHTML = '';
      document.getElementById('patchingInput').value = '';
    }

    window.onload = () => {
      const stored = localStorage.getItem('patchingData');
      if (stored) {
        const parsed = JSON.parse(stored);
        renderPatchingTable(parsed);
        document.getElementById('patchingInput').value = parsed.map(row => row.join(',')).join('\n');
      }
    }
  </script>
</body>
</html>
