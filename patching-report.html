<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fault Report - Inventory System</title>
  <link rel="stylesheet" href="styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    /* Page-specific styles */
    .main-content {
      padding: 1rem;
      margin-left: 220px; /* leave space for sidebar */
      min-height: 100vh;
    }

    textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      margin-bottom: 1rem;
      padding: 0.5rem;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 1rem;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f4f4f4;
    }

    tfoot tr {
      background-color: #eee;
      font-weight: bold;
    }

    button {
      padding: 8px 15px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #fff;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ddd;
    }

    /* Sidebar styles */
    .menu-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      height: 100vh;
      background-color: #222;
      color: #fff;
      padding: 1rem;
      box-sizing: border-box;
    }

    .menu-sidebar h3 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      border-bottom: 1px solid #444;
      padding-bottom: 0.5rem;
    }

    .menu-sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-sidebar ul li {
      margin: 1rem 0;
    }

    .menu-sidebar ul li a {
      color: #ccc;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .menu-sidebar ul li.active a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav class="menu-sidebar" aria-label="Inventory System Navigation">
    <h3>Inventory Menu</h3>
    <ul>
      <li><a href="index.html"><i class="fas fa-boxes"></i> View Inventory</a></li>
      <li class="active"><a href="#"><i class="fas fa-tools"></i> Fault Report</a></li>
      <li><a href="patching-report.html"><i class="fas fa-calendar-check"></i> Patching Report</a></li>
    </ul>
  </nav>

  <main class="main-content" role="main" tabindex="-1">
    <h1>Fault Report</h1>

    <p>
      Paste your raw fault report data below (tab or comma separated columns) including headers.<br />
      Then click "Process Data" to generate the table and summary counts.
    </p>

    <textarea
      id="rawFaultData"
      placeholder="Paste raw fault report data here..."
    ></textarea>
    <br />
    <button onclick="processFaultData()">Process Data</button>

    <h2>Parsed Fault Report Data</h2>
    <table id="faultTable" aria-label="Fault Report Data Table">
      <thead></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>

    <h2>Summary by Status</h2>
    <ul id="statusSummary"></ul>
  </main>

  <script>
    // Columns expected for fault status summary - adjust as needed
    const statusColumnName = 'STATUS'; // header column for status

    function processFaultData() {
      const raw = document.getElementById('rawFaultData').value.trim();
      if (!raw) {
        alert('Please paste your raw fault report data first.');
        return;
      }

      const lines = raw.split(/\r?\n/).filter((l) => l.trim() !== '');
      const delimiter = lines[0].includes('\t') ? '\t' : ',';

      // Parse headers
      const headers = lines[0].split(delimiter).map((h) => h.trim());

      // Get index of STATUS column for summary
      const statusIdx = headers.findIndex(
        (h) => h.toUpperCase() === statusColumnName.toUpperCase()
      );

      const table = document.getElementById('faultTable');
      const thead = table.querySelector('thead');
      const tbody = table.querySelector('tbody');
      const tfoot = table.querySelector('tfoot');
      const summaryList = document.getElementById('statusSummary');
      thead.innerHTML = '';
      tbody.innerHTML = '';
      tfoot.innerHTML = '';
      summaryList.innerHTML = '';

      // Build header row
      const headerRow = document.createElement('tr');
      headers.forEach((h) => {
        const th = document.createElement('th');
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Collect status counts
      const statusCounts = {};

      // Build data rows
      for (let i = 1; i < lines.length; i++) {
        const row = document.createElement('tr');
        const cells = lines[i].split(delimiter);
        cells.forEach((cell, idx) => {
          const td = document.createElement('td');
          td.textContent = cell.trim();
          row.appendChild(td);
        });
        tbody.appendChild(row);

        // Count statuses
        if (statusIdx !== -1) {
          const statusVal = (cells[statusIdx] || '').trim().toUpperCase();
          if (statusVal) {
            statusCounts[statusVal] = (statusCounts[statusVal] || 0) + 1;
          }
        }
      }

      // Footer row: total count of rows
      const footerRow = document.createElement('tr');
      headers.forEach((h, idx) => {
        const td = document.createElement('td');
        if (idx === 0) {
          td.textContent = 'TOTAL ROWS';
          td.style.fontWeight = 'bold';
          td.style.textAlign = 'left';
        } else if (idx === 1) {
          td.textContent = lines.length - 1;
        } else {
          td.textContent = '';
        }
        footerRow.appendChild(td);
      });
      tfoot.appendChild(footerRow);

      // Display summary counts
      for (const [status, count] of Object.entries(statusCounts)) {
        const li = document.createElement('li');
        li.textContent = `${status}: ${count}`;
        summaryList.appendChild(li);
      }
    }
  </script>
</body>
</html>
