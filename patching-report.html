<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .menu-wrapper {
      display: flex;
      height: 100vh;
    }

    .menu-sidebar {
      width: 200px;
      background: #343a40;
      color: white;
      padding: 1rem;
    }

    .menu-sidebar h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .menu-list {
      list-style: none;
      padding: 0;
    }

    .menu-list li {
      margin: 0.5rem 0;
    }

    .menu-list li a {
      color: white;
      text-decoration: none;
    }

    .menu-list li.active > a {
      font-weight: bold;
      text-decoration: underline;
    }

    .submenu-list {
      list-style: none;
      padding-left: 1rem;
      margin-top: 0.25rem;
    }

    .submenu-list li a {
      font-size: 0.9rem;
      color: #ccc;
      text-decoration: none;
    }

    .submenu-list li a:hover {
      text-decoration: underline;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: #f9f9f9;
    }

    textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 1rem;
      font-family: monospace;
      resize: vertical;
    }

    .table th, .table td {
      border: 1px solid #ccc;
      padding: 0.5rem;
    }

    .button-group button {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="menu-wrapper">
    <nav class="menu-sidebar">
      <h3>Inventory Menu</h3>
      <ul class="menu-list">
        <li><a href="view-inventory/index.html">View Inventory</a></li>
        <li><a href="fault-report.html">Fault Report</a></li>
        
        <li class="active">
          <a href="patching-report.html">Patching Report</a>
          <ul class="submenu-list">
            <li><a href="patching-summary.html">Summary</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Patching Report Data Input</h2>
      <textarea id="patchingInput" rows="12" placeholder="Paste weekly patching data (tab or comma separated)"></textarea>

      <div class="button-group mb-3">
        <button class="btn btn-primary" onclick="savePatchingData()">Submit</button>
        <button class="btn btn-secondary" onclick="clearPatchingData()">Clear</button>
        <button class="btn btn-success" onclick="exportCSV()">Export CSV</button>
      </div>

      <div id="patchingTableContainer" class="table-responsive"></div>
    </main>
  </div>

  <script>
    function savePatchingData() {
      const input = document.getElementById('patchingInput').value.trim();
      const lines = input.split('\n');
      const parsed = lines.map(line => line.split(/\t|,/));
      localStorage.setItem('patchingData', JSON.stringify(parsed));
      renderPatchingTable(parsed);
    }

    function renderPatchingTable(data) {
      if (!data.length) return;

      const headers = data[0];
      let html = '<table class="table table-bordered table-hover"><thead><tr>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';

      for (let i = 1; i < data.length; i++) {
        html += '<tr>' + data[i].map((cell, colIndex) =>
          `<td contenteditable="true" oninput="updateStoredPatching(${i}, ${colIndex}, this.innerText)">${cell}</td>`
        ).join('') + '</tr>';
      }

      html += '</tbody></table>';
      document.getElementById('patchingTableContainer').innerHTML = html;
    }

    function updateStoredPatching(row, col, value) {
      const stored = JSON.parse(localStorage.getItem('patchingData'));
      if (stored && stored[row]) {
        stored[row][col] = value;
        localStorage.setItem('patchingData', JSON.stringify(stored));
      }
    }

    function clearPatchingData() {
      localStorage.removeItem('patchingData');
      document.getElementById('patchingInput').value = '';
      document.getElementById('patchingTableContainer').innerHTML = '';
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem('patchingData') || '[]');
      if (!data.length) return;

      const csv = data.map(row =>
        row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(',')
      ).join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'patching-data.csv';
      a.click();
    }

    window.onload = () => {
      const stored = localStorage.getItem('patchingData');
      if (stored) {
        const parsed = JSON.parse(stored);
        renderPatchingTable(parsed);
        document.getElementById('patchingInput').value = parsed.map(row => row.join(',')).join('\n');
      }
    };
  </script>
</body>
</html>
