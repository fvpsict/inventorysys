<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patching Report - Inventory System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1rem; }
    textarea, input[type="date"] {
      width: 100%; margin-bottom: 1rem; padding: 0.5rem; font-family: monospace;
    }
    table {
      border-collapse: collapse; width: 100%; margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ddd; padding: 8px; text-align: center;
    }
    th {
      background: #f4f4f4;
    }
    tfoot tr {
      font-weight: bold;
      background-color: #eee;
    }
    label { font-weight: bold; }
    button {
      padding: 8px 15px; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Patching Report</h1>

<label for="reportDate">Select Date for this Data:</label>
<input type="date" id="reportDate" />

<label for="rawData">Paste Raw Device Data Here (with headers):</label>
<textarea id="rawData" rows="10" placeholder="Paste raw CSV or tab-separated data including headers"></textarea>

<button onclick="processData()">Process Data</button>

<h2>Summary Table</h2>
<table id="summaryTable" aria-label="Patching Summary Table">
  <thead></thead>
  <tbody></tbody>
</table>

<script>
  // Expected summary columns
  const summaryHeaders = [
    'DATE',
    'ADMIN INSTALLED',
    'ACAD INSTALLED',
    'ADMIN SCCM EPP > 4 wks',
    'ACAD SCCM EPP > 4 wks',
    'ADMIN NOT CONNECTED',
    'ACAD NOT CONNECTED',
    'ADMIN REQUIRED',
    'ACAD REQUIRED',
    'ADMIN UNKNOWN',
    'ACAD UNKNOWN',
    'E-EXAM',
    'FAULTY',
    'Tech Refresh',
    'Percentage'
  ];

  // Status categories mapped to summary columns
  // This mapping depends on Status text in raw data, you can adjust it here:
  const statusMapping = {
    'INSTALLED': ['ADMIN INSTALLED', 'ACAD INSTALLED'],
    'SCCM EPP > 4 wks': ['ADMIN SCCM EPP > 4 wks', 'ACAD SCCM EPP > 4 wks'],
    'NOT CONNECTED': ['ADMIN NOT CONNECTED', 'ACAD NOT CONNECTED'],
    'REQUIRED': ['ADMIN REQUIRED', 'ACAD REQUIRED'],
    'UNKNOWN': ['ADMIN UNKNOWN', 'ACAD UNKNOWN'],
    'E-EXAM': ['E-EXAM'],
    'FAULTY': ['FAULTY'],
    'Tech Refresh': ['Tech Refresh']
  };

  function processData() {
    const raw = document.getElementById('rawData').value.trim();
    const reportDate = document.getElementById('reportDate').value;

    if (!reportDate) {
      alert('Please select the date for this report data.');
      return;
    }
    if (!raw) {
      alert('Please paste the raw device data first.');
      return;
    }

    const lines = raw.split(/\r?\n/).filter(l => l.trim() !== '');
    const delimiter = lines[0].includes('\t') ? '\t' : ',';
    const headers = lines[0].split(delimiter).map(h => h.trim());

    // Required columns in raw data
    const requiredColumns = ['Profile', 'Status'];

    for (const col of requiredColumns) {
      if (!headers.includes(col)) {
        alert(`Raw data must include the "${col}" column.`);
        return;
      }
    }

    const profileIndex = headers.indexOf('Profile');
    const statusIndex = headers.indexOf('Status');

    // Initialize counters
    const summary = {};
    // Initialize all summary headers (except DATE and Percentage) to 0
    summaryHeaders.forEach(h => {
      if (h !== 'DATE' && h !== 'Percentage') summary[h] = 0;
    });

    let totalDevices = 0;
    let totalInstalled = 0;

    // Process each data line
    for (let i = 1; i < lines.length; i++) {
      const cells = lines[i].split(delimiter).map(c => c.trim());
      const profile = cells[profileIndex]?.toUpperCase() || '';
      const status = cells[statusIndex]?.toUpperCase() || '';

      totalDevices++;

      // Map status to summary column(s)
      for (const [key, columns] of Object.entries(statusMapping)) {
        if (status.includes(key)) {
          columns.forEach(col => {
            if (col.startsWith('ADMIN') && profile === 'ADMIN') summary[col]++;
            else if (col.startsWith('ACAD') && profile === 'ACAD') summary[col]++;
            else if (!col.startsWith('ADMIN') && !col.startsWith('ACAD')) summary[col]++;
          });
        }
      }

      // Count installed for percentage calculation
      if (status.includes('INSTALLED')) {
        if ((profile === 'ADMIN') || (profile === 'ACAD')) {
          totalInstalled++;
        }
      }
    }

    // Calculate Percentage (Installed / totalDevices * 100)
    summary['Percentage'] = totalDevices > 0 ? ((totalInstalled / totalDevices) * 100).toFixed(2) + '%' : '0%';

    // Show summary in table
    const thead = document.querySelector('#summaryTable thead');
    const tbody = document.querySelector('#summaryTable tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    // Create header row
    const headerRow = document.createElement('tr');
    summaryHeaders.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    // Create data row
    const dataRow = document.createElement('tr');
    summaryHeaders.forEach(h => {
      const td = document.createElement('td');
      if (h === 'DATE') td.textContent = reportDate;
      else td.textContent = summary[h] !== undefined ? summary[h] : '';
      dataRow.appendChild(td);
    });
    tbody.appendChild(dataRow);
  }
</script>

</body>
</html>
